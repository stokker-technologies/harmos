# === Package ===

[package]
name = "harmos-lifecycle-fixture"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version = { workspace = true }

# === Package Targets ===

[[bin]]
name = "harmos-lifecycle-fixture"
path = "src/main.rs"

[[bin]]
name = "harmos-lifecycle-sidecar"
path = "src/sidecar.rs"

# === Features ===

# === Dependencies ===

[dependencies]
# Local
harmos = { workspace = true, default-features = true, features = [
  "plugin-guest",
  "plugin-sidecar",
] }
schematic-app = { path = "../../../examples/schematic/app" }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }
