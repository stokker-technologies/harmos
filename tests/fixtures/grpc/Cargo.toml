# === Package ===

[package]
name = "harmos-grpc-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

# === Package Targets ===

# === Features ===

[features]
default = []
grpc = [
  "dep:thiserror",
  "dep:tracing",
  "dep:harmos",
  "dep:prost",
  "dep:prost-reflect",
  "dep:tonic",
  "dep:tonic-prost",
  "dep:tonic-prost-build",
  "dep:tokio",
  "dep:futures-util",
]

# === Dependencies ===

[dependencies]
# Local
harmos = { path = "../../../crates/harmos", default-features = false, features = [
  "grpc",
], optional = true }

# Git

# Error Handling
thiserror = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }

# Utilities

# Serialization
prost = { workspace = true, default-features = true, optional = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
], optional = true }

# Networking
tonic = { workspace = true, default-features = true, optional = true }
tonic-prost = { workspace = true, default-features = true, optional = true }

# Storage

# UI

# Testing

