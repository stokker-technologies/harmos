# === Package === #

[package]
name = "harmos-sdk-derive"
autotests = false
description = "Field-reading protobuf, stored-schema, request and row derives for Harmos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# === Package Targets === #

[lib]
proc-macro = true

# === Features === #

# === Dependencies === #

[dependencies]
# Serialization
serde_json = { workspace = true, default-features = true }

# Parsing
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true, default-features = true }
quote = { workspace = true, default-features = true }
syn = { workspace = true, default-features = true }

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Utilities
sha2 = { workspace = true, default-features = true }

# Filesystem
tempfile = { workspace = true }

# === Target Dependencies === #

# === Test Targets === #

[[test]]
name = "integration"
path = "tests/artifact/main.rs"

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

