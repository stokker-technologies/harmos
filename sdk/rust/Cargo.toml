# === Package === #

[package]
name = "harmos"
description = "Rust plugin authoring over the Harmos v1 gRPC protocol."
autotests = false
autobins = false
exclude = ["src/bin/**"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# === Package Targets === #

# === Features === #

# === Dependencies === #

[dependencies]
# Local
harmos-protocol = { workspace = true }
harmos-sdk-derive = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
bytes = { workspace = true }
semver = { workspace = true }

# Serialization
prost = { workspace = true, features = ["derive", "std"] }
prost-reflect = { workspace = true }
prost-types = { workspace = true, features = ["std"] }

# Async
futures-core = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }

# Networking
tonic = { workspace = true, features = ["codegen", "router", "transport"] }

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Local
harmos-conformance = { path = "../../crates/harmos-conformance" }

# Serialization
serde_json = { workspace = true, features = ["std"] }

# Filesystem
tempfile = { workspace = true }

# Async
tokio = { workspace = true, features = ["process", "io-util"] }

# === Target Dependencies === #

# === Test Targets === #

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# === Bench Targets === #

# === Example Targets === #

# === Workspace Lints === #

# === Lints === #

[lints]
workspace = true

# === Profiles === #

# === Patches === #

# === Other === #
