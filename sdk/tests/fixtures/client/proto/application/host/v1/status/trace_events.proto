// Trace Events
//
// Reference Product Wrapper

syntax = "proto3";

package application.host.v1.status;

// === Imports === //

import "harmos/host/v1/status/trace_events.proto";
import "harmos/model/v1/callers.proto";

// === Options === //

option csharp_namespace = "Application.Clients";

// === Services === //

// Reference product authorization boundary over native host operations.
service TraceEvents {
  // Read bounded retained redacted trace events at an issued boundary; expired tokens/positions and responses too small for one event refuse.
  rpc List(harmos.host.v1.status.TraceEventsListRequest) returns (harmos.host.v1.status.TraceEventsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Emit an opening boundary then bounded trace batches after it; positive bounds are required and a history gap refuses with resynchronization guidance.
  rpc Watch(harmos.host.v1.status.TraceEventsWatchRequest) returns (stream harmos.host.v1.status.TraceEventsWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

