// Streams
//
// Reference Product Wrapper

syntax = "proto3";

package application.host.v1;

// === Imports === //

import "harmos/host/v1/streams.proto";
import "harmos/model/v1/callers.proto";

// === Options === //

option csharp_namespace = "Application.Clients";

// === Services === //

// Reference product authorization boundary over native host operations.
service Streams {
  // Return all stream identities matching the optional schema identity; this bounded registry has no paging.
  rpc List(harmos.host.v1.StreamsListRequest) returns (harmos.host.v1.StreamsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

