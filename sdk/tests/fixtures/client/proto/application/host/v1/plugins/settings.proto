// Settings
//
// Reference Product Wrapper

syntax = "proto3";

package application.host.v1.plugins;

// === Imports === //

import "harmos/host/v1/plugins/settings.proto";
import "harmos/model/v1/callers.proto";

// === Options === //

option csharp_namespace = "Application.Clients";

// === Services === //

// Reference product authorization boundary over native host operations.
service Settings {
  // Read declarations, complete values, revision and issued cut; plugin callers are restricted to their own entry.
  rpc List(harmos.host.v1.plugins.SettingsListRequest) returns (harmos.host.v1.plugins.SettingsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Replace the complete setting values at the expected revision; identical request identity and input replay the original receipt, while changed input refuses.
  rpc Set(harmos.host.v1.plugins.SettingsSetRequest) returns (harmos.host.v1.plugins.SettingsSetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

