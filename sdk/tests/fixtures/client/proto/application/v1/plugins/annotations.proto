// Application Plugin Annotations
//
// An application-owned resource composed under the library Plugins parent.

syntax = "proto3";

package application.v1.plugins;

// === Imports === //

// === Options === //

// === Services === //

// Stores application-owned per-plugin data outside the library settings owner.
service Annotations {
  // Read the application's annotation for one plugin entry.
  rpc Get(AnnotationsGetRequest) returns (AnnotationsGetResponse);
}

// === Requests and Responses === //

// Selects one application annotation by library plugin entry name.
message AnnotationsGetRequest {
  string name = 1;
}

// Returns the application's per-plugin annotation.
message AnnotationsGetResponse {
  string value = 1;
}

