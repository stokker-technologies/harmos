# === Package ===

[package]
name = "minibench-probe-sidecar"
description = "Reads a native probe and publishes its measurements."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The contract crate and nothing above it: a plugin compiles the bench's contract
# with its plugins, never the host half that serves it.
version = { workspace = true }

# === Package Targets ===

# === Features ===

# === Dependencies ===

[dependencies]
# Local
harmos = { path = "../../../crates/harmos", default-features = false, features = [
  "derive",
  "sidecar",
] }
minibench-contract = { path = "../contract" }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities

# Serialization
serde = { workspace = true, default-features = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread"] }

# Networking

# Storage

# UI

# Testing

