# === Package ===

[package]
name = "minibench-app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version = { workspace = true }

# === Package Targets ===

# === Features ===

[features]
default = []
sim = ["harmos/sim"]

# === Dependencies ===

# Runtime launch waits for the supervised native generation before binding its
# operation catalog. The startup wait is finite; cleanup remains awaited.
[dependencies]
# Local
harmos = { workspace = true, default-features = true, features = ["sidecar-host", "artifact"] }
minibench-contract = { path = "../contract" }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
sha2 = { workspace = true, default-features = true }

# Serialization
serde = { workspace = true, default-features = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, default-features = true, features = ["macros", "rt", "time"] }

