# === Package ===

[package]
publish = false
name = "schematic-sidecar"
description = "Portable schematic analysis and routing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

# === Package Targets ===

# === Features ===

# === Dependencies ===

[dependencies]
# Local
harmos-domain = { workspace = true, features = ["derive"] }
harmos-sidecar = { workspace = true, features = ["derive", "kit", "streaming"] }
schematic-domain = { path = "../domain" }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, default-features = true, features = [
  "macros",
  "rt-multi-thread",
  "sync",
] }

# Networking

# Storage

# UI

# Testing

# === Build Dependencies ===

[build-dependencies]
# Local
harmos-domain = { workspace = true }
harmos-packaging = { workspace = true, features = ["bindings-proto"] }
schematic-domain = { path = "../domain", features = ["grpc"] }

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Dev Dependencies ===

[dev-dependencies]
# Local
schematic-guest = { path = "../guest" }

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

