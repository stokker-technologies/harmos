# === Package ===

[package]
name = "schematic-sidecar"
description = "Portable schematic analysis and routing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

# === Package Targets ===

# === Features ===

# === Dependencies ===

[dependencies]
# Local
harmos = { workspace = true, features = ["plugin-sidecar"] }
schematic-domain = { path = "../domain" }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities

