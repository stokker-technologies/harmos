# === Package === #

[package]
publish = false
name = "schematic-sidecar"
description = "Portable schematic analysis and routing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

# === Package Targets === #

[[bin]]
name = "schematic-grpc-prototype"
path = "src/prototype.rs"
required-features = ["prototype-grpc"]

# === Features === #

[features]
benchmark = []
prototype-grpc = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema", "dep:harmos-sidecar", "dep:serde_json"]

# === Dependencies === #

[dependencies]
# Local
harmos = { workspace = true, features = ["sidecar"] }
harmos-sidecar = { workspace = true, features = ["prototype-grpc"], optional = true }
schematic-domain = { path = "../domain" }
schematic-operations = { path = "../operations", features = ["runtime"] }

# Git

# Error Handling

# Logging
tracing = { workspace = true, default-features = true }
tracing-perfetto-file = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities

# Serialization
arrow-array = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
serde_json = { workspace = true, default-features = true, optional = true }

# Configuration

# Filesystem
tempfile = { workspace = true, default-features = true }

# Parsing

# Concurrency

# Async
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "sync"] }

# Networking

# Storage

# UI

# Testing

# === Build Dependencies === #

[build-dependencies]
# Local
harmos-domain = { workspace = true }
harmos-packaging = { workspace = true, features = ["generate-proto"] }
schematic-operations = { path = "../operations" }

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Dev Dependencies === #

[dev-dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities

# Serialization
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Target Dependencies === #

# === Test Targets === #

[[test]]
name = "system-prototype"
path = "tests/system/main.rs"
required-features = ["prototype-grpc"]

# === Bench Targets === #

# === Example Targets === #

# === Workspace Lints === #

# === Lints === #

[lints]
workspace = true

