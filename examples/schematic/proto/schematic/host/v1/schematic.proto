syntax = "proto3";

package schematic.host.v1;

// === Imports === //

import "harmos/model/v1/callers.proto";
import "schematic/host/v1/files.proto";
import "schematic/model/v1/schematic.proto";

// === Options === //

// === Services === //

// Validates and analyzes application schematics.
service Schematic {
  // Run Validate against the application.
  rpc Validate(.schematic.host.v1.SchematicValidateRequest) returns (.schematic.host.v1.SchematicValidateResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Run ProposeRoute against the application.
  rpc ProposeRoute(.schematic.host.v1.SchematicProposeRouteRequest) returns (.schematic.host.v1.SchematicProposeRouteResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Run ListDirectories against the application.
  rpc ListDirectories(.schematic.host.v1.SchematicListDirectoriesRequest) returns (.schematic.host.v1.SchematicListDirectoriesResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Run Analyze against the application.
  rpc Analyze(.schematic.host.v1.SchematicAnalyzeRequest) returns (.schematic.host.v1.SchematicAnalyzeResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Run AnalyzeUpload against the application.
  rpc AnalyzeUpload(.schematic.host.v1.SchematicAnalyzeUploadRequest) returns (.schematic.host.v1.SchematicAnalyzeUploadResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Run AnalyzeExchange against the application.
  rpc AnalyzeExchange(.schematic.host.v1.SchematicAnalyzeExchangeRequest) returns (.schematic.host.v1.SchematicAnalyzeExchangeResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
}

// === Requests and Responses === //

// Requests validation of the supplied schematic snapshot.
message SchematicValidateRequest {
  schematic.model.v1.Snapshot schematic = 1;
}

// Returns diagnostics for invalid connections or missing symbols.
message SchematicValidateResponse {
  repeated string diagnostics = 1;
}

// Requests a right-angle route between two points.
message SchematicProposeRouteRequest {
  schematic.model.v1.Point from = 1;
  schematic.model.v1.Point to = 2;
}

// Returns the ordered points of a proposed route.
message SchematicProposeRouteResponse {
  repeated schematic.model.v1.Point points = 1;
}

// Requests immediate subdirectories of the native plugin working directory.
message SchematicListDirectoriesRequest {}

// Returns sorted immediate subdirectory names.
message SchematicListDirectoriesResponse {
  repeated string directories = 1;
}

// Requests streamed findings for the supplied snapshot.
message SchematicAnalyzeRequest {
  schematic.model.v1.Snapshot schematic = 1;
}

// Reports the number of symbols checked during analysis.
message SchematicAnalyzeResponse {
  uint32 checked = 1;
}

// Starts snapshot upload analysis under a nonblank bounded title.
message SchematicAnalyzeUploadRequest {
  string title = 1;
}

// Starts bidirectional snapshot analysis under a nonblank bounded title.
message SchematicAnalyzeExchangeRequest {
  string title = 1;
}

// Starts a batch upload for a transfer identity.
message Upload {
  uint64 transfer = 1;
}

// Requests the retained batches for a transfer identity.
message Download {
  uint64 transfer = 1;
}

// Adds a batch to a transfer, optionally replacing its previous contents.
message Put {
  uint64 transfer = 1;
  bool first = 2;
  schematic.model.v1.Batch batch = 3;
}

// Reports accepted record, sample and byte counts.
message Receipt {
  uint64 records = 1;
  uint64 samples = 2;
  uint64 bytes = 3;
}

// Returns and removes the next retained batch for a transfer.
message Take {
  uint64 transfer = 1;
}

// Requests the host file-hash operation through the plugin.
message Hash {
  FilesHashRequest request = 1;
}

// Returns the number of bytes read and their SHA-256 digest.
message FileHash {
  uint64 read_bytes = 1;
  bytes sha256 = 2;
}

// Reports the number of uploaded snapshots checked.
message SchematicAnalyzeUploadResponse {
  uint32 checked = 1;
}

// Reports the number of exchanged snapshots checked.
message SchematicAnalyzeExchangeResponse {
  uint32 checked = 1;
}

