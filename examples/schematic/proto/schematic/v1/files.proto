// Schematic Files
//
// Application-owned file access over private native storage operations.

syntax = "proto3";

package schematic.v1;

// === Imports === //

import "harmos/v1/file.proto";
import "harmos/v1/position.proto";

// === Options === //

// === Services === //

// Reads immutable application files and hashes selected content.
service Files {
  // Read one bounded range of a published application file.
  rpc Read(FilesReadRequest) returns (FilesReadResponse);
  // Hash a selected range of a published file or an explicit local path.
  rpc Hash(FilesHashRequest) returns (FilesHashResponse);
}

// === Requests and Responses === //

// Selects one published file range; zero max_bytes uses the storage chunk setting.
message FilesReadRequest {
  harmos.v1.File file = 1;
  uint64 offset = 2;
  uint64 max_bytes = 3;
  harmos.v1.ReadCut at = 4;
}

// Returns a bounded content range and its issued read cut.
message FilesReadResponse {
  uint64 offset = 1;
  bytes bytes = 2;
  bool complete = 3;
  harmos.v1.ReadCut resolved_at = 4;
}

// Selects one file source and an optional bounded range for hashing.
message FilesHashRequest {
  // The example permits explicit filesystem paths and immutable stored content.
  oneof source {
    harmos.v1.File file = 1;
    string path = 2;
  }
  uint64 offset = 3;
  optional uint64 length = 4;
  harmos.v1.ReadCut at = 5;
}

// Returns the digest of exactly the selected bytes and its issued read cut.
message FilesHashResponse {
  uint64 read_bytes = 1;
  bytes sha256 = 2;
  harmos.v1.ReadCut resolved_at = 3;
}

