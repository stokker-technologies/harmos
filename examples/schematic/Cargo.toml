# === Workspace === #

[workspace]
resolver = "3"
members = ["app", "cli", "domain", "guest", "sidecar", "storage"]

# === Workspace Package === #

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# === Workspace Dependencies === #

[workspace.dependencies]
# Local
harmos = { path = "../../crates/harmos" }
harmos-domain = { path = "../../crates/harmos-domain", default-features = false }
harmos-guest = { path = "../../crates/harmos-guest", default-features = false }
harmos-packaging = { path = "../../crates/harmos-packaging", default-features = false }
harmos-sidecar = { path = "../../crates/harmos-sidecar", default-features = false }

# Git

# Error Handling
thiserror = { version = "2", default-features = false }

# Logging
tracing = { version = "0.1", default-features = false }
tracing-perfetto-file = { version = "0.1.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# Utilities
sha2 = { version = "0.11.0", default-features = false }

# Serialization
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }

# Configuration
clap = { version = "4", default-features = false }

# Filesystem
tempfile = { version = "3", default-features = false }

# Parsing

# Concurrency

# Async
tokio = { version = "1", default-features = false, features = ["sync"] }

# Networking

# Storage

# UI

# Testing

# === Workspace Lints === #

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# === Lints === #

# === Profiles === #

# === Patches === #

# === Other === #
