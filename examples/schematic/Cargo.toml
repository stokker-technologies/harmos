# === Workspace === #

[workspace]
resolver = "3"
members = ["app", "cli", "domain", "guest", "operations", "protocol", "sidecar", "storage"]

# === Workspace Package === #

[workspace.package]
version = "0.1.14"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# === Workspace Dependencies === #

[workspace.dependencies]
# Local
harmos-runtime = { path = "../../crates/harmos-runtime", default-features = false }
harmos-operations = { path = "../../crates/harmos-operations", default-features = false }
harmos-protocol = { path = "../../crates/harmos-protocol" }
harmos-domain = { path = "../../crates/harmos-domain", default-features = false }
harmos-packaging = { path = "../../tools/packaging", default-features = false }
harmos = { path = "../../sdk/rust" }

# Git

# Error Handling
thiserror = { version = "2.0.21", default-features = false }

# Logging
tracing = { version = "0.1.44", default-features = false }
tracing-perfetto-file = { version = "0.1.1", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

# Utilities
sha2 = { version = "0.11.1", default-features = false }

# Serialization
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
prost-reflect = { version = "0.16.5", default-features = false }
prost-types = { version = "0.14.4", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false }

# Configuration
clap = { version = "4.6.7", default-features = false }

# Filesystem
tempfile = { version = "3.27.0", default-features = false }

# Parsing

# Concurrency

# Async
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

# Networking

# Storage

# UI

# Testing

# === Workspace Lints === #

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# === Lints === #

# === Profiles === #

# Keep SDK Descriptor Validation Within The Runtime Fuel Budget In Dev Builds.
[profile.dev.package.harmos]
opt-level = 2

[profile.dev.package.harmos-protocol]
opt-level = 2

# Keep Full Guest Metadata Validation Within The Same Fuel Budget In Dev Builds.
[profile.dev.package.harmos-domain]
opt-level = 2

[profile.dev.package.harmos-operations]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

# === Patches === #

# === Other === #
