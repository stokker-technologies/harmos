# Generated Application Contracts Shared With Native Plugins and Clients.
version = { workspace = true }

# === Package Targets === #

# === Features === #

[features]
default = []
sdk = ["dep:harmos", "dep:tonic"]

# === Dependencies === #

[dependencies]
# Local
harmos-protocol = { workspace = true }
harmos = { workspace = true, optional = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
prost-types = { workspace = true }
tonic = { version = "0.14.9", default-features = false, features = ["codegen"], optional = true }

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem

# Parsing

