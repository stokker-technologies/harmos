# === Dev Dependencies === #

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Serialization
prost-build = { workspace = true, features = ["format"] }
protoc-bin-vendored = { workspace = true }

# Filesystem
tempfile = { workspace = true, default-features = true }

