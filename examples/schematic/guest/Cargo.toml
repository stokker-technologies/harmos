# === Package === #

[package]
publish = false
name = "schematic-guest"
description = "Portable schematic analysis and routing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version = { workspace = true }

# === Package Targets === #

[lib]
crate-type = ["cdylib", "rlib"]

# === Features === #

[features]
benchmark = []

# === Dependencies === #

# The Guest Executes Shared Operations With Target-Compatible Resources.
[dependencies]
# Local
harmos = { workspace = true, features = ["guest"] }
schematic-operations = { path = "../operations", features = ["runtime"] }

