# === Package ===

[package]
publish = false
name = "schematic-guest"
description = "Portable schematic analysis and routing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version = { workspace = true }

# === Package Targets ===

[lib]
crate-type = ["cdylib", "rlib"]

# === Features ===

# === Dependencies ===

# The domain crate and nothing above it: a guest compiles the editor's domain
# with its plugins, never the host half that serves it.
[dependencies]
# Local
harmos-guest = { workspace = true, features = ["derive", "grpc", "kit", "streaming"] }
schematic-domain = { path = "../domain" }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities

# Serialization
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

