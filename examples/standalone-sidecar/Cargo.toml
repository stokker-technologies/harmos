# === Package ===

[package]
name = "standalone-sidecar"
description = "A sidecar authored against the kit alone, with none of the host core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The whole point of this crate, and the reason it is not a chapter of either
# walkthrough: `default-features = false` turns the host core off, so what a
# sidecar author compiles is the authoring kit and the declaration types and
# nothing else. If a declaration attribute ever reaches into the runtime, this
# member stops compiling — which is the only way that claim stays true.
version = { workspace = true }

# === Package Targets ===

# === Features ===

# === Dependencies ===

[dependencies]
# Local
harmos = { path = "../../crates/harmos", default-features = false, features = [
  "derive",
  "sidecar",
  "artifact",
] }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities

# Serialization
serde = { workspace = true, default-features = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread"] }

