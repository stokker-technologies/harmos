# === Package ===

[package]
name = "minischematic-cli"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version = { workspace = true }

# === Package Targets ===

# === Features ===

# === Dependencies ===

[dependencies]
# Local
harmos = { workspace = true, default-features = true, features = ["guest-host", "artifact"] }
minischematic-app = { path = "../app" }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Utilities

# Serialization
serde_json = { workspace = true, default-features = true }

# Configuration
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }

# Filesystem
tempfile = { workspace = true, default-features = true }

# Parsing

# Concurrency

# Async
futures-core = { workspace = true, default-features = true }
tokio = { workspace = true, default-features = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "time",
  "signal",
] }

