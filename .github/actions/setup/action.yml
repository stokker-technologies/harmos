name: Native Toolchain
description: Install Verified Stable Mise And Locked Native Tools
inputs:
  cargo-cache-role:
    description: Cargo Compilation Profile For This Job
    required: false
    default: none
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .cache/mise
          .mise-data
          .cache/cargo/registry
          .cache/cargo/git
          .cache/uv
        key: native-${{ runner.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'tools/python/uv.lock') }}
    - name: Install Mise On Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sh tools/ci/install-mise.sh
        echo "$GITHUB_WORKSPACE/.tmp/mise/bin" >> "$GITHUB_PATH"
    - name: Install Mise On Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        . ./tools/ci/install-mise.ps1
        "$PWD/.tmp/mise/mise/bin" >> $env:GITHUB_PATH
        $before = @{}
        Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
        . ./tools/ci/bootstrap.ps1
        Get-ChildItem Env: | Where-Object { $_.Name -notmatch '^(GITHUB_|RUNNER_|PATH$)' -and $before[$_.Name] -ne $_.Value } | ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        $env:PATH.Substring(0, $env:PATH.Length - $before['PATH'].Length).TrimEnd(';') -split ';' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    - name: Install Locked Tools On Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mise install --locked
        mise ls --current
        mise run ci:bootstrap
        mise exec -- rustc -vV
        mise exec -- cargo --version
        mise exec -- python --version
        mise exec -- uv --version
    - name: Install Locked Tools On Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        mise install --locked
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise ls --current
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise run ci:bootstrap
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise exec -- rustc -vV
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise exec -- cargo --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise exec -- python --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise exec -- uv --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Cache Cargo Compilation
      if: inputs.cargo-cache-role != 'none'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          target/debug
          target/release
          target/wasm32-unknown-unknown/debug
          target/wasm32-unknown-unknown/release
          target/wasm32-wasip2/debug
          target/fixtures/harmos/build
          target/validation/cargo/coverage
          !target/**/*.profraw
          !target/**/*.profdata
        key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cargo-cache-role }}-${{ hashFiles('mise.lock', 'mise.toml', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'examples/**/Cargo.toml', 'tests/fixtures/**/Cargo.toml', '.cargo/config*', 'tools/python/uv.lock', 'tools/python/pyproject.toml', 'tools/python/src/harmos_tools/evidence.py', 'tools/python/src/harmos_tools/artifacts.py', '.github/actions/setup/action.yml') }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cargo-cache-role }}-${{ hashFiles('mise.lock', 'mise.toml', 'Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'examples/**/Cargo.toml', 'tests/fixtures/**/Cargo.toml', '.cargo/config*', 'tools/python/uv.lock', 'tools/python/pyproject.toml', 'tools/python/src/harmos_tools/evidence.py', 'tools/python/src/harmos_tools/artifacts.py', '.github/actions/setup/action.yml') }}-
