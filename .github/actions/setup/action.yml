name: Native Toolchain
description: Install Verified Stable Mise And Locked Native Tools
inputs:
  profile:
    description: Source Checks Or Complete Native Toolchain
    required: false
    default: native
  cargo-cache-role:
    description: Cargo Compilation Profile For This Job
    required: false
    default: none
  cache-write:
    description: Save Updated Caches From Preparation Jobs
    required: false
    default: 'false'
outputs:
  compiler-cache-paths:
    description: Profile-Scoped Compiler Cache Paths
    value: ${{ steps.compiler-inputs.outputs.paths }}
  downloads-cache-key:
    description: Dependency Download Cache Key For Preparation Jobs
    value: ${{ steps.downloads-cache.outputs.cache-primary-key }}
  downloads-cache-hit:
    description: Whether The Exact Download Cache Was Restored
    value: ${{ steps.downloads-cache.outputs.cache-hit }}
  compiler-cache-key:
    description: Exact Rolling Compiler Cache Key For Preparation Jobs
    value: ${{ steps.compiler-cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Select Source Check Tools
      if: inputs.profile == 'source'
      shell: bash
      run: echo 'MISE_ENABLE_TOOLS=taplo,rust,python,uv' >> "$GITHUB_ENV"
    - name: Identify Pinned Tools
      id: tool-inputs
      shell: bash
      run: |
        {
          cat mise.lock
          awk '/^\[tools\]$/ { selected = 1; next } selected && /^\[/ { exit } selected { print }' mise.toml
        } | sha256sum | awk '{ print "identity=" $1 }' >> "$GITHUB_OUTPUT"
    - name: Restore Installed Tools
      id: tools-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/mise
          .mise-data/installs
          .mise-data/rustup
          .mise-data/downloads
        key: tools-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ steps.tool-inputs.outputs.identity }}
        restore-keys: |
          tools-v3-${{ runner.os }}-${{ runner.arch }}-native-${{ steps.tool-inputs.outputs.identity }}
          tools-v3-${{ runner.os }}-${{ runner.arch }}-source-${{ steps.tool-inputs.outputs.identity }}
    - name: Restore Dependency Downloads
      id: downloads-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/cargo/registry/index
          .cache/cargo/registry/cache
          .cache/cargo/git/db
          .cache/uv
        key: downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tools/python/uv.lock') }}
        restore-keys: |
          downloads-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Install Mise On Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sh tools/ci/install-mise.sh
        echo "$GITHUB_WORKSPACE/.tmp/mise/bin" >> "$GITHUB_PATH"
    - name: Install Mise On Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        . ./tools/ci/install-mise.ps1
        "$PWD/.tmp/mise/mise/bin" >> $env:GITHUB_PATH
    - name: Initialize Native Windows Compiler
      if: runner.os == 'Windows' && inputs.profile != 'source'
      shell: pwsh
      run: |
        $before = @{}
        Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
        . ./tools/ci/bootstrap.ps1
        Get-ChildItem Env: | Where-Object { $_.Name -notmatch '^(GITHUB_|RUNNER_|PATH$)' -and $before[$_.Name] -ne $_.Value } | ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        $env:PATH.Substring(0, $env:PATH.Length - $before['PATH'].Length).TrimEnd(';') -split ';' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    - name: Install Locked Tools On Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ "${{ inputs.profile }}" = source ]; then
          mise install --locked taplo rust python uv
        else
          mise install --locked
          mise run ci:bootstrap
        fi
        mise ls --current
        mise exec -- rustc -vV
        mise exec -- cargo --version
        mise exec -- python --version
        mise exec -- uv --version
    - name: Install Locked Tools On Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if ('${{ inputs.profile }}' -eq 'source') {
          mise install --locked taplo rust python uv
        } else {
          mise install --locked
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ('${{ inputs.profile }}' -ne 'source') {
          mise run ci:bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        mise ls --current
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise exec -- rustc -vV
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise exec -- cargo --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise exec -- python --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        mise exec -- uv --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Select Compiler Cache
      id: compiler-inputs
      if: inputs.cargo-cache-role != 'none'
      shell: bash
      env:
        CACHE_ROLE: ${{ inputs.cargo-cache-role }}
      run: |
        case "$CACHE_ROLE" in
          release) paths=$'target/release\ntarget/*/release' ;;
          integration) paths=$'target/debug\ntarget/fixtures/harmos/build' ;;
          coverage) paths=$'target/validation/cargo/coverage\ntarget/fixtures/harmos/build' ;;
          *) echo "Unknown compiler cache role: $CACHE_ROLE" >&2; exit 1 ;;
        esac
        {
          echo 'paths<<CACHE_PATHS'
          echo "$paths"
          echo '!target/**/*.profraw'
          echo '!target/**/*.profdata'
          echo CACHE_PATHS
          mise exec -- python - <<'PYTHON'
        import hashlib
        import json
        import os
        import subprocess
        compiler = subprocess.check_output(["rustc", "-vV"], text=True)
        keys = ("RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "RUSTDOCFLAGS", "RUSTC_WRAPPER", "RUSTC_WORKSPACE_WRAPPER", "CARGO_INCREMENTAL", "CARGO_BUILD_TARGET", "CARGO_BUILD_RUSTFLAGS", "CARGO_TARGET_DIR")
        identity = json.dumps([compiler, {key: os.environ.get(key) for key in keys}], sort_keys=True)
        print("identity=" + hashlib.sha256(identity.encode()).hexdigest())
        PYTHON
        } >> "$GITHUB_OUTPUT"
    - name: Restore Cargo Compilation
      id: compiler-cache
      if: inputs.cargo-cache-role != 'none'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.compiler-inputs.outputs.paths }}
        key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cargo-cache-role }}-${{ steps.compiler-inputs.outputs.identity }}-${{ hashFiles('.cargo/config*') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'examples/**/Cargo.toml', 'tests/fixtures/**/Cargo.toml', '.cargo/config*') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cargo-cache-role }}-${{ steps.compiler-inputs.outputs.identity }}-${{ hashFiles('.cargo/config*') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'examples/**/Cargo.toml', 'tests/fixtures/**/Cargo.toml', '.cargo/config*') }}-
          cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cargo-cache-role }}-${{ steps.compiler-inputs.outputs.identity }}-${{ hashFiles('.cargo/config*') }}-
    - name: Save Installed Tools
      if: inputs.cache-write == 'true' && steps.tools-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/mise
          .mise-data/installs
          .mise-data/rustup
          .mise-data/downloads
        key: ${{ steps.tools-cache.outputs.cache-primary-key }}
