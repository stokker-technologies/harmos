name: Archive / Build
description: Archive / Build
inputs:
  command:
    description: Command
    required: true
    default: ""
outputs: {}
runs:
  using: composite
  steps:
  - shell: python
    run: |-
      import os, runpy
      runpy.run_path(os.path.join(os.environ['GITHUB_ACTION_PATH'], 'run.py'), run_name='__main__')
    env:
      TRANSFER_OPERATION: pack
      TRANSFER_COMMAND: ${{ inputs.command }}
