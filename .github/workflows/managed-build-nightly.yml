name: Build
"on":
  workflow_call:
    inputs:
      runners:
        type: string
        required: true
      budgets:
        type: string
        required: true
env:
  PROFILE: >-
    ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref,
    'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  npm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  build_bench:
    name: Bench
    runs-on: ${{ fromJSON(inputs.runners).nightly.small }}
    timeout-minutes: ${{ fromJSON(inputs.budgets).build_bench }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Cache / Cargo
      id: cargo
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |-
          .cache/cargo/registry/
          .cache/cargo/git/
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-
    - name: Cache / Uv
      id: uv
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/uv/
        key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('tools/python/uv.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-uv-
    - name: Resolve Mise Directory
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $directory = Join-Path ([System.IO.Path]::GetTempPath()) 'stkr-mise'
        "MISE_DATA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Resolve Mise Directory
      if: runner.os != 'Windows'
      shell: bash
      run: printf 'MISE_DATA_DIR=%s/stkr-mise\n' "${TMPDIR:-/tmp}" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: tools
      with:
        path: ${{ env.MISE_DATA_DIR }}
        key: ${{ runner.os }}-${{ runner.arch }}-mise-v2-${{ hashFiles('mise.lock') }}
    - run: command -v cc
    - run: command -v pkg-config
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.18.0
    - run: mise run build:bench
    - name: Archive Build
      shell: bash
      run: |-
        native="$(mise exec -- uv run --locked --project tools/python python -m harmos_tools.build.paths build --profile bench)"
        native="${native##*/}"
        mkdir -p target/ci
        candidates=("target/build/bench/${native}/")
        outputs=()
        for path in "${candidates[@]}"; do
          if [ -e "$path" ]; then outputs+=("$path"); fi
        done
        [ ${#outputs[@]} -gt 0 ]
        tar --zstd -cf "target/ci/build-bench-linux.tar.zst"  -- "${outputs[@]}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: build-bench
        path: target/ci/build-bench-linux.tar.zst
        if-no-files-found: ignore
        retention-days: 7
        include-hidden-files: true
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
        steps.cargo.outputs.cache-hit != 'true'
      with:
        path: |-
          .cache/cargo/registry/
          .cache/cargo/git/
        key: ${{ steps.cargo.outputs.cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
        steps.uv.outputs.cache-hit != 'true'
      with:
        path: .cache/uv/
        key: ${{ steps.uv.outputs.cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
        steps.tools.outputs.cache-hit != 'true'
      with:
        path: ${{ env.MISE_DATA_DIR }}
        key: ${{ steps.tools.outputs.cache-primary-key }}
    - run: sccache --show-stats
      if: always()
    if: github.event_name == 'schedule'
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: linux
      MISE_ENABLE_TOOLS: >-
        node,python,rust,uv,aqua:nextest-rs/nextest/cargo-nextest,sccache,aqua:rhysd/actionlint,npm:@fission-ai/openspec,taplo,aqua:cargo-bins/cargo-binstall
