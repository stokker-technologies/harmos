name: Validation
'on':
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      selection:
        type: string
        required: true
      profile:
        type: string
        default: dev
permissions:
  contents: read
env:
  PROFILE: ${{ inputs.profile }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  check:
    if: inputs.selection == 'check'
    name: Check / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ${{ matrix.cache }}
        cache-mode: ${{ matrix.mode }}
    - name: Run Project Task
      run: mise run check -- ${{ matrix.arguments }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: matrix.cache != '' && (success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit
        != 'true')
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: ${{ matrix.tools }}
      COMPILER_CACHE_BACKEND: ${{ matrix.cache }}
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ matrix.mode }}
      CI_CACHE_PROFILE: test
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: Repository
          runner: ubuntu-24.04
          arguments: --repository
          tools: python,uv,taplo,go,go:github.com/rhysd/actionlint/cmd/actionlint,aqua:koalaman/shellcheck,aqua:bufbuild/buf
          cache: ''
          mode: ''
        - label: Rust (unix)
          runner: ubuntu-24.04
          arguments: --language rust
          tools: python,rust,uv,sccache,aqua:nextest-rs/nextest/cargo-nextest,github:bnjbvr/cargo-machete,taplo,go,go:github.com/rhysd/actionlint/cmd/actionlint,aqua:koalaman/shellcheck,aqua:bufbuild/buf
          cache: disk
          mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE' ||
            'READ_ONLY' }}
        - label: Rust (windows)
          runner: windows-2022
          arguments: --language rust
          tools: python,rust,uv,sccache,aqua:nextest-rs/nextest/cargo-nextest,github:bnjbvr/cargo-machete,taplo,go,go:github.com/rhysd/actionlint/cmd/actionlint,aqua:koalaman/shellcheck,aqua:bufbuild/buf
          cache: disk
          mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE' ||
            'READ_ONLY' }}
  check_csharp:
    if: inputs.selection == 'check'
    name: Check / C# (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup
      with:
        platform: ${{ matrix.platform }}
        sdk-tools: csharp
    - name: Build the C# Solution
      run: mise run build -- --language csharp --profile ${{ env.PROFILE }}
    - name: Check the C# Solution
      run: mise run check -- --language csharp
    env:
      MISE_ENABLE_TOOLS: python,uv,dotnet
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-24.04
        - platform: windows
          runner: windows-2022
  test_csharp:
    if: inputs.selection == 'test'
    name: Test / C# (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup
      with:
        platform: ${{ matrix.platform }}
        sdk-tools: csharp
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-csharp-${{ env.PROFILE }}-${{ matrix.platform }}
        path: sdk/csharp/artifacts
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build_rust_tests-fixtures-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
    - name: Restore C# Executable Permissions
      if: runner.os == 'Linux'
      run: chmod +x "sdk/csharp/$(cat sdk/csharp/artifacts/paths/${{ env.PROFILE == 'release' && 'Release' || 'Debug' }}/Harmos.Conformance.txt)"
    - name: Test the C# Solution
      run: mise run test -- --language csharp --profile ${{ env.PROFILE }}
      env:
        CI_INPUT_ARCHIVES: '["target/ci/build_rust_tests-fixtures-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst"]'
        HARMOS_CONFORMANCE_HOST: ${{ github.workspace }}/target/build/${{ env.PROFILE }}/${{ matrix.target }}/fixtures/bin/harmos-conformance${{ runner.os == 'Windows' && '.exe' || '' }}
    env:
      MISE_ENABLE_TOOLS: python,uv,dotnet
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-24.04
          target: linux-x86_64
        - platform: windows
          runner: windows-2022
          target: windows-x86_64
  release_dry:
    if: inputs.selection == 'release_dry'
    name: Release / Dry
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: disk
        cache-mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
          || 'READ_ONLY' }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        github-token: ${{ github.token }}
    - name: Run Project Task
      run: mise run release:publish -- --dry --channel ${{ inputs.channel }}
      env:
        RELEASE_PROFILE: ${{ env.PROFILE }}
        CI_INPUT_ARCHIVES: '["target/ci/package-${{ env.PROFILE }}-rust-unix.tar.zst","target/ci/package-${{ env.PROFILE }}-rust-windows.tar.zst"]'
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: git-cliff,python,rust,sccache,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
        || 'READ_ONLY' }}
    permissions:
      actions: read
      contents: read
  release_rehearsal:
    if: inputs.selection == 'release_rehearsal'
    name: Release / Rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        github-token: ${{ github.token }}
    - name: Run Project Task
      run: mise run release:rehearse --
      env:
        CI_INPUT_ARCHIVES: '["target/ci/package-${{ env.PROFILE }}-rust-unix.tar.zst","target/ci/package-${{ env.PROFILE }}-rust-windows.tar.zst"]'
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: git-cliff,python,rust,uv
    permissions:
      contents: read
  build_product:
    if: inputs.selection == 'build_product'
    name: Build / Product (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: disk
        cache-mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
          || 'READ_ONLY' }}
    - name: Run Project Task
      run: mise run build -- --profile ${{ env.PROFILE }}
      env:
        CI_OUTPUT_ARCHIVES: '[{"archive":"target/ci/build-product-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst","paths":["target/build/{profile}/{target}/bin","target/build/{profile}/{target}/lib","target/build/{profile}/{target}/product","target/generated/python/pyproject.toml","target/generated/python/src"],"profile":"${{
          env.PROFILE }}"}]'
    - name: Build Python SDK
      if: runner.os == 'Linux'
      run: mise -C sdk/python run build -- --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: runner.os == 'Linux'
      with:
        name: build-python-${{ env.PROFILE }}
        path: target/build/${{ env.PROFILE }}/any/python/
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-product-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-product-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: python,rust,sccache,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
        || 'READ_ONLY' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
        - unix
        - windows
        include:
        - platform: unix
          runner: ubuntu-24.04
          minutes: 120
          container: ''
        - platform: windows
          runner: windows-2022
          minutes: 120
          container: ''
  build_tests:
    if: inputs.selection == 'build_tests'
    name: Build / Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        sdk-tools: cpp csharp python
        cache-backend: disk
        cache-mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
          || 'READ_ONLY' }}
    - name: Install Linux C++ Prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config
    - name: Run Project Task
      run: mise run build -- --artifact tests --profile ${{ env.PROFILE }}
      env:
        CI_OUTPUT_ARCHIVES: '[{"archive":"target/ci/build_rust_tests-fixtures-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst","paths":["target/build/{profile}/{target}/fixtures"],"profile":"${{
          env.PROFILE }}"},{"archive":"target/ci/build-tests-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst","paths":["target/build/{profile}/{target}/tests/archive.tar.zst","target/build/{profile}/{target}/tests/compiler.json"],"profile":"${{
          env.PROFILE }}"}]'
    - name: Test C++ SDK Units
      if: github.event_name != 'push'
      run: mise -C sdk/cpp run test -- --layer unit --profile ${{ env.PROFILE }}
    - name: Build Installed C++ SDK Consumer
      run: mise -C sdk/cpp run consumer -- --profile ${{ env.PROFILE }}
    - name: Test C++ SDK Integration Stories
      if: github.event_name != 'push'
      run: mise -C sdk/cpp run test -- --layer integration --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-csharp-${{ env.PROFILE }}-${{ matrix.platform }}
        path: |
          sdk/csharp/artifacts/bin/
          sdk/csharp/artifacts/paths/
        if-no-files-found: error
    - name: Test C# SDK Units
      if: github.event_name != 'push'
      run: mise -C sdk/csharp run test:unit -- --profile ${{ env.PROFILE }}
    - name: Test Python SDK Client Units
      if: github.event_name != 'push'
      run: mise -C sdk/python run test:unit
    - name: Test Typed Python SDK Examples
      if: github.event_name != 'push'
      run: mise -C sdk/python run test:examples -- --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build_rust_tests-fixtures-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build_rust_tests-fixtures-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-tests-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-tests-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      MISE_ENABLE_TOOLS: cmake,ninja,dotnet,python,rust,uv,sccache,aqua:nextest-rs/nextest/cargo-nextest
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
        || 'READ_ONLY' }}
      CI_CACHE_PROFILE: test
    strategy:
      fail-fast: false
      matrix:
        platform:
        - unix
        - windows
        include:
        - platform: unix
          runner: ubuntu-24.04
          minutes: 120
          container: ''
        - platform: windows
          runner: windows-2022
          minutes: 120
          container: ''
  package_rust:
    if: inputs.selection == 'package_rust'
    name: Package / Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-product-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
    - name: Run Project Task
      run: mise run package -- --language rust --profile ${{ env.PROFILE }}
      env:
        CI_INPUT_ARCHIVES: '["target/ci/build-product-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst"]'
