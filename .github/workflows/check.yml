name: Feature Checks

on:
  push:
    branches-ignore: [dev, main]

permissions:
  contents: read
  actions: read

env:
  MISE_YES: '1'
  MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
  MISE_CACHE_DIR: ${{ github.workspace }}/.cache/mise
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.mise-ci-global.toml
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.mise-data/rustup
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  MISE_LOCKED: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longPaths
  GIT_CONFIG_VALUE_0: 'true'

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_feature:
    name: CI Feature (Push, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          profile: source
          cache-write: 'true'
      - name: ci:feature
        run: mise run ci:feature
