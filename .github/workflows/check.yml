name: Feature Checks

on:
  push:
    branches-ignore: [dev, main]

permissions:
  contents: read
  actions: read

env:
  MISE_YES: '1'
  MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
  MISE_CACHE_DIR: ${{ github.workspace }}/.cache/mise
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.mise-ci-global.toml
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.mise-data/rustup
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  MISE_LOCKED: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longPaths
  GIT_CONFIG_VALUE_0: 'true'

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (push, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cargo-cache-role: check
      - run: mise run check
