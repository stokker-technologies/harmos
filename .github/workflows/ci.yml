name: CI
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && 'CI / Closed Review' || github.event_name == 'pull_request'
  && github.event.pull_request.draft && 'CI / Draft Review' || 'CI / Validation' }}
'on':
  push:
    branches:
    - dev
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - closed
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: check
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  release_dry:
    needs:
    - package_rust
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.head_ref,
      'release/v'))
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: release_dry
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  release_rehearsal:
    needs:
    - package_rust
    if: (github.event_name != 'pull_request' || github.event.action != 'closed') && (github.event_name == 'pull_request' && github.base_ref ==
      'dev' && startsWith(github.head_ref, 'release/v'))
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: release_rehearsal
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  build_product:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: build_product
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  build_tests:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: build_tests
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  package_rust:
    needs:
    - build_product
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: package_rust
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  prepare_test_fixtures:
    needs:
    - build_product
    - build_tests
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: prepare_test_fixtures
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  required:
    name: CI / Required
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - name: Run Project Task
      run: mise run ci:required --
      env:
        RESULTS: ${{ toJSON(needs) }}
        OPTIONAL_JOBS: ${{ github.event_name == 'push' && '["release_dry","release_rehearsal","package_rust","prepare_test_fixtures","test","test_unit"]' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')) && '[]' || '["release_dry"]' }}
        RELEASE_REVIEW: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && startsWith(github.head_ref, 'release/v') }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: python,uv
    needs:
    - check
    - release_dry
    - release_rehearsal
    - build_product
    - build_tests
    - package_rust
    - prepare_test_fixtures
    - check_product
    - test
    - test_unit
  check_product:
    needs:
    - build_product
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: check_product
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  test_unit:
    needs:
    - build_tests
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: test_unit
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  test:
    needs: [prepare_test_fixtures]
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: test
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')) }}
