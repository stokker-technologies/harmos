            values = []
            for page in range(1, 101):
                separator = "&" if "?" in endpoint else "?"
                response = request(f"{endpoint}{separator}per_page=100&page={page}")
                batch = response[key] if key else response
                if not isinstance(batch, list):
                    raise ValueError("invalid provider page")
                values.extend(batch)
                if len(batch) < 100:
                    return values
            raise ValueError("provider pagination limit")
        def same_tree(head, tree):
            if not isinstance(head, str) or OID.fullmatch(head) is None:
                return False
            command("git", "fetch", "--quiet", "--no-tags", "--no-write-fetch-head", "origin", head)
            return command("git", "rev-parse", "--verify", head + "^{tree}") == tree
        def github_review_run(run, review):
            if run.get("head_sha") != review["head"]["sha"]:
                return False
            associations = run.get("pull_requests")
            if associations:
                return any(pr.get("number") == review["number"] for pr in associations)
            # GitHub Can Drop The Association After The Merged Source Branch Is Deleted.
            repository = review["head"].get("repo", {}).get("id")
            return (
                associations == []
                and isinstance(repository, int)
                and repository > 0
                and run.get("event") == "pull_request"
                and run.get("head_branch") == review["head"]["ref"]
                and run.get("head_repository", {}).get("id") == repository
                and run.get("repository", {}).get("id") == review.get("base", {}).get("repo", {}).get("id")
                and isinstance(run.get("repository", {}).get("id"), int)
            )
        def lookup():
            sha = command("git", "rev-parse", "HEAD")
            tree = command("git", "rev-parse", "HEAD^{tree}")
            if OID.fullmatch(tree) is None:
                raise ValueError("invalid checkout tree")
            github = bool(os.environ.get("GITHUB_ACTIONS"))
            if github:
                reviews = [review for review in pages(f"commits/{sha}/pulls") if review.get("merged_at")
                           and review.get("merge_commit_sha") == sha and review.get("base", {}).get("ref") == "dev"]
            else:
                reviews = [review for review in pages(f"repository/commits/{sha}/merge_requests") if review.get("state") == "merged"
                           and sha in (review.get("merge_commit_sha"), review.get("squash_commit_sha")) and review.get("target_branch") == "dev"]
            if len(reviews) != 1:
                raise ValueError("no unambiguous merged review")
            review = reviews[0]
            head = review["head"]["sha"] if github else review["sha"]
            branch = review["head"]["ref"] if github else review["source_branch"]
            if not same_tree(head, tree):
                raise ValueError("review tree differs")
            profile = "release" if branch.startswith("release/v") and os.environ.get("REVIEW_RELEASE") == "true" else "dev"
            tag = os.environ.get("GITHUB_REF", "").startswith("refs/tags/") or bool(os.environ.get("CI_COMMIT_TAG"))
            if tag and profile != "release":
                raise ValueError("tag requires release-profile evidence")
            required = json.loads(os.environ.get("REVIEW_PACKAGES", "[]"))
            preparation = (
                os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
                if github
                else os.environ.get("CI_PIPELINE_SOURCE") in ("web", "api", "trigger")
            )
            if tag or preparation:
                required += json.loads(os.environ.get("REVIEW_BUILDS", "[]"))
            if github:
                runs = pages(f"actions/workflows/ci.yml/runs?event=pull_request&head_sha={head}", "workflow_runs")
                runs = [run for run in runs if github_review_run(run, review)]
                run = max(runs, key=lambda item: item["id"])
                if run.get("status") != "completed" or run.get("conclusion") != "success":
                    raise ValueError("review run is not green")
                jobs = pages(f"actions/runs/{run['id']}/jobs?filter=latest", "jobs")
                if not jobs or any(job.get("conclusion") not in ("success", "skipped") for job in jobs):
                    raise ValueError("review jobs are not green")
                artifacts = pages(f"actions/runs/{run['id']}/artifacts", "artifacts")
                for name in required:
                    matches = [artifact for artifact in artifacts if artifact.get("name") == name.replace("PROFILE", profile)]
                    if len(matches) != 1 or matches[0].get("expired") is not False:
                        raise ValueError("review package unavailable")
            else:
                review = request(f"merge_requests/{review['iid']}")
                run = review["head_pipeline"]
                if run.get("sha") != head or run.get("status") != "success" or run.get("source") != "merge_request_event":
                    raise ValueError("review pipeline is not green")
                jobs = pages(f"pipelines/{run['id']}/jobs?include_retried=false")
                if any(job.get("name") == "Plan / Impact" for job in jobs):
                    bridges = [bridge for bridge in pages(f"pipelines/{run['id']}/bridges") if bridge.get("name") == "CI / Required"]
                    if len(bridges) != 1 or bridges[0].get("status") != "success":
                        raise ValueError("review child gate is not green")
                    child = bridges[0].get("downstream_pipeline")
                    if not isinstance(child, dict) or child.get("sha") != head or child.get("status") != "success" or not isinstance(child.get("id"), int):
                        raise ValueError("review child pipeline is not green for this exact revision")
                    run = child
                    jobs = pages(f"pipelines/{run['id']}/jobs?include_retried=false")
                if not jobs or any(job.get("status") not in ("success", "skipped", "manual") for job in jobs):
                    raise ValueError("review jobs are not green")
                for name in required:
                    matches = [job for job in jobs if job.get("name") == name]
                    if len(matches) != 1 or matches[0].get("status") != "success" or not matches[0].get("artifacts_file", {}).get("filename"):
                        raise ValueError("review package unavailable")
                    expiry = matches[0].get("artifacts_expire_at")
                    if expiry and datetime.fromisoformat(expiry.replace("Z", "+00:00")) <= datetime.now(timezone.utc):
                        raise ValueError("review package expired")
            if not isinstance(run["id"], int) or run["id"] <= 0:
                raise ValueError("invalid review run ID")
            if tag and not any(job.get("name", "").endswith("Release / Rehearsal")
                               and job.get("conclusion" if github else "status") == "success" for job in jobs):
                raise ValueError("release review has no successful rehearsal")
            protected = os.environ.get("GITHUB_REF_PROTECTED") == "true" or os.environ.get("CI_COMMIT_REF_PROTECTED") == "true"
            version = branch.removeprefix("release/") if profile == "release" else f"dev.{run['id']}+{head[:8]}"
            if re.fullmatch(r"(?:v\d+\.\d+\.\d+|dev\.\d+\+[0-9a-f]{8})", version) is None:
                raise ValueError("invalid review version")
            return {"validated": "true", "review_run": str(run["id"]), "review_profile": profile,
                    "review_sha": head, "review_version": version, "stable_release": str(bool(tag and protected)).lower()}
        def restore():
            if os.environ.get("validated") != "true":
                return
            run = os.environ["review_run"]
            if not run.isdecimal():
                raise ValueError("invalid review pipeline")
            jobs = pages(f"pipelines/{run}/jobs?include_retried=false")
            for name in json.loads(os.environ["REVIEW_PACKAGES"]) + json.loads(os.environ.get("REVIEW_BUILDS", "[]")):
                matches = [job for job in jobs if job.get("name") == name and job.get("status") == "success"]
                if len(matches) != 1:
                    raise ValueError("review package producer unavailable")
                data = request(f"jobs/{matches[0]['id']}/artifacts", binary=True)
                with zipfile.ZipFile(io.BytesIO(data)) as archive:
                    for member in archive.infolist():
                        path = Path(member.filename)
                        parent = member.is_dir() and member.filename in ("target/", "target/package/")
                        if path.is_absolute() or ".." in path.parts or "\\" in member.orig_filename or (member.external_attr >> 16) & 0o170000 == 0o120000:
                            raise ValueError("unsafe package archive path")
                        if not parent and not member.filename.startswith(("target/package/", "target/ci/")):
                            raise ValueError("unexpected package archive path")
                    archive.extractall()
            print(f"Reusing packages from review pipeline {run}")
        # === Private Functions === #
        # === Entry Point === #
        if __name__ == "__main__":
            if os.environ.get("REVIEW_RESTORE") == "true":
                restore()
            else:
                result = {"validated": "false", "review_run": "", "review_profile": "", "review_sha": "", "review_version": "", "stable_release": "false"}
                try:
                    result = lookup()
                except Exception as error:
                    # Never print provider responses, commands or credentials on lookup failure.
                    print(f"Review evidence unavailable ({type(error).__name__}); running the full pipeline")
                if not os.environ.get("GITHUB_ACTIONS"):
                    version = os.environ.get("CI_COMMIT_TAG") or f"dev.{os.environ.get('CI_PIPELINE_ID', '')}+{os.environ.get('CI_COMMIT_SHORT_SHA', '')}"
                    result["DEPLOY_EXPECTED_VERSION"] = result.get("review_version") or version
                output = os.environ.get("GITHUB_OUTPUT", "target/ci/validated.env")
                Path(output).parent.mkdir(parents=True, exist_ok=True)
                with open(output, "a", encoding="utf-8", newline="\n") as stream:
                    stream.write("".join(f"{key}={value}\n" for key, value in result.items()))
                print(f"validated={result['validated']} review_run={result['review_run']}")
        STKR_REVIEW
    needs:
    - impact
    concurrency:
      group: "ci-${{ github.workflow }}-validated-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && !startsWith(github.event.head_commit.message, 'chore(release): prepare v'))) && github.ref || github.run_id }}"
      cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && !startsWith(github.event.head_commit.message, 'chore(release): prepare v')) }}"
  release:
    name: Release
    needs:
    - build_product_linux
    - build_tests_linux
    - build_product_windows
    - build_tests_windows
    - check
    - check_generated
    - check_linux
    - check_windows
    - package_linux
    - package_windows
    - prepare_linux
    - prepare_windows
    - test_linux
    - test_windows
    - validated
    - impact
    if: >-
      (always() && !cancelled()) && needs.impact.result == 'success' &&
      (contains(fromJSON(needs.impact.outputs.jobs), 'release:publish:dry') ||
      contains(fromJSON(needs.impact.outputs.jobs), 'release:publish') ||
      contains(fromJSON(needs.impact.outputs.jobs), 'release:prepare') || contains(fromJSON(needs.impact.outputs.jobs),
      'release:tag'))
    uses: ./.github/workflows/managed-release.yml
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      id-token: write
      attestations: write
      packages: write
    with:
      runners: "{\"linux\":{\"small\":\"ubuntu-24.04\",\"large\":\"ubuntu-24.04\"},\"windows\":{\"small\":\"windows-2022\",\"large\":\"windows-2022\"},\"nightly\":{\"small\":\"ubuntu-latest\",\"coverage\":\"ubuntu-latest\"}}"
      review_run: ${{ needs.validated.outputs.review_run }}
      review_profile: ${{ needs.validated.outputs.review_profile }}
      review_sha: ${{ needs.validated.outputs.review_sha }}
      review_version: ${{ needs.validated.outputs.review_version }}
      ready: >-
        ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result,
        'cancelled') }}
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
      mirror_deploy_key: ${{ secrets.MIRROR_DEPLOY_KEY }}
      mirror_ssh_url: ${{ secrets.MIRROR_SSH_URL }}
      runner_group_read_token: ${{ secrets.RUNNER_GROUP_READ_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  impact:
    name: Plan / Impact
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $count = if ($env:GIT_CONFIG_COUNT) { $env:GIT_CONFIG_COUNT } else { '0' }
        if ($count -notmatch '^\d+$' -or [int]$count -gt 1000) { throw 'Invalid inherited Git configuration count' }
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_KEY_$count", 'core.longpaths')
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_VALUE_$count", 'true')
        $env:GIT_CONFIG_COUNT = ([int]$count + 1).ToString()
        if ($env:GITHUB_ENV) {
          foreach ($name in @('GIT_CONFIG_COUNT', "GIT_CONFIG_KEY_$count", "GIT_CONFIG_VALUE_$count")) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Resolve Mise Directory
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $identity = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
        $bytes = [Text.Encoding]::UTF8.GetBytes($identity)
        $slot = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
        $directory = Join-Path ([IO.Path]::GetTempPath()) ('stkr-mise/' + $slot)
        "MISE_DATA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "STKR_RUNNER_IMAGE=$($env:ImageOS ?? 'windows')-$($env:ImageVersion ?? 'self')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Resolve Mise Directory
      if: runner.os != 'Windows'
      shell: bash
      run: |-
        printf 'MISE_DATA_DIR=%s/stkr-mise\n' "${RUNNER_TEMP}" >> "$GITHUB_ENV"
        printf 'STKR_RUNNER_IMAGE=%s-%s\n' "${ImageOS:-$(. /etc/os-release 2>/dev/null; echo "${ID:-unknown}${VERSION_ID:-}")}" "${ImageVersion:-self}" >> "$GITHUB_ENV"
    - name: Identify Installation Roots
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        foreach ($entry in @{ STKR_MISE_ROOT = $env:MISE_DATA_DIR; STKR_WORKSPACE_ROOT = $env:GITHUB_WORKSPACE }.GetEnumerator()) {
          $bytes = [System.Text.Encoding]::UTF8.GetBytes([System.IO.Path]::GetFullPath($entry.Value))
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "$($entry.Key)=$digest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
    - name: Identify Installation Roots
      if: runner.os != 'Windows'
      shell: bash
      run: |-
        for name in STKR_MISE_ROOT STKR_WORKSPACE_ROOT; do
          if [ "$name" = STKR_MISE_ROOT ]; then root="$MISE_DATA_DIR"; else root="$GITHUB_WORKSPACE"; fi
          if command -v sha256sum >/dev/null; then digest=$(printf '%s' "$root" | sha256sum); else digest=$(printf '%s' "$root" | shasum -a 256); fi
          printf '%s=%s\n' "$name" "${digest%% *}" >> "$GITHUB_ENV"
        done
    - name: Prepare Windows Tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        # === Setup === #
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'The standard Windows image requires installed Visual Studio Build Tools' }
        $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'The standard Windows image requires installed Visual Studio C++ tools' }
        Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
        Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
        $compiler = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object { Join-Path $_ 'cl.exe' } | Where-Object { (Test-Path -LiteralPath $_ -PathType Leaf) -and $_.StartsWith($installation, [StringComparison]::OrdinalIgnoreCase) }) | Select-Object -First 1
        if (!$compiler -or !(Test-Path -LiteralPath (Join-Path (Split-Path -Parent $compiler) 'link.exe') -PathType Leaf)) { throw 'MSVC compiler and linker are required from the selected installation' }
        $archiveRoot = Join-Path $PWD '.cache/bootstrap/zstd-1.5.7'
        $archive = Join-Path $archiveRoot 'zstd.zip'
        New-Item -ItemType Directory -Force $archiveRoot | Out-Null
        $checksum = 'acb4e8111511749dc7a3ebedca9b04190e37a17afeb73f55d4425dbf0b90fad9'
        if (!(Test-Path -LiteralPath $archive) -or (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $checksum) {
            Invoke-WebRequest 'https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip' -OutFile $archive
        }
        if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $checksum) { throw 'Pinned zstd archive checksum mismatch' }
        Expand-Archive -LiteralPath $archive -DestinationPath $archiveRoot -Force
        $compressor = Join-Path $archiveRoot 'zstd-v1.5.7-win64/zstd.exe'
        if (!(Test-Path -LiteralPath $compressor -PathType Leaf)) { throw 'Pinned zstd executable missing' }
        $compressorRoot = Split-Path -Parent $compressor
        $env:PATH = (Split-Path -Parent $compiler) + [IO.Path]::PathSeparator + $compressorRoot + [IO.Path]::PathSeparator + $env:PATH
        # === Verification === #
        & $compressor --version
        if ($LASTEXITCODE -ne 0) { throw 'Pinned zstd cannot execute' }
        $selectedLink = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object { Join-Path $_ 'link.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }) | Select-Object -First 1
        if ($selectedLink -ne (Join-Path (Split-Path -Parent $compiler) 'link.exe')) { throw 'MSVC linker precedence is required' }
        # === Entry Point === #
        $paths = @($env:PATH -split [IO.Path]::PathSeparator | ForEach-Object { $_.Trim('"') } | Where-Object { [IO.Path]::GetPathRoot($_).Length -ge 3 })
        $candidates = @($paths | ForEach-Object { Join-Path $_ 'tar.exe' })
        foreach ($git in @($paths | ForEach-Object { Join-Path $_ 'git.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
          $root = Split-Path -Parent (Split-Path -Parent $git)
          $candidates += Join-Path $root 'usr/bin/tar.exe'
        }
        $tar = $null
        foreach ($candidate in @($candidates | Select-Object -Unique)) {
          if ([IO.Path]::GetPathRoot($candidate).Length -lt 3 -or !(Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
          try {
            $version = & $candidate --version 2>$null
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^tar \(GNU tar\)') { continue }
            $capabilities = & $candidate --help 2>$null
            if ($LASTEXITCODE -ne 0 -or "$capabilities" -notmatch '--force-local' -or "$capabilities" -notmatch '--use-compress-program') { continue }
            $tar = $candidate
            break
          } catch { continue }
        }
        if (!$tar) { throw 'GNU tar with force-local and external-compressor support is required from the standard Git image baseline' }
        $env:PATH = (@((Split-Path -Parent $compiler), (Split-Path -Parent $tar), $compressorRoot) + @($env:PATH -split [IO.Path]::PathSeparator) | Select-Object -Unique) -join [IO.Path]::PathSeparator
        if ($env:GITHUB_ENV) {
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
        }
    - name: Prepare Linux Tools
      if: runner.os == 'Linux'
      shell: bash
      run: |-
        set -eu
        # === Setup === #
        native_tools='tar zstd unzip zip'
        case ",${MISE_ENABLE_TOOLS:-rust}," in
            *,rust,*|*,cargo:*)
                native_tools="$native_tools cc c++ make pkg-config"
                compiler=1
                ;;
            *) compiler=0 ;;
        esac
        missing=''
        for tool in $native_tools; do
            if ! command -v "$tool" >/dev/null 2>&1; then missing="$missing $tool"; fi
        done
        case "$(tar --version 2>/dev/null || true)" in
            'tar (GNU tar)'*) ;;
            *) missing="$missing GNU-tar" ;;
        esac
        if [ "$compiler" -eq 1 ] && ! pkg-config --exists openssl 2>/dev/null; then
            missing="$missing openssl-development"
        fi
        atomic=0
        case ",${MISE_ENABLE_TOOLS:-rust,node}," in
            *,node,*|*,npm:*)
                atomic=1
                if command -v ldconfig >/dev/null 2>&1; then
                    case "$(ldconfig -p 2>/dev/null || true)" in
                        *libatomic.so.1*) atomic=0 ;;
                    esac
                fi
                if [ "$atomic" -eq 1 ]; then
                    for library in \
                        /lib/libatomic.so.1 /lib64/libatomic.so.1 /usr/lib/libatomic.so.1 /usr/lib64/libatomic.so.1 \
                        /lib/*/libatomic.so.1 /usr/lib/*/libatomic.so.1; do
                        if test -r "$library"; then atomic=0; break; fi
                    done
                fi
                if [ "$atomic" -eq 1 ]; then missing="$missing libatomic.so.1"; fi
                ;;
        esac
        install_prerequisites() {
            set -- tar zstd unzip zip
            if command -v apt-get >/dev/null 2>&1; then
                if [ "$atomic" -eq 1 ]; then set -- "$@" libatomic1; fi
                if [ "$compiler" -eq 1 ]; then set -- "$@" build-essential pkg-config libssl-dev; fi
                if [ "$(id -u)" -eq 0 ]; then
                    apt-get update
                    apt-get install -y --no-install-recommends "$@"
                else
                    sudo -n apt-get update
                    sudo -n apt-get install -y --no-install-recommends "$@"
                fi
            elif command -v apk >/dev/null 2>&1; then
                if [ "$atomic" -eq 1 ]; then set -- "$@" libatomic; fi
                if [ "$compiler" -eq 1 ]; then set -- "$@" build-base pkgconf openssl-dev; fi
                if [ "$(id -u)" -eq 0 ]; then apk add --no-cache "$@"
                else sudo -n apk add --no-cache "$@"; fi
            else
                printf 'Missing shared CI prerequisites:%s; provide them through the declared job bootstrap or pinned image.\n' "$missing" >&2
                exit 1
            fi
        }
        if [ -n "$missing" ]; then install_prerequisites; fi
        # === Verification === #
        case "$(tar --version)" in
            'tar (GNU tar)'*) ;;
            *) printf 'GNU tar is required.\n' >&2; exit 1 ;;
        esac
        zstd --version
        # === Entry Point === #
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
        install_args: python
    - id: impact
      shell: bash
      run: |-
        mise exec -- python - <<'STKR_IMPACT'
        """Select Conservative Native CI Jobs And Emit A GitLab Child Pipeline."""

        # === Imports === #

        # Standard Library Imports
        import json
        import os
        import re
        import subprocess
        from pathlib import Path

        # Third Party Imports

        # Local Imports

        # Type Checking Imports


        # === Public Exports === #

        # === Constants === #

        # === Types === #

        # === Classes === #

        # === Public Functions === #


        def changed_paths(target: str, root: Path | None = None) -> set[str] | None:
            """Include Deleted, Added, Dirty And Untracked Paths Against One Merge Base."""

            def git(*arguments: str) -> str:
                return subprocess.check_output(
                    ["git", *arguments],
                    cwd=root,
                    creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),
                    stderr=subprocess.DEVNULL,
                    timeout=30,
                ).decode("utf-8")

            try:
                if os.environ.get("GITLAB_CI") == "true" and target.startswith("origin/"):
                    branch = target.removeprefix("origin/")
                    git("check-ref-format", "--branch", branch)
                    git(
                        "fetch",
                        "--no-tags",
                        "origin",
                        f"refs/heads/{branch}:refs/remotes/origin/{branch}",
                    )
                revision = git("rev-parse", "--verify", "--end-of-options", target + "^{commit}").strip()
                bases = git("merge-base", "--all", revision, "HEAD").splitlines()
                if len(bases) != 1:
                    return None
                diff = git("diff", "--name-only", "--no-renames", "-z", bases[0], "--")
                untracked = git("ls-files", "--others", "--exclude-standard", "-z")
                return set(filter(None, diff.split("\0") + untracked.split("\0")))
            except (OSError, UnicodeError, subprocess.SubprocessError):
                return None


        def select(plan: dict, paths: set[str] | None) -> set[str]:
            """Match Every Changed Path And Preserve The Complete Dependency Closure."""
            graph = plan["dependencies"]
            full = set(graph)
            if not paths:
                return full
            selected = set()
            for path in paths:
                matching = [rule for rule in plan["rules"] if _matches(rule["include"], path) and not _matches(rule["exclude"], path)]
                if not matching:
                    return full
                for rule in matching:
                    selected.update(rule["jobs"])
            pending = list(selected)
            while pending:
                job = pending.pop()
                if job not in graph:
                    return full
                for dependency in graph[job]:
                    if dependency not in selected:
                        selected.add(dependency)
                        pending.append(dependency)
            return selected


        def selection(root: Path, plan: dict, target: str = "origin/dev") -> set[str]:
            """Resolve Portable Local Impact Without A Hub Installation Or Registration."""
            return select(plan, changed_paths(target, root))


        def main(plan: dict) -> None:
            """Native Providers Supply The Target Context; Missing Context Selects Full Proof."""
            target = os.environ.get("STKR_IMPACT_TARGET")
            paths = changed_paths(target) if target else None
            selected = select(plan, paths)
            if "document" in plan:
                document = plan["document"]
                original = [job for job in document.values() if isinstance(job, dict) and "stage" in job]
                routing = next((job for job in original if job["stage"] == "Check"), original[0] if original else {})
                # Only Native Protected Non-MR Refs May Receive Shared Cache Configuration.
                protected = os.environ.get("CI_COMMIT_REF_PROTECTED") == "true"
                source = os.environ.get("CI_PIPELINE_SOURCE")
                branch = os.environ.get("CI_COMMIT_BRANCH")
                tag = os.environ.get("CI_COMMIT_TAG", "")
                stable = re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is not None
                if protected and source != "merge_request_event" and (branch in ("dev", "main") or stable):
                    for name, fields in plan.get("trusted_cache", {}).items():
                        document[name].update(fields)
                for name in list(document):
                    if isinstance(document[name], dict) and "stage" in document[name] and name not in selected:
                        del document[name]
                if not selected:
                    gate = {
                        "stage": "Check",
                        "before_script": [],
                        "after_script": [],
                        "cache": [],
                        "needs": [],
                        "script": ['echo "No CI Jobs Selected"'],
                    }
                    if tags := routing.get("tags"):
                        gate["tags"] = tags
                    if image := routing.get("image", document.get("default", {}).get("image")):
                        gate["image"] = image
                    document["CI / No Jobs"] = gate
                # Original Event Rules Remain Meaningful Inside The Native Child Pipeline.
                text = json.dumps(document).replace("CI_PIPELINE_SOURCE", "STKR_PIPELINE_SOURCE")
                destination = Path("target/ci/impact-child.yml")
                destination.parent.mkdir(parents=True, exist_ok=True)
                destination.write_text(text + "\n", encoding="utf-8")
            else:
                result = json.dumps(sorted(selected), separators=(",", ":"))
                if output := os.environ.get("GITHUB_OUTPUT"):
                    with Path(output).open("a", encoding="utf-8") as stream:
                        stream.write(f"jobs={result}\n")
                print(result)


        # === Private Functions === #


        def _matches(patterns: list[str], path: str) -> bool:
            # Hub Compiles The Glob Dialect Once For Both Local And Provider Resolution.
            return any(re.fullmatch(pattern.encode("utf-8"), path.encode("utf-8")) is not None for pattern in patterns)


        # === Entry Point === #
        main(json.loads("{\"rules\":[{\"include\":[\"^(?:/?|.*/)skills/.*$\",\"^(?:/?|.*/)\\\\.agents/.*$\",\"^(?:/?|.*/)\\\\.codex/.*$\",\"^(?:/?|.*/)\\\\.claude/.*$\",\"^(?:/?|.*/)AGENTS\\\\.md$\",\"^(?:/?|.*/)CLAUDE\\\\.md$\",\"^(?:/?|.*/)\\\\.github/copilot\\\\-instructions\\\\.md$\",\"^(?:/?|.*/)README\\\\.md$\",\"^(?:/?|.*/)readme\\\\.md$\",\"^(?:/?|.*/)CONTRIBUTING\\\\.md$\",\"^(?:/?|.*/)contributing\\\\.md$\"],\"exclude\":[],\"jobs\":[]},{\"include\":[\"^LICENSE$\",\"^LICENSE\\\\..*$\",\"^docs(?:/|/.*/).*\\\\.md$\"],\"exclude\":[\"^docs/examples/.*$\",\"^docs/tutorials/.*$\",\"^docs/src/.*$\",\"^(?:/?|.*/)skills/.*$\",\"^(?:/?|.*/)\\\\.agents/.*$\",\"^(?:/?|.*/)\\\\.codex/.*$\",\"^(?:/?|.*/)\\\\.claude/.*$\",\"^(?:/?|.*/)AGENTS\\\\.md$\",\"^(?:/?|.*/)CLAUDE\\\\.md$\",\"^(?:/?|.*/)\\\\.github/copilot\\\\-instructions\\\\.md$\",\"^(?:/?|.*/)README\\\\.md$\",\"^(?:/?|.*/)readme\\\\.md$\",\"^(?:/?|.*/)CONTRIBUTING\\\\.md$\",\"^(?:/?|.*/)contributing\\\\.md$\"],\"jobs\":[\"check:repository\"]}],\"dependencies\":{\"bench:rust:integration\":[\"build:rust:bench\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"bench:rust:system\":[\"build:rust:bench\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"bench:rust:unit\":[\"build:rust:bench\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"build\":[],\"build:rust:bench\":[],\"build:rust:tests\":[],\"check:python\":[],\"check:python:generated\":[\"build\"],\"check:repository\":[],\"check:rust\":[],\"package:rust\":[\"build\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\"],\"prepare:tests:fixtures\":[\"build\",\"build:rust:tests\"],\"release:prepare\":[\"bench:rust:integration\",\"bench:rust:system\",\"bench:rust:unit\",\"build\",\"build:rust:bench\",\"build:rust:tests\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"package:rust\",\"prepare:tests:fixtures\",\"release:publish:dry\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"release:publish\":[\"bench:rust:integration\",\"bench:rust:system\",\"bench:rust:unit\",\"build\",\"build:rust:bench\",\"build:rust:tests\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"package:rust\",\"prepare:tests:fixtures\",\"release:publish:dry\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"release:publish:dry\":[\"bench:rust:integration\",\"bench:rust:system\",\"bench:rust:unit\",\"build\",\"build:rust:bench\",\"build:rust:tests\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"package:rust\",\"prepare:tests:fixtures\",\"release:publish:dry\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"release:rehearse\":[\"bench:rust:integration\",\"bench:rust:system\",\"bench:rust:unit\",\"build\",\"build:rust:bench\",\"build:rust:tests\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"package:rust\",\"prepare:tests:fixtures\",\"release:publish:dry\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"release:tag\":[\"bench:rust:integration\",\"bench:rust:system\",\"bench:rust:unit\",\"build\",\"build:rust:bench\",\"build:rust:tests\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"package:rust\",\"prepare:tests:fixtures\",\"release:publish:dry\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"release:verify\":[\"bench:rust:integration\",\"bench:rust:system\",\"bench:rust:unit\",\"build\",\"build:rust:bench\",\"build:rust:tests\",\"check:python\",\"check:python:generated\",\"check:repository\",\"check:rust\",\"package:rust\",\"prepare:tests:fixtures\",\"release:publish:dry\",\"test:rust:acceptance\",\"test:rust:coverage\",\"test:rust:integration\",\"test:rust:starter\",\"test:rust:system\",\"test:rust:unit\"],\"test:rust:acceptance\":[\"build\",\"build:rust:tests\",\"prepare:tests:fixtures\"],\"test:rust:coverage\":[\"build\",\"build:rust:tests\",\"prepare:tests:fixtures\"],\"test:rust:integration\":[\"build:rust:tests\",\"prepare:tests:fixtures\"],\"test:rust:starter\":[\"build\",\"build:rust:tests\",\"prepare:tests:fixtures\"],\"test:rust:system\":[\"build\",\"build:rust:tests\",\"prepare:tests:fixtures\"],\"test:rust:unit\":[\"build:rust:tests\"]}}"))
        STKR_IMPACT
      env:
        STKR_IMPACT_TARGET: >-
          ${{ github.event_name == 'pull_request' && github.head_ref != '' &&
          github.base_ref != '' && !startsWith(github.head_ref, 'release/') && format('origin/{0}',
          github.base_ref) || github.event_name == 'push' && github.ref == 'refs/heads/dev'
          && github.event.before || '' }}
    env:
      MISE_ENABLE_TOOLS: python
    outputs:
      jobs: ${{ steps.impact.outputs.jobs }}
    concurrency:
      group: "ci-${{ github.workflow }}-impact-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && !startsWith(github.event.head_commit.message, 'chore(release): prepare v'))) && github.ref || github.run_id }}"
      cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && !startsWith(github.event.head_commit.message, 'chore(release): prepare v')) }}"
  required:
    name: CI / Required
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs:
    - build_product_linux
    - build_tests_linux
    - build_product_windows
    - build_tests_windows
    - check
    - check_generated
    - check_linux
    - check_windows
    - package_linux
    - package_windows
    - prepare_linux
    - prepare_windows
    - test_linux
    - test_windows
    - validated
    - release
    - impact
    steps:
    - name: Configure Checkout Git
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $count = if ($env:GIT_CONFIG_COUNT) { $env:GIT_CONFIG_COUNT } else { '0' }
        if ($count -notmatch '^\d+$' -or [int]$count -gt 1000) { throw 'Invalid inherited Git configuration count' }
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_KEY_$count", 'core.longpaths')
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_VALUE_$count", 'true')
        $env:GIT_CONFIG_COUNT = ([int]$count + 1).ToString()
        if ($env:GITHUB_ENV) {
          foreach ($name in @('GIT_CONFIG_COUNT', "GIT_CONFIG_KEY_$count", "GIT_CONFIG_VALUE_$count")) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Resolve Mise Directory
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $identity = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
        $bytes = [Text.Encoding]::UTF8.GetBytes($identity)
        $slot = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
        $directory = Join-Path ([IO.Path]::GetTempPath()) ('stkr-mise/' + $slot)
        "MISE_DATA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "STKR_RUNNER_IMAGE=$($env:ImageOS ?? 'windows')-$($env:ImageVersion ?? 'self')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Resolve Mise Directory
      if: runner.os != 'Windows'
      shell: bash
      run: |-
        printf 'MISE_DATA_DIR=%s/stkr-mise\n' "${RUNNER_TEMP}" >> "$GITHUB_ENV"
        printf 'STKR_RUNNER_IMAGE=%s-%s\n' "${ImageOS:-$(. /etc/os-release 2>/dev/null; echo "${ID:-unknown}${VERSION_ID:-}")}" "${ImageVersion:-self}" >> "$GITHUB_ENV"
    - name: Identify Installation Roots
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        foreach ($entry in @{ STKR_MISE_ROOT = $env:MISE_DATA_DIR; STKR_WORKSPACE_ROOT = $env:GITHUB_WORKSPACE }.GetEnumerator()) {
          $bytes = [System.Text.Encoding]::UTF8.GetBytes([System.IO.Path]::GetFullPath($entry.Value))
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "$($entry.Key)=$digest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
    - name: Identify Installation Roots
      if: runner.os != 'Windows'
      shell: bash
      run: |-
        for name in STKR_MISE_ROOT STKR_WORKSPACE_ROOT; do
          if [ "$name" = STKR_MISE_ROOT ]; then root="$MISE_DATA_DIR"; else root="$GITHUB_WORKSPACE"; fi
          if command -v sha256sum >/dev/null; then digest=$(printf '%s' "$root" | sha256sum); else digest=$(printf '%s' "$root" | shasum -a 256); fi
          printf '%s=%s\n' "$name" "${digest%% *}" >> "$GITHUB_ENV"
        done
    - name: Prepare Windows Tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        # === Setup === #
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'The standard Windows image requires installed Visual Studio Build Tools' }
        $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'The standard Windows image requires installed Visual Studio C++ tools' }
        Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
        Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
        $compiler = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object { Join-Path $_ 'cl.exe' } | Where-Object { (Test-Path -LiteralPath $_ -PathType Leaf) -and $_.StartsWith($installation, [StringComparison]::OrdinalIgnoreCase) }) | Select-Object -First 1
        if (!$compiler -or !(Test-Path -LiteralPath (Join-Path (Split-Path -Parent $compiler) 'link.exe') -PathType Leaf)) { throw 'MSVC compiler and linker are required from the selected installation' }
        $archiveRoot = Join-Path $PWD '.cache/bootstrap/zstd-1.5.7'
        $archive = Join-Path $archiveRoot 'zstd.zip'
        New-Item -ItemType Directory -Force $archiveRoot | Out-Null
        $checksum = 'acb4e8111511749dc7a3ebedca9b04190e37a17afeb73f55d4425dbf0b90fad9'
        if (!(Test-Path -LiteralPath $archive) -or (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $checksum) {
            Invoke-WebRequest 'https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip' -OutFile $archive
        }
        if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $checksum) { throw 'Pinned zstd archive checksum mismatch' }
        Expand-Archive -LiteralPath $archive -DestinationPath $archiveRoot -Force
        $compressor = Join-Path $archiveRoot 'zstd-v1.5.7-win64/zstd.exe'
        if (!(Test-Path -LiteralPath $compressor -PathType Leaf)) { throw 'Pinned zstd executable missing' }
        $compressorRoot = Split-Path -Parent $compressor
        $env:PATH = (Split-Path -Parent $compiler) + [IO.Path]::PathSeparator + $compressorRoot + [IO.Path]::PathSeparator + $env:PATH
        # === Verification === #
        & $compressor --version
        if ($LASTEXITCODE -ne 0) { throw 'Pinned zstd cannot execute' }
        $selectedLink = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object { Join-Path $_ 'link.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }) | Select-Object -First 1
        if ($selectedLink -ne (Join-Path (Split-Path -Parent $compiler) 'link.exe')) { throw 'MSVC linker precedence is required' }
        # === Entry Point === #
        $paths = @($env:PATH -split [IO.Path]::PathSeparator | ForEach-Object { $_.Trim('"') } | Where-Object { [IO.Path]::GetPathRoot($_).Length -ge 3 })
        $candidates = @($paths | ForEach-Object { Join-Path $_ 'tar.exe' })
        foreach ($git in @($paths | ForEach-Object { Join-Path $_ 'git.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
          $root = Split-Path -Parent (Split-Path -Parent $git)
          $candidates += Join-Path $root 'usr/bin/tar.exe'
        }
        $tar = $null
        foreach ($candidate in @($candidates | Select-Object -Unique)) {
          if ([IO.Path]::GetPathRoot($candidate).Length -lt 3 -or !(Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
          try {
            $version = & $candidate --version 2>$null
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^tar \(GNU tar\)') { continue }
            $capabilities = & $candidate --help 2>$null
            if ($LASTEXITCODE -ne 0 -or "$capabilities" -notmatch '--force-local' -or "$capabilities" -notmatch '--use-compress-program') { continue }
            $tar = $candidate
            break
          } catch { continue }
        }
        if (!$tar) { throw 'GNU tar with force-local and external-compressor support is required from the standard Git image baseline' }
        $env:PATH = (@((Split-Path -Parent $compiler), (Split-Path -Parent $tar), $compressorRoot) + @($env:PATH -split [IO.Path]::PathSeparator) | Select-Object -Unique) -join [IO.Path]::PathSeparator
        if ($env:GITHUB_ENV) {
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
        }
    - name: Prepare Linux Tools
      if: runner.os == 'Linux'
      shell: bash
      run: |-
        set -eu
        # === Setup === #
        native_tools='tar zstd unzip zip'
        case ",${MISE_ENABLE_TOOLS:-rust}," in
            *,rust,*|*,cargo:*)
                native_tools="$native_tools cc c++ make pkg-config"
                compiler=1
                ;;
            *) compiler=0 ;;
        esac
        missing=''
        for tool in $native_tools; do
            if ! command -v "$tool" >/dev/null 2>&1; then missing="$missing $tool"; fi
        done
        case "$(tar --version 2>/dev/null || true)" in
            'tar (GNU tar)'*) ;;
            *) missing="$missing GNU-tar" ;;
        esac
        if [ "$compiler" -eq 1 ] && ! pkg-config --exists openssl 2>/dev/null; then
            missing="$missing openssl-development"
        fi
        atomic=0
        case ",${MISE_ENABLE_TOOLS:-rust,node}," in
            *,node,*|*,npm:*)
                atomic=1
                if command -v ldconfig >/dev/null 2>&1; then
                    case "$(ldconfig -p 2>/dev/null || true)" in
                        *libatomic.so.1*) atomic=0 ;;
                    esac
                fi
                if [ "$atomic" -eq 1 ]; then
                    for library in \
                        /lib/libatomic.so.1 /lib64/libatomic.so.1 /usr/lib/libatomic.so.1 /usr/lib64/libatomic.so.1 \
                        /lib/*/libatomic.so.1 /usr/lib/*/libatomic.so.1; do
                        if test -r "$library"; then atomic=0; break; fi
                    done
                fi
                if [ "$atomic" -eq 1 ]; then missing="$missing libatomic.so.1"; fi
                ;;
        esac
        install_prerequisites() {
            set -- tar zstd unzip zip
            if command -v apt-get >/dev/null 2>&1; then
                if [ "$atomic" -eq 1 ]; then set -- "$@" libatomic1; fi
                if [ "$compiler" -eq 1 ]; then set -- "$@" build-essential pkg-config libssl-dev; fi
                if [ "$(id -u)" -eq 0 ]; then
                    apt-get update
                    apt-get install -y --no-install-recommends "$@"
                else
                    sudo -n apt-get update
                    sudo -n apt-get install -y --no-install-recommends "$@"
                fi
            elif command -v apk >/dev/null 2>&1; then
                if [ "$atomic" -eq 1 ]; then set -- "$@" libatomic; fi
                if [ "$compiler" -eq 1 ]; then set -- "$@" build-base pkgconf openssl-dev; fi
                if [ "$(id -u)" -eq 0 ]; then apk add --no-cache "$@"
                else sudo -n apk add --no-cache "$@"; fi
            else
                printf 'Missing shared CI prerequisites:%s; provide them through the declared job bootstrap or pinned image.\n' "$missing" >&2
                exit 1
            fi
        }
        if [ -n "$missing" ]; then install_prerequisites; fi
        # === Verification === #
        case "$(tar --version)" in
            'tar (GNU tar)'*) ;;
            *) printf 'GNU tar is required.\n' >&2; exit 1 ;;
        esac
        zstd --version
        # === Entry Point === #
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
        install_args: python
    - shell: bash
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |-
        mise exec -- python - <<'STKR_GATE'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        assert results['impact']['result'] == 'success', 'impact planning failed'
        assert all(job['result'] in ('success', 'skipped') for job in results.values()), 'selected CI jobs failed'
        STKR_GATE
    if: always()
    env:
      MISE_ENABLE_TOOLS: python
    concurrency:
      group: "ci-${{ github.workflow }}-required-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && !startsWith(github.event.head_commit.message, 'chore(release): prepare v'))) && github.ref || github.run_id }}"
      cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && !startsWith(github.event.head_commit.message, 'chore(release): prepare v')) }}"
