name: CI
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && 'CI / Closed Review' || github.event_name == 'pull_request'
  && github.event.pull_request.draft && 'CI / Draft Review' || 'CI / Validation' }}
'on':
  push:
    branches:
    - dev
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - closed
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
env:
  PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  impact:
    name: Plan / Impact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.impact.outputs.selected }}
      skipped: ${{ steps.impact.outputs.skipped }}
      check_matrix: ${{ steps.impact.outputs.check_matrix }}
      test_matrix: ${{ steps.impact.outputs.test_matrix }}
      docs: ${{ steps.impact.outputs.docs }}
      check: ${{ steps.impact.outputs.check }}
      build_product: ${{ steps.impact.outputs.build_product }}
      build_tests: ${{ steps.impact.outputs.build_tests }}
      check_product: ${{ steps.impact.outputs.check_product }}
      package_rust: ${{ steps.impact.outputs.package_rust }}
      prepare_test_fixtures: ${{ steps.impact.outputs.prepare_test_fixtures }}
      test_unit: ${{ steps.impact.outputs.test_unit }}
      test: ${{ steps.impact.outputs.test }}
      release_dry: ${{ steps.impact.outputs.release_dry }}
      release_rehearsal: ${{ steps.impact.outputs.release_rehearsal }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: ./.github/actions/setup
      with:
        platform: unix
    - name: Plan Changed Jobs
      id: impact
      run: mise run ci:impact --
    env:
      MISE_ENABLE_TOOLS: python,uv
  docs:
    needs: [impact]
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.docs == 'true'
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: docs
  check:
    needs: [impact]
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.check == 'true'
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: ${{ github.event_name == 'push' && 'check_quick' || 'check' }}
      check-matrix: ${{ needs.impact.outputs.check_matrix }}
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  release_dry:
    needs:
    - impact
    - package_rust
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.release_dry == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: release_dry
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  release_rehearsal:
    needs:
    - impact
    - package_rust
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.release_rehearsal == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: release_rehearsal
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  build_product:
    needs: [impact]
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.build_product == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: build_product
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  build_tests:
    needs: [impact]
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.build_tests == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: build_tests
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  package_rust:
    needs:
    - impact
    - build_product
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.package_rust == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: package_rust
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  prepare_test_fixtures:
    needs:
    - impact
    - build_product
    - build_tests
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.prepare_test_fixtures == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: prepare_test_fixtures
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  required:
    name: CI / Required
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: always()
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - name: Run Project Task
      run: mise run ci:required --
      env:
        RESULTS: ${{ toJSON(needs) }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: python,uv
    needs:
    - impact
    - docs
    - check
    - release_dry
    - release_rehearsal
    - build_product
    - build_tests
    - package_rust
    - prepare_test_fixtures
    - check_product
    - test
    - test_unit
  check_product:
    needs:
    - impact
    - build_product
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.check_product == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: check_product
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  test_unit:
    needs:
    - impact
    - build_tests
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.test_unit == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: test_unit
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
  test:
    needs: [impact, prepare_test_fixtures]
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.test == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/validation.yml
    with:
      channel: stable
      selection: test
      test-matrix: ${{ needs.impact.outputs.test_matrix }}
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')) }}
