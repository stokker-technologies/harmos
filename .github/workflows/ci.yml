        key: ${{ steps.setup_windows.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup_windows.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        matrix.platform == 'windows' && ((true) && needs.impact.result == 'success' &&
        contains(fromJSON(needs.impact.outputs.jobs), 'test:rust:unit')) && (success() &&
        ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref
        == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
        (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') &&
        endsWith(github.ref, '/merge'))) && steps.setup_windows.outputs.mise-cache-hit != 'true')
      with:
        key: ${{ steps.setup_windows.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup_windows.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        matrix.platform == 'windows' && ((true) && needs.impact.result == 'success' &&
        contains(fromJSON(needs.impact.outputs.jobs), 'test:rust:unit')) && (success() &&
        ((github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref
        == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
        (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') &&
        endsWith(github.ref, '/merge'))) && steps.setup_windows.outputs.uv-cache-hit != 'true')
      with:
        key: ${{ steps.setup_windows.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup_windows.outputs.uv-path }}
    - name: Cache Summary
      if: >-
        matrix.platform == 'windows' && ((true) && needs.impact.result == 'success' &&
        contains(fromJSON(needs.impact.outputs.jobs), 'test:rust:unit')) && (always())
      env:
        CACHE_RESTORES: "{\"Mise\":\"${{ steps.setup_windows.outputs.mise-cache-hit == 'true' && 'Exact Hit' || steps.setup_windows.outputs.mise-cache-hit == 'false' && 'Partial Hit' || steps.setup_windows.outputs.mise-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Cargo\":\"${{ steps.setup_windows.outputs.cargo_downloads-cache-hit == 'true' && 'Exact Hit' || steps.setup_windows.outputs.cargo_downloads-cache-hit == 'false' && 'Partial Hit' || steps.setup_windows.outputs.cargo_downloads-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"UV\":\"${{ steps.setup_windows.outputs.uv-cache-hit == 'true' && 'Exact Hit' || steps.setup_windows.outputs.uv-cache-hit == 'false' && 'Partial Hit' || steps.setup_windows.outputs.uv-outcome == 'success' && 'Miss' || 'Unavailable' }}\"}"
      uses: ./.github/actions/save-caches
      with:
        summary-module: ""
    env:
      MISE_ENABLE_TOOLS: >-
        go,node,python,rust,uv,aqua:nextest-rs/nextest/cargo-nextest,aqua:koalaman/shellcheck,go:github.com/rhysd/actionlint/cmd/actionlint,git-cliff
      MISE_TASK_SKIP: build:rust:tests
    needs:
    - build_tests
    - impact
    if: >-
      ((true) && needs.impact.result == 'success' &&
      contains(fromJSON(needs.impact.outputs.jobs), 'test:rust:unit'))
    strategy:
      fail-fast: false
      matrix:
        platform:
        - unix
        - windows
        include:
        - platform: unix
          runner: ubuntu-24.04
          minutes: 120
          container: ""
        - platform: windows
          runner: windows-2022
          minutes: 120
          container: ""
    concurrency:
      group: >-
        ci-${{ github.workflow }}-validate_test_rust_unit-${{ (github.event_name ==
        'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
      cancel-in-progress: true
  required:
    name: CI / Required
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs:
    - source
    - check_python
    - impact
    - release_dry
    - release_rehearsal
    - check_generated_python
    - build_product
    - build_tests
    - check_rust
    - package_rust
    - prepare_test_fixtures
    - validate_test_rust_acceptance
    - validate_test_rust_integration
    - validate_test_rust_system
    - validate_test_rust_unit
    if: always()
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - shell: python
      run: >-
        import runpy; runpy.run_path('.github/actions/plan-impact/gate.py',
        run_name='__main__')
      env:
        RESULTS: ${{ toJSON(needs) }}
    concurrency:
      group: >-
        ci-${{ github.workflow }}-required-${{ (github.event_name == 'pull_request' ||
        github.event_name == 'push') && github.ref || github.run_id }}
      cancel-in-progress: true
