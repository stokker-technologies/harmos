name: Full Validation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      windows-only:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  MISE_YES: '1'
  MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
  MISE_CACHE_DIR: ${{ github.workspace }}/.cache/mise
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.mise-ci-global.toml
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.mise-data/rustup
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  MISE_LOCKED: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longPaths
  GIT_CONFIG_VALUE_0: 'true'

concurrency:
  group: full-${{ inputs.windows-only && 'advisory-windows' || 'native' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: check:merge-route
    outputs:
      fast: ${{ steps.policy.outputs.fast }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Main Promotion Route
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.base_ref }}
          SOURCE: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$TARGET" = main ]; then
            test "$SOURCE_REPOSITORY" = stokker-technologies/harmos
            [[ "$SOURCE" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: policy
        env:
          PYTHONPATH: tools/python/src
        run: python -m harmos_tools.packages policy

  check_fast_linux:
    name: Check Fast (Linux)
    if: ${{ !inputs.windows-only }}
    needs: route
    runs-on: ${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' && fromJSON('["stokker-local-linux-x64"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 240
    environment: ${{ github.event_name == 'pull_request' && 'full-validation' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          profile: source
      - name: check:fast
        run: mise run check:fast

  build_ci_linux:
    name: Build CI (Linux)
    runs-on: ${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' && fromJSON('["stokker-local-linux-x64"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 240
    needs: [route, check_fast_linux]
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          cargo-cache-role: release
          cache-write: 'true'
      - name: build:ci
        run: mise run build:ci
      - name: Save Cargo Compilation
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.compiler-cache-paths }}
          key: ${{ steps.setup.outputs.compiler-cache-key }}
      - name: Save Dependency Downloads
        if: success() && steps.setup.outputs.downloads-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/cargo/registry/index
            .cache/cargo/registry/cache
            .cache/cargo/git/db
            .cache/uv
          key: ${{ steps.setup.outputs.downloads-cache-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: success()
        with:
          name: harmos-build-linux-${{ github.run_attempt }}
          path: dist/harmos-ci-linux.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test_linux:
    name: test (linux)
    if: always() && !inputs.windows-only
    runs-on: ${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' && fromJSON('["stokker-local-linux-x64"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 240
    needs: build_ci_linux
    steps:
      - name: Require Matching Release Build
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build_ci_linux.result }}
          BUILD_ARTIFACT: ${{ needs.build_ci_linux.outputs.artifact }}
        run: test "$BUILD_RESULT" = success && test -n "$BUILD_ARTIFACT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          cargo-cache-role: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build_ci_linux.outputs.artifact }}
          path: dist
          merge-multiple: true
      - name: test
        id: test
        run: |
          mise run packages:restore
          mise run test
          mise run packages:validate
      - name: packages:export
        id: export
        if: always() && steps.test.outcome != 'skipped'
        run: mise run packages:export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: always() && steps.export.outcome == 'success'
        with:
          name: harmos-test-linux-${{ github.run_attempt }}
          path: dist/harmos-tests-linux.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  check_fast_windows:
    name: Check Fast (Windows)
    if: ${{ inputs.windows-only && needs.route.outputs.fast == 'true' || !inputs.windows-only && needs.route.outputs.fast != 'true' }}
    needs: route
    runs-on: windows-2022
    timeout-minutes: 240
    environment: ${{ github.event_name == 'pull_request' && 'full-validation' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          profile: source
      - name: check:fast
        run: mise run check:fast

  build_ci_windows:
    name: Build CI (Windows)
    runs-on: windows-2022
    timeout-minutes: 240
    needs: [route, check_fast_windows]
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          cargo-cache-role: release
          cache-write: 'true'
      - name: build:ci
        run: mise run build:ci
      - name: Save Cargo Compilation
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.compiler-cache-paths }}
          key: ${{ steps.setup.outputs.compiler-cache-key }}
      - name: Save Dependency Downloads
        if: success() && steps.setup.outputs.downloads-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/cargo/registry/index
            .cache/cargo/registry/cache
            .cache/cargo/git/db
            .cache/uv
          key: ${{ steps.setup.outputs.downloads-cache-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: success()
        with:
          name: harmos-build-windows-${{ github.run_attempt }}
          path: dist/harmos-ci-windows.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test_windows:
    name: test (windows)
    if: always() && (inputs.windows-only && needs.route.outputs.fast == 'true' || !inputs.windows-only && needs.route.outputs.fast != 'true')
    runs-on: windows-2022
    timeout-minutes: 240
    needs: [route, build_ci_windows]
    steps:
      - name: Require Matching Release Build
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build_ci_windows.result }}
          BUILD_ARTIFACT: ${{ needs.build_ci_windows.outputs.artifact }}
        run: test "$BUILD_RESULT" = success && test -n "$BUILD_ARTIFACT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          cargo-cache-role: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build_ci_windows.outputs.artifact }}
          path: dist
          merge-multiple: true
      - name: test
        id: test
        run: |
          mise run packages:restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run packages:validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: packages:export
        id: export
        if: always() && steps.test.outcome != 'skipped'
        run: mise run packages:export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: always() && steps.export.outcome == 'success'
        with:
          name: harmos-test-windows-${{ github.run_attempt }}
          path: dist/harmos-tests-windows.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  packages_development:
    name: Packages Development
    if: always() && !inputs.windows-only && (github.event_name == 'pull_request' && github.base_ref == 'dev' || github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: [route, test_linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require Fresh Linux Validation
        env:
          ROUTE: ${{ needs.route.result }}
          LINUX: ${{ needs.test_linux.result }}
        run: test "$ROUTE" = success && test "$LINUX" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          cargo-cache-role: none
      - name: packages:development
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARMOS_VALIDATION_RUN_ID: ${{ github.run_id }}
        run: mise run packages:development
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmos-development-${{ github.run_attempt }}
          path: dist/development.json
          if-no-files-found: error
          retention-days: 14

  promote:
    name: packages:promote
    if: always() && !inputs.windows-only && needs.route.outputs.fast != 'true'
    needs: [route, test_linux, test_windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require Fresh Native Validation
        env:
          ROUTE: ${{ needs.route.result }}
          LINUX: ${{ needs.test_linux.result }}
          WINDOWS: ${{ needs.test_windows.result }}
        run: test "$ROUTE" = success && test "$LINUX" = success && test "$WINDOWS" = success
