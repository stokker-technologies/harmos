name: Bench
"on":
  workflow_call:
    inputs:
      runners:
        type: string
        required: true
      budgets:
        type: string
        required: true
env:
  PROFILE: >-
    ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref,
    'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  npm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  bench_integration_rust:
    name: Integration / Rust
    runs-on: ${{ fromJSON(inputs.runners).nightly.small }}
    timeout-minutes: ${{ fromJSON(inputs.budgets).bench_integration_rust }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: linux
      MISE_ENABLE_TOOLS: >-
        node,python,rust,uv,aqua:nextest-rs/nextest/cargo-nextest,aqua:rhysd/actionlint,git-cliff,aqua:cargo-bins/cargo-binstall
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Cache / Cargo
      id: cargo
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |-
          .cache/cargo/registry/
          .cache/cargo/git/
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-
    - name: Cache / Uv
      id: uv
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/uv/
        key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('tools/python/uv.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-uv-
    - name: Resolve Mise Directory
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $directory = Join-Path ([System.IO.Path]::GetTempPath()) 'stkr-mise'
        "MISE_DATA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Resolve Mise Directory
      if: runner.os != 'Windows'
      shell: bash
      run: printf 'MISE_DATA_DIR=%s/stkr-mise\n' "${TMPDIR:-/tmp}" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: tools
      with:
        path: ${{ env.MISE_DATA_DIR }}
        key: ${{ runner.os }}-${{ runner.arch }}-mise-v2-${{ hashFiles('mise.lock') }}
    - run: command -v cc
    - run: command -v pkg-config
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.18.0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: build-bench
        merge-multiple: true
    - name: Extract Build
      shell: bash
      run: tar --zstd -xf "build-bench-linux.tar.zst"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .stkr/benchmarks/
        key: bench-bench_integration_rust-${{ runner.os }}-${{ github.run_id }}
        restore-keys: bench-bench_integration_rust-${{ runner.os }}-
    - run: mise run bench:integration:rust --refresh-baseline
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: bench-bench_integration_rust
        path: .stkr/benchmarks/
        if-no-files-found: ignore
        retention-days: 7
        include-hidden-files: true
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
        steps.uv.outputs.cache-hit != 'true'
      with:
        path: .cache/uv/
        key: ${{ steps.uv.outputs.cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
