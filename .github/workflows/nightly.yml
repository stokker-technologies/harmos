name: Nightly
run-name: Nightly / Validation
'on':
  schedule:
  - cron: 0 */4 * * *
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROFILE: release
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  freshness:
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      actions: read
    name: Plan / Freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.freshness.outputs.build }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - name: Run Project Task
      run: mise run ci:nightly-freshness --
      env:
        GH_TOKEN: ${{ github.token }}
      id: freshness
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: python,uv
  check:
    needs:
    - freshness
    if: needs.freshness.outputs.build == 'true'
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: check
      profile: release
  build_product:
    needs:
    - freshness
    if: needs.freshness.outputs.build == 'true'
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: build_product
      profile: release
  build_tests:
    needs:
    - freshness
    if: needs.freshness.outputs.build == 'true'
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: build_tests
      profile: release
  build_bench:
    needs:
    - freshness
    if: needs.freshness.outputs.build == 'true'
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: build_bench
      profile: release
  check_generated:
    needs:
    - build_product
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: check_product
      profile: release
  prepare_test_fixtures:
    needs:
    - build_product
    - build_tests
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: prepare_test_fixtures
      profile: release
  test_unit:
    needs:
    - build_tests
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: test_unit
      profile: release
  test:
    needs:
    - prepare_test_fixtures
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: test
      profile: release
  coverage:
    needs:
    - prepare_test_fixtures
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: coverage
      profile: release
  bench:
    needs:
    - build_bench
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: bench
      profile: release
  package:
    needs:
    - build_product
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: package_rust
      profile: release
  release_dry:
    needs:
    - package
    uses: ./.github/workflows/validation.yml
    with:
      channel: nightly
      selection: release_dry
      profile: release
  publish:
    needs: [package]
    if: always() && github.ref == 'refs/heads/dev' && needs.package.result == 'success'
    uses: ./.github/workflows/publication.yml
    with:
      channel: nightly
      profile: release
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
  report:
    name: Nightly / Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
    - check
    - release_dry
    - coverage
    - build_bench
    - build_product
    - build_tests
    - package
    - prepare_test_fixtures
    - publish
    - verify
    - check_generated
    - test
    - test_unit
    - bench
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: write
    concurrency:
      group: nightly-publication
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - name: Download Publication Inventory
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-manifest
        path: target/release-assets
    - name: Download Available Benchmarks
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: bench-*
        path: target/nightly-reports/benchmarks
    - name: Download Available Coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: junit-coverage-*
        path: target/nightly-reports/rust
    - name: Run Project Task
      run: mise run ci:nightly-report --
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS: ${{ toJSON(needs) }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: python,uv
  verify:
    needs: [publish]
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/verification.yml
    with:
      channel: nightly
      profile: release
    permissions:
      contents: read
      actions: read
