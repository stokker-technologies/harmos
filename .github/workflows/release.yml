name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release / Preparation' || startsWith(github.ref, 'refs/tags/v') && 'Release / Publication' ||
  'Release / Tagging' }}
'on':
  workflow_dispatch: {}
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags:
    - v*
permissions:
  contents: read
env:
  PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  mode:
    name: Release / Mode
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      sha: ${{ steps.mode.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        platform: unix
    - name: Run Project Task
      id: mode
      run: mise run ci:release-mode --
      env:
        GH_TOKEN: ${{ github.token }}
    env:
      MISE_ENABLE_TOOLS: python,uv
    permissions:
      contents: read
      pull-requests: read
  prepare:
    name: Release / Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - name: Run Project Task
      run: mise run release:prepare -- --review
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: git-cliff,go,node,python,rust,uv
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CRATES_BOOTSTRAP_AVAILABLE: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      GITHUB_RUNNER_WORKFLOWS: '{"ci.yml":{"unix":{"small":"ubuntu-24.04","large":"ubuntu-24.04"},"windows":{"small":"windows-2022","large":"windows-2022"},"nightly":{"small":"ubuntu-latest","coverage":"ubuntu-latest"}},"release.yml":{"unix":{"small":"ubuntu-24.04","large":"ubuntu-24.04"},"windows":{"small":"windows-2022","large":"windows-2022"},"nightly":{"small":"ubuntu-latest","coverage":"ubuntu-latest"}}}'
      RUNNER_GROUP_READ_TOKEN: ${{ secrets.RUNNER_GROUP_READ_TOKEN || github.token }}
    needs: [mode]
    if: needs.mode.outputs.mode == 'prepare'
    environment: release
    permissions:
      contents: read
  tag:
    name: Release / Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.mode.outputs.sha }}
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - id: crates
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      if: env.CARGO_REGISTRY_TOKEN == ''
    - name: Run Project Task
      run: mise run release:tag --
      env:
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
        CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN != '' && env.CARGO_REGISTRY_TOKEN || steps.crates.outputs.token }}
        RELEASE_TARGET_SHA: ${{ needs.mode.outputs.sha }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: git-cliff,go,node,python,rust,uv
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PROFILE: ${{ needs.validated.outputs.review_profile }}
      RELEASE_BUILD_RUN_ID: ${{ needs.validated.outputs.review_run }}
      RELEASE_BUILD_SHA: ${{ needs.validated.outputs.review_sha }}
      RELEASE_BUILD_VERSION: ${{ needs.validated.outputs.review_version }}
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.mode.outputs.mode == 'tag'
    environment: release
    permissions:
      checks: read
      contents: read
      actions: read
      id-token: write
    needs:
    - validated
    - mode
    concurrency:
      group: release-tag
      cancel-in-progress: false
  publish:
    needs: [validated]
    if: always() && needs.validated.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publication.yml
    with:
      channel: stable
      profile: release
      build_run: ${{ needs.validated.outputs.review_run }}
      build_sha: ${{ needs.validated.outputs.review_sha }}
      build_version: ${{ needs.validated.outputs.review_version }}
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
  validated:
    name: Review / Release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ needs.mode.outputs.sha || github.sha }}
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - name: Run Project Task
      run: mise run ci:review --
      id: review
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      MISE_ENABLE_TOOLS: python,uv
      REVIEW_RELEASE: 'true'
      REVIEW_PACKAGES: '["package-PROFILE-rust-unix","package-PROFILE-rust-windows"]'
      REVIEW_BUILDS: '[]'
      REVIEW_REQUIRED: 'true'
    outputs:
      validated: ${{ steps.review.outputs.validated }}
      review_run: ${{ steps.review.outputs.review_run }}
      review_profile: ${{ steps.review.outputs.review_profile }}
      review_sha: ${{ steps.review.outputs.review_sha }}
      review_version: ${{ steps.review.outputs.review_version }}
      stable_release: ${{ steps.review.outputs.stable_release }}
    if: always() && (needs.mode.outputs.mode == 'tag' || startsWith(github.ref, 'refs/tags/v'))
    needs: [mode]
  verify:
    needs: [publish, validated]
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/verification.yml
    with:
      channel: stable
      profile: release
      build_run: ${{ needs.validated.outputs.review_run }}
      build_sha: ${{ needs.validated.outputs.review_sha }}
      build_version: ${{ needs.validated.outputs.review_version }}
    permissions:
      contents: read
      actions: read
