name: Mirror
run-name: Mirror / Synchronization
permissions:
  contents: read
concurrency:
  group: gitlab-mirror
  cancel-in-progress: false
jobs:
  ci_mirror:
    name: Mirror / Push
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
    - run: mise run ci:mirror --
      env:
        GITLAB_MIRROR_SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
        GITLAB_MIRROR_KNOWN_HOSTS: ${{ vars.GITLAB_MIRROR_KNOWN_HOSTS }}
    env:
      MISE_ENABLE_TOOLS: python,uv
'on':
  push:
    branches:
    - dev
    - main
  workflow_dispatch: null
env:
  CARGO_INCREMENTAL: '0'
  MISE_LOCKED: '1'
