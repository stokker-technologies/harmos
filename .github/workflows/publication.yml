name: Publication
'on':
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      profile:
        type: string
        default: release
      build-run:
        type: string
        default: ''
      build-sha:
        type: string
        default: ''
      build-version:
        type: string
        default: ''
      report:
        type: boolean
        default: false
      results:
        type: string
        default: '{}'
permissions:
  contents: read
env:
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  publish:
    name: ${{ inputs.report && 'Nightly / Report' || 'Release / Publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: disk
        cache-mode: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') && 'READ_WRITE'
          || 'READ_ONLY' }}
    - if: '!inputs.report'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ inputs.profile }}-rust-unix
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
    - if: '!inputs.report'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ inputs.profile }}-rust-windows
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
    - name: Download Publication Inventory
      if: inputs.report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-manifest
        path: target/release-assets
    - name: Download Available Results
      if: inputs.report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: results-*
        path: target/nightly-reports
    - name: Complete Nightly Reports
      if: inputs.report
      id: report
      run: mise run ci:nightly-report --
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS: ${{ inputs.results }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    - name: Run Project Task
      if: '!inputs.report'
      run: mise run release:publish -- --channel ${{ inputs.channel }}
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TARGET_SHA: ${{ github.sha }}
        CI_INPUT_ARCHIVES: '["target/ci/package-${{ inputs.profile }}-rust-unix.tar.zst","target/ci/package-${{ inputs.profile }}-rust-windows.tar.zst"]'
    - name: Share Release Manifest
      if: '!inputs.report || steps.report.outputs.published == ''true'''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-manifest
        path: target/release-assets/upload.json
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - name: Attest Release Downloads
      if: inputs.channel == 'stable' && !inputs.report
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-checksums: target/release-assets/any/SHA256SUMS
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: git-cliff,go,node,python,rust,sccache,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') && 'READ_WRITE'
        || 'READ_ONLY' }}
      PROFILE: ${{ inputs.profile }}
      RELEASE_BUILD_RUN_ID: ${{ inputs.build-run }}
      RELEASE_BUILD_SHA: ${{ inputs.build-sha }}
      RELEASE_BUILD_VERSION: ${{ inputs.build-version }}
    environment: ${{ inputs.channel == 'stable' && 'release' || 'nightly' }}
    permissions:
      checks: read
      contents: write
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: ${{ inputs.channel == 'nightly' && 'nightly-publication' || 'release-publication' }}
      cancel-in-progress: false
