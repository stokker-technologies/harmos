name: Same SHA Artifacts

on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Successful Full Validation Run For This Exact SHA
        type: string
        required: false

permissions:
  contents: read
  actions: read

env:
  MISE_YES: '1'
  MISE_DATA_DIR: ${{ github.workspace }}/.mise-data
  MISE_CACHE_DIR: ${{ github.workspace }}/.cache/mise
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.mise-ci-global.toml
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.mise-data/rustup
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  MISE_LOCKED: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longPaths
  GIT_CONFIG_VALUE_0: 'true'

jobs:
  packages_reuse:
    name: Packages Reuse (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      - name: packages:reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARMOS_VALIDATION_RUN_ID: ${{ inputs.validation_run }}
        run: mise run packages:reuse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmos-reused-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            dist/harmos-ci-${{ matrix.platform }}.zip
            dist/harmos-tests-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14
