# === Changelog === #

[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking_description %}: {{ commit.breaking_description }}{% endif %}\
{% endfor %}
{% endfor %}\n{% endif %}\
"""
trim = true

# === Commit Parsing === #

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = '^chore\(release\): prepare v[0-9]+\.[0-9]+\.[0-9]+$', skip = true },
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^docs", group = "changed" },
  { message = "^refactor", group = "changed" },
  { message = "^perf", group = "changed" },
  { message = "^style", group = "changed" },
  { message = "^test", group = "changed" },
  { message = "^build", group = "changed" },
  { message = "^ci", group = "changed" },
  { message = "^chore", group = "changed" },
  { message = "^revert", group = "changed" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"

# === Version Bumping === #

[bump]
initial_tag = "v0.1.0"
breaking_always_bump_major = false
features_always_bump_minor = false
bump_type = "patch"
