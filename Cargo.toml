# === Workspace === #

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/harmos-guest/tests/fixtures/sandbox", "examples/schematic"]

# === Workspace Package === #

[workspace.package]
version = "0.1.13"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = true

# === Workspace Dependencies === #

[workspace.dependencies]
# Local
harmos-domain = { path = "crates/harmos-domain", version = "=0.1.13", default-features = false }
harmos-guest = { path = "crates/harmos-guest", version = "=0.1.13", default-features = false }
harmos-macros = { path = "crates/harmos-macros", version = "=0.1.13" }
harmos-operations = { path = "crates/harmos-operations", version = "=0.1.13", default-features = false }
harmos-packaging = { path = "crates/harmos-packaging", version = "=0.1.13", default-features = false }
harmos-runtime = { path = "crates/harmos-runtime", version = "=0.1.13", default-features = false }
harmos-sdk = { path = "crates/harmos-sdk", version = "=0.1.13", default-features = false }
harmos-sidecar = { path = "crates/harmos-sidecar", version = "=0.1.13", default-features = false }
harmos-storage = { path = "crates/harmos-storage", version = "=0.1.13", default-features = false }

# Git

# Error Handling
thiserror = { version = "2.0.21", default-features = false }

# Logging
tracing = { version = "0.1.44", default-features = false }
tracing-perfetto-file = { version = "0.1.1", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }

# Utilities
bytes = { version = "1.12.1", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
heck = { version = "0.5.0", default-features = false }
libc = { version = "0.2.191", default-features = false }
petgraph = { version = "0.8.3", default-features = false }
rustfft = { version = "6.4.1", default-features = false }
semver = { version = "1.0.28", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "serde"] }
wasmtime = { version = "=49.0.4", default-features = false, features = [
  "async",
  "component-model",
  "component-model-async",
  "cranelift",
  "parallel-compilation",
  "runtime",
  "std",
] }
windows-sys = { version = "0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
] }

# Serialization
arrow-array = { version = "=60.1.0", default-features = false }
arrow-buffer = { version = "=60.1.0", default-features = false }
arrow-data = { version = "=60.1.0", default-features = false }
arrow-ipc = { version = "=60.1.0", default-features = false }
arrow-schema = { version = "=60.1.0", default-features = false }
arrow-select = { version = "=60.1.0", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
flatbuffers = { version = "=25.12.19", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
prost = { version = "0.14.4", default-features = false }
prost-reflect = { version = "0.16.5", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false }
wasm-encoder = { version = "=0.258.3", default-features = false }
wasmparser = { version = "=0.258.3", default-features = false }
wit-bindgen = { version = "=0.61.1", default-features = false }
wit-component = { version = "=0.258.3", default-features = false }

# Configuration
clap = { version = "4.6.7", default-features = false }

# Filesystem
globset = { version = "0.4.20", default-features = false }
notify = { version = "8.2.1", default-features = false }
same-file = { version = "1.0.6", default-features = false }
tar = { version = "0.4.46", default-features = false }
tempfile = { version = "3.27.0", default-features = false }

# Parsing
memchr = { version = "2.8.3", default-features = false }
proc-macro-crate = { version = "3.5.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
syn = { version = "3.0.9", default-features = false, features = ["full"] }

# Concurrency
ctrlc = { version = "3.5.2", default-features = false }
process-wrap = { version = "10.0.1", default-features = false }

# Async
futures-core = { version = "0.3.34", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

# Networking
http-body = { version = "1.1.0", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
tonic = { version = "0.14.8", default-features = false }
tonic-reflection = { version = "0.14.8", default-features = false }
tonic-web = { version = "0.14.8", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["cors"] }

# Storage

# UI

# Testing
criterion = { version = "0.8.2", default-features = false, features = ["html_reports", "plotters"] }

# === Workspace Lints === #

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# === Lints === #

# === Profiles === #

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# === Patches === #

# === Other === #
