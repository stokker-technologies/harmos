syntax = "proto3";
package harmos.context.v1;
import "harmos/v1/types.proto";

service CatalogEntries {
  rpc List(CatalogEntriesListRequest) returns (CatalogEntriesListResponse);
}

message CatalogEntriesListRequest {
  harmos.v1.CatalogKind kind = 1;
  optional string schema = 2;
  harmos.v1.PageRequest page = 3;
}

message CatalogEntriesListResponse {
  bytes entries = 1;
  string next_page_token = 2;
  repeated harmos.v1.DiscoveredOperation operations = 3;
  harmos.v1.ReadCut resolved_at = 4;
}
