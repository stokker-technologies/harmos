// Context Host Values
//
// Resolution of declared product-owned values during a plugin invocation.

syntax = "proto3";

package harmos.context.v1;

// === Imports === //

// === Options === //

// === Services === //

// Exposes product-owned values declared in the calling plugin's catalog without assigning storage ownership to Harmos.
service HostValues {
  // Resolve a declared value through the product's registered resolver; missing declarations/resolvers and a mismatched returned type refuse.
  rpc Get(HostValuesGetRequest) returns (HostValuesGetResponse);
}

// === Requests and Responses === //

// Resolve a declared value through the product's registered resolver; missing declarations/resolvers and a mismatched returned type refuse.
message HostValuesGetRequest {
  // Must exactly match a value declaration in the calling plugin's frozen catalog.
  string name = 1;
}

// Returns a product-resolved encoded value only when its type matches the caller's declaration.
message HostValuesGetResponse {
  // Must equal the declared protobuf type; mismatch refuses resolution.
  string type = 1;
  // Encoded product-resolved value of type; Harmos does not choose its storage or contents.
  bytes payload = 2;
}

