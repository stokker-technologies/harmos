// Host Streams
//
// Operations executed by the host; each method declares its permitted callers.

syntax = "proto3";

package harmos.host.v1;

// === Imports === //

import "harmos/host/v1/schema.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";

// === Options === //

// === Services === //

// Lists stored stream identities under the caller's grants, independently of sample data.
service Streams {
  // Return all stream identities matching the optional schema identity; this bounded registry has no paging.
  rpc List(StreamsListRequest) returns (StreamsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === List === //

// Selects all stored stream identities or those using one exact schema identity.
message StreamsListRequest {
  // Unset leaves schema identity unfiltered; a present identity must be valid.
  optional string schema = 1;
}

// Returns the complete typed stored-stream registry selection.
message StreamsListResponse {
  repeated StreamIdentity streams = 1;
}

// === Resources === //

// Preserves the stream variant of the stored identity formerly serialized by the registry handler.
message StreamIdentity {
  harmos.host.v1.SchemaKey schema = 1;
  // Optional stored scope; absence remains distinct from an empty authored scope.
  optional string scope = 2;
  string item = 3;
  string stream = 4;
  // First storage position at which this stream identity was observed.
  harmos.model.v1.Position first = 5;
}

// === Enums === //
