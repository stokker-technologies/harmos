// Host Schemas
//
// Operations executed by the host; each method declares its permitted callers.

syntax = "proto3";

package harmos.host.v1;

// === Imports === //

import "harmos/host/v1/schema.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";

// === Options === //

// === Services === //

// Lists registered persisted schema descriptions under the caller's grants.
service Schemas {
  // Return all retained schema definitions matching the optional schema identity; this bounded registry has no paging.
  rpc List(SchemasListRequest) returns (SchemasListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === List === //

// Selects all registered schemas or one exact schema identity.
message SchemasListRequest {
  // Unset leaves schema identity unfiltered; a present identity must be valid.
  optional string schema = 1;
}

// Returns the complete typed persisted-schema registry selection.
message SchemasListResponse {
  repeated SchemaDescription schemas = 1;
}

// === Resources === //

// Preserves the position, schema identity and definition graph formerly serialized by the registry handler.
message SchemaDescription {
  harmos.model.v1.Position position = 1;
  harmos.host.v1.SchemaKey key = 2;
  harmos.host.v1.SchemaGraph schema = 3;
}

// === Enums === //
