// Client Logs
//
// Calls an application or tool makes on the host through the client boundary.

syntax = "proto3";

package harmos.client.v1.status;

// === Imports === //

import "google/protobuf/timestamp.proto";
import "harmos/v1/page.proto";
import "harmos/v1/position.proto";

// === Options === //

option csharp_namespace = "Harmos.Client.V1.StatusResources";

// === Services === //

// Exposes retained redacted log history and bounded live delivery.
service Logs {
  // Read bounded retained redacted log events at an issued boundary; expired tokens/positions and responses too small for one event refuse.
  rpc List(LogsListRequest) returns (LogsListResponse);
  // Emit an opening boundary then bounded log batches after it; positive bounds are required and a history gap refuses with resynchronization guidance.
  rpc Watch(LogsWatchRequest) returns (stream LogsWatchResponse);
}

// === Requests and Responses === //

// Carries the read boundary and page selection and bounds for Logs.List.
message LogsListRequest {
  // Unset selects the current history boundary; otherwise resend an issued position for this owner. Foreign, expired and unissued positions refuse.
  optional harmos.v1.Position at = 1;
  // Required positive item and encoded-byte bounds, plus an optional retained continuation.
  optional harmos.v1.PageRequest page = 2;
}

// Returns bounded retained log events at a fixed boundary and any continuation token.
message LogsListResponse {
  repeated Event events = 1;
  // Issued boundary actually selected for this response; retain and resend it unchanged to continue the same read.
  harmos.v1.Position resolved_at = 2;
  // Empty means no continuation remains; otherwise resend this opaque token with the unchanged selection and read boundary.
  string next_page_token = 3;
}

// Carries the read boundary, byte bound and event bound for Logs.Watch.
message LogsWatchRequest {
  // Unset selects the current history boundary; otherwise resend an issued position for this owner. Foreign, expired and unissued positions refuse.
  optional harmos.v1.Position at = 1;
  // Positive encoded response byte limit, including boundary metadata; a single event that cannot fit refuses.
  uint64 max_bytes = 2;
  // Positive maximum events in each live response; zero refuses.
  uint32 max_events = 3;
}

// Returns an opening boundary or bounded newly observed log events after the prior boundary.
message LogsWatchResponse {
  repeated Event events = 1;
  // Issued boundary actually selected for this response; retain and resend it unchanged to continue the same read.
  harmos.v1.Position resolved_at = 2;
}

// === Resources === //

// Carries a bounded, redacted log or trace observation assigned a history sequence by the status owner.
message Event {
  // Sequence assigned by the owning log/trace history, not a globally comparable event ID.
  uint64 sequence = 1;
  // Authoritative host timestamp assigned when the status owner records the event.
  google.protobuf.Timestamp observed_at = 2;
  string level = 3;
  string target = 4;
  string message = 5;
  map<string, string> fields = 6;
}

// === Enums === //
