// Client Trace Events
//
// Calls an application or tool makes on the host through the client boundary.

syntax = "proto3";

package harmos.client.v1.status;

// === Imports === //

import "harmos/client/v1/status/logs.proto";
import "harmos/v1/page.proto";
import "harmos/v1/position.proto";

// === Options === //

option csharp_namespace = "Harmos.Client.V1.StatusResources";

// === Services === //

// Exposes retained redacted trace history and bounded live delivery.
service TraceEvents {
  // Read bounded retained redacted trace events at an issued boundary; expired tokens/positions and responses too small for one event refuse.
  rpc List(TraceEventsListRequest) returns (TraceEventsListResponse);
  // Emit an opening boundary then bounded trace batches after it; positive bounds are required and a history gap refuses with resynchronization guidance.
  rpc Watch(TraceEventsWatchRequest) returns (stream TraceEventsWatchResponse);
}

// === Requests and Responses === //

// Carries the read boundary and page selection and bounds for TraceEvents.List.
message TraceEventsListRequest {
  // Unset selects the current history boundary; otherwise resend an issued position for this owner. Foreign, expired and unissued positions refuse.
  harmos.v1.Position at = 1;
  // Required positive item and encoded-byte bounds, plus an optional retained continuation.
  harmos.v1.PageRequest page = 2;
}

// Returns bounded retained trace events at a fixed boundary and any continuation token.
message TraceEventsListResponse {
  repeated Event events = 1;
  // Issued boundary actually selected for this response; retain and resend it unchanged to continue the same read.
  harmos.v1.Position resolved_at = 2;
  // Empty means no continuation remains; otherwise resend this opaque token with the unchanged selection and read boundary.
  string next_page_token = 3;
}

// Carries the read boundary, byte bound and event bound for TraceEvents.Watch.
message TraceEventsWatchRequest {
  // Unset selects the current history boundary; otherwise resend an issued position for this owner. Foreign, expired and unissued positions refuse.
  harmos.v1.Position at = 1;
  // Positive encoded response byte limit, including boundary metadata; a single event that cannot fit refuses.
  uint64 max_bytes = 2;
  // Positive maximum events in each live response; zero refuses.
  uint32 max_events = 3;
}

// Returns an opening boundary or bounded newly observed trace events after the prior boundary.
message TraceEventsWatchResponse {
  repeated Event events = 1;
  // Issued boundary actually selected for this response; retain and resend it unchanged to continue the same read.
  harmos.v1.Position resolved_at = 2;
}

// === Resources === //

// === Enums === //
