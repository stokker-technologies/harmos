// Client Operations
//
// Calls made on the host through the client boundary.

syntax = "proto3";

package harmos.client.v1;

// === Imports === //

import "harmos/v1/operation.proto";

// === Options === //

// === Services === //

// Discovers admitted operation contracts under the calling party's visibility and grants.
service Operations {
  // Return the complete admitted operation inventory; Private and unavailable operations are excluded.
  rpc List(OperationsListRequest) returns (OperationsListResponse);
  // Read one admitted operation contract; an unavailable or unauthorized identity refuses.
  rpc Get(OperationsGetRequest) returns (OperationsGetResponse);
}

// === Requests and Responses === //

// Requests the calling party's complete admitted operation inventory.
message OperationsListRequest {}

// Returns typed admitted operations and their owner, generation, projections and caller-specific grants.
message OperationsListResponse {
  repeated harmos.v1.DiscoveredOperation operations = 1;
}

// Selects one complete operation identity from the admitted registry.
message OperationsGetRequest {
  string id = 1;
}

// Returns the selected operation's contract and caller-specific discovery metadata.
message OperationsGetResponse {
  harmos.v1.DiscoveredOperation operation = 1;
}

