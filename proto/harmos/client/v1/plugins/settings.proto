// Client Plugin Settings
//
// Calls an application or tool makes on the host through the client boundary.

syntax = "proto3";

package harmos.client.v1.plugins;

// === Imports === //

import "harmos/v1/position.proto";
import "harmos/v1/receipt.proto";
import "harmos/v1/setting.proto";

// === Options === //

option csharp_namespace = "Harmos.Client.V1.PluginsResources";
// === Services === //

// Owns the library-stored settings for a plugin entry; product secrets remain product-owned.
service Settings {
  // Read declarations, complete current values, revision and issued read cut for one plugin entry.
  rpc List(SettingsListRequest) returns (SettingsListResponse);
  // Replace the complete setting values at the expected revision; identical request identity and input replay the original receipt, while changed input refuses.
  rpc Set(SettingsSetRequest) returns (SettingsSetResponse);
}

// === Requests and Responses === //

// Selects a plugin entry and optional issued settings boundary.
message SettingsListRequest {
  string name = 1;
  // Unset selects the latest durable settings; otherwise resend an issued cut unchanged.
  harmos.v1.ReadCut at = 2;
}

// Returns the plugin's declarations and complete current setting values at one revision.
message SettingsListResponse {
  repeated harmos.v1.SettingDeclaration declarations = 1;
  harmos.v1.SettingValues value = 2;
  // Opaque settings revision, separate from the plugin entry revision.
  bytes revision = 3;
  harmos.v1.ReadCut resolved_at = 4;
}

// Carries the whole replacement value, expected settings revision and replay identity.
message SettingsSetRequest {
  string name = 1;
  // Complete declared value set; missing, unknown or differently typed values refuse.
  harmos.v1.SettingValues value = 2;
  // Issued settings revision; conflicts require getting the values again before retrying.
  bytes expected_revision = 3;
  // Nonempty caller-chosen identity retained with the normalized request for replay.
  string request_id = 4;
}

// Returns the complete applied value, new settings revision and mutation receipt.
message SettingsSetResponse {
  harmos.v1.SettingValues value = 1;
  bytes revision = 2;
  harmos.v1.Receipt receipt = 3;
}

