syntax = "proto3";
package harmos.plugin.v1;

import "google/protobuf/timestamp.proto";
import "harmos/v1/types.proto";

// Serves one running plugin to its host over the plugin face; each connection receives its own host activation.
service Instance {
  // Identity, start time and catalog. Called once per connection, first.
  rpc Get(InstanceGetRequest) returns (InstanceGetResponse);

  // One invocation of one operation. The host opens the call with a harmos.v1.Request.
  // While it runs, the plugin may send harmos.v1.ChildRequest frames and the host
  // answers each with a harmos.v1.ChildResponse. The plugin ends the call with a
  // harmos.v1.Response. The host may send harmos.v1.Cancel at any time.
  rpc Invoke(stream InstanceInvokeRequest) returns (stream InstanceInvokeResponse);

  // One declared stream. The host opens the call with a harmos.v1.SamplesSelection;
  // opening it is the demand for the stream and closing it ends the demand.
  // For a stream with an interval the host then sends one harmos.v1.Tick per interval
  // and the plugin answers each with one sample.
  rpc Samples(stream InstanceSamplesRequest) returns (stream InstanceSamplesResponse);

  // Sent before the host shuts down or removes the plugin. The plugin runs
  // its stop and cleanup hooks and then replies. A managed plugin exits
  // afterwards; a remote plugin keeps running.
  rpc Stop(InstanceStopRequest) returns (InstanceStopResponse);
}

// Negotiate the minimum advertised revision and read process identity and the complete catalog; the host calls this first on every connection.
message InstanceGetRequest {
  // Highest revision of harmos.v1 the host implements. Starts at 1 and grows
  // with each additive release.
  uint32 revision = 1;
  // Name and version of the host application, for logs.
  string host = 2;
  string host_version = 3;
}

// Supplies process identity, startup time, complete catalog and carrier limits for connection admission.
message InstanceGetResponse {
  // Stable plugin identifier, lowercase with dots or underscores.
  string id = 1;
  // Semantic version of the plugin.
  string version = 2;
  // Captured once when the process started. A changed value on reconnect
  // means the process restarted.
  google.protobuf.Timestamp started_at = 3;
  harmos.v1.Catalog catalog = 4;
  // Highest revision of harmos.v1 the plugin implements.
  uint32 revision = 5;
  // Name and version of the SDK that built the plugin, for logs.
  string sdk = 6;
  string sdk_version = 7;
  // Plugin-advertised carrier message ceiling; the host checks compatibility with its configured chunk/framing requirements.
  uint64 message_bytes = 8;
}

// Run stop and cleanup hooks before acknowledging; a managed process exits afterwards while a remote process remains available.
message InstanceStopRequest {
  string reason = 1;
}

// Acknowledges that plugin stop and cleanup hooks have completed.
message InstanceStopResponse {
  // No payload fields.
}

// Run exactly one attempt on the bidirectional carrier. Request opens it; child traffic is correlated on this carrier and one terminal Response ends it.
message InstanceInvokeRequest {
  // Select exactly one variant; an unset discriminator carries no selected value.
  oneof frame {
    harmos.v1.Request request = 1;
    harmos.v1.ChildResponse child = 2;
    harmos.v1.Cancel cancel = 3;
  }
}

// Carries plugin-originated child traffic or the single terminal result for this attempt.
message InstanceInvokeResponse {
  // Select exactly one variant; an unset discriminator carries no selected value.
  oneof frame {
    harmos.v1.ChildRequest child = 1;
    harmos.v1.ChildCancel child_cancel = 2;
    harmos.v1.Response response = 3;
    harmos.v1.ChildDemand child_demand = 4;
  }
}

// Open demand for one declared stream; host ticks drive interval samples and closing the call ends demand.
message InstanceSamplesRequest {
  // Select exactly one variant; an unset discriminator carries no selected value.
  oneof frame {
    // First frame.
    harmos.v1.SamplesSelection open = 1;
    harmos.v1.Tick tick = 2;
  }
}

// Carries one or more declared stream rows within the active demand call.
message InstanceSamplesResponse {
  repeated harmos.v1.Sample samples = 1;
}
