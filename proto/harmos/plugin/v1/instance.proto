// Plugin Instance
//
// Calls the host makes to a running plugin through the plugin boundary.

syntax = "proto3";

package harmos.plugin.v1;

// === Imports === //

import "google/protobuf/timestamp.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/description.proto";
import "harmos/plugin/v1/invocation.proto";
import "harmos/plugin/v1/stream.proto";

// === Options === //

// === Services === //

// Serves one running plugin to its host over the plugin face; each connection receives its own host activation.
service Instance {
  // Identity, start time and declarations. Called once per connection, first.
  rpc Get(InstanceGetRequest) returns (InstanceGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }

  // One invocation of one operation. The host opens the call with a harmos.plugin.v1.Request.
  // While it runs, the plugin may send harmos.plugin.v1.ChildRequest frames and the host
  // answers each with a harmos.plugin.v1.ChildResponse. The plugin ends the call with a
  // harmos.plugin.v1.Response. The host may send harmos.plugin.v1.Cancel at any time.
  rpc Invoke(stream InstanceInvokeRequest) returns (stream InstanceInvokeResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }

  // One declared stream. The host opens the call with a harmos.plugin.v1.SamplesSelection;
  // opening it is the demand for the stream and closing it ends the demand.
  // For a stream with an interval the host then sends one harmos.plugin.v1.Tick per interval
  // and the plugin answers each with one sample. Only one tick may be unanswered.
  // Between receiving a tick and sending its sample, the plugin may send ChildRequest,
  // ChildDemand and ChildCancel frames; the host replies with ChildResponse on this
  // same stream. Child calls inherit SamplesSelection.scope and the admitted plugin's
  // caller context and grants, with the same routing and policy checks as Invoke.
  // Replies may arrive out of order and are matched by call ID, unique for the whole
  // Samples call, not reused on later ticks. Failures retain every field unchanged.
  // Answering the tick or ending the stream cancels its outstanding children and
  // suppresses their later replies. ChildCancel does the same for its child only.
  // Child traffic outside an unanswered tick (including device streams), unknown or
  // duplicate terminal reply IDs, and mixed sample/child responses are refused with INVALID_ARGUMENT.
  rpc Samples(stream InstanceSamplesRequest) returns (stream InstanceSamplesResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }

  // Sent before the host shuts down or removes the plugin. The plugin runs
  // its stop and cleanup hooks and then replies. A managed plugin exits
  // afterwards; a remote plugin keeps running.
  rpc Stop(InstanceStopRequest) returns (InstanceStopResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// Carries the protocol revision, host name and host version for Instance.Get.
message InstanceGetRequest {
  // Highest revision of harmos.model.v1 the host implements. Starts at 1 and grows
  // with each additive release.
  uint32 revision = 1;
  // Name and version of the host application, for logs.
  string host = 2;
  string host_version = 3;
}

// Supplies process identity, startup time, complete declarations and carrier limits for connection admission.
message InstanceGetResponse {
  // Stable plugin identifier, lowercase with dots or underscores.
  string id = 1;
  // Semantic version of the plugin.
  string version = 2;
  // Captured once when the process started. A changed value on reconnect
  // means the process restarted.
  google.protobuf.Timestamp started_at = 3;
  harmos.model.v1.Declarations declarations = 4;
  // Highest revision of harmos.model.v1 the plugin implements.
  uint32 revision = 5;
  // Name and version of the SDK that built the plugin, for logs.
  string sdk = 6;
  string sdk_version = 7;
  // Plugin-advertised carrier message ceiling; the host checks compatibility with its configured chunk/framing requirements.
  uint64 message_bytes = 8;
}

// === Invoke === //

// Carries an opening request, child reply or cancellation frame for Instance.Invoke.
message InstanceInvokeRequest {
  // Selects one variant; an unset discriminator carries no selected value.
  oneof frame {
    harmos.plugin.v1.Request request = 1;
    harmos.plugin.v1.ChildResponse child = 2;
    harmos.plugin.v1.Cancel cancel = 3;
  }
}

// Carries plugin-originated child traffic or the single terminal result for this attempt.
message InstanceInvokeResponse {
  // Selects one variant; an unset discriminator carries no selected value.
  oneof frame {
    harmos.plugin.v1.ChildRequest child = 1;
    harmos.plugin.v1.ChildCancel child_cancel = 2;
    harmos.plugin.v1.Response response = 3;
    harmos.plugin.v1.ChildDemand child_demand = 4;
  }
}

// === Samples === //

// Carries a stream selection, clock tick or child reply for Instance.Samples.
message InstanceSamplesRequest {
  // Selects one variant; an unset discriminator carries no selected value.
  oneof frame {
    // First frame.
    harmos.plugin.v1.SamplesSelection open = 1;
    harmos.plugin.v1.Tick tick = 2;
    // Reply to a child of the unanswered tick; never before open or after its sample.
    harmos.plugin.v1.ChildResponse child = 3;
  }
}

// Carries declared stream rows or child traffic for the unanswered tick within the active demand call.
message InstanceSamplesResponse {
  // A tick answer ends its child-call scope. Must be empty when a child frame is selected.
  repeated harmos.plugin.v1.Sample samples = 1;
  // Child frames do not answer the tick. Unset for sample-bearing responses.
  oneof frame {
    harmos.plugin.v1.ChildRequest child = 2;
    harmos.plugin.v1.ChildCancel child_cancel = 3;
    harmos.plugin.v1.ChildDemand child_demand = 4;
  }
}

// === Stop === //

// Carries the reason text for Instance.Stop.
message InstanceStopRequest {
  string reason = 1;
}

// Acknowledges that plugin stop and cleanup hooks have completed.
message InstanceStopResponse {}

// === Resources === //

// === Enums === //
