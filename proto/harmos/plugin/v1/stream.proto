// Stream Declarations and Samples
//
// Shared values exchanged by hosts, plugins and clients.

syntax = "proto3";

package harmos.plugin.v1;

// === Imports === //

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// === Options === //

// === Services === //

// === Requests and Responses === //

// === Resources === //

// Grants one interval window: `count` consecutive samples, the first at `start`, each one `period` later.
message Window {
  // Host time of the window's first sample.
  google.protobuf.Timestamp start = 1;
  // The stream's resolved interval.
  google.protobuf.Duration period = 2;
  // Samples in the window; at least one.
  uint64 count = 3;
  // One-based sequence of the window's first sample within the Samples call.
  uint64 sequence = 4;
}
// Answers part of the unanswered window with consecutive samples as columns.
message SampleBatch {
  // Zero-based index of this part's first sample within the window.
  uint64 offset = 1;
  // Samples in this part; at least one.
  uint64 count = 2;
  // A serialized message whose fields mirror the stream row's field numbers and
  // types, each repeated, holding one value per sample in sample order. Numeric
  // columns are packed; every sample has a value in every column.
  bytes columns = 3;
  // Set on the part that completes the window. It answers the window and ends its child calls.
  bool last = 4;
}
// Changes the listened members of a collection between windows. Empty releases demand.
message CollectionDemand {
  repeated string streams = 1;
}
// Acknowledges completed first-listener acquisition or last-listener cleanup.
message CollectionDemandResponse {}
// Answers exactly one tick of a collection window, including a tick with no rows.
message CollectionBatch {
  // Zero-based tick index within the outstanding window; consecutive from zero.
  uint64 offset = 1;
  repeated CollectionRows streams = 2;
  // Set exactly on the final tick of the window.
  bool last = 3;
}
// Rows published to one declared member, in publication order, at the tick's host timestamp.
message CollectionRows {
  string stream = 1;
  repeated bytes rows = 2;
}
// Opens demand for one declared plugin stream under an opaque invocation scope.
message SamplesSelection {
  // Identity of the declared stream, resolved under the current caller/activation.
  string stream = 1;
  // Opaque to Harmos. The product names what the stream belongs to.
  string scope = 2;
}
// Carries one device stream row, its publication timestamp and one-based sequence within a Samples call.
message Sample {
  // The device's own time if it supplies one; when unset the host stamps
  // the sample on arrival.
  google.protobuf.Timestamp at = 1;
  // Serialized row message of the stream.
  bytes row = 2;
  // Counts samples on this call from 1, so the host can see a gap.
  uint64 sequence = 3;
}

