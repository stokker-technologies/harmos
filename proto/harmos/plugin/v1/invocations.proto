// Invocations
//
// Plugin Invocation Facilities

syntax = "proto3";

package harmos.plugin.v1;

// === Imports === //

import "harmos/host/v1/invocations.proto";
import "harmos/model/v1/callers.proto";

// === Options === //

// === Services === //

// Context facilities carried only by admitted plugin child calls.
service Invocations {
  // Inspect an invocation owned by the caller; unknown or foreign instance handles refuse.
  rpc Get(harmos.host.v1.InvocationsGetRequest) returns (harmos.host.v1.InvocationsGetResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
  // Request cooperative cancellation of a caller-owned invocation and report its state; cancellation need not discard a handler's typed final result.
  rpc Cancel(harmos.host.v1.InvocationsCancelRequest) returns (harmos.host.v1.InvocationsCancelResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
  // Observe state changes of a caller-owned invocation through settlement; foreign or unknown handles refuse.
  rpc Watch(harmos.host.v1.InvocationsWatchRequest) returns (stream harmos.host.v1.InvocationsWatchResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
}

