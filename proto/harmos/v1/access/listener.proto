syntax = "proto3";
package harmos.v1.access;
// Configures TLS listener enablement, socket address and nonempty certificate subject names.
message ListenerValue {
  bool enabled = 1;
  // Socket address to bind; port zero permits the OS to choose a port.
  string endpoint = 2;
  // Nonempty certificate names; empty lists and empty entries refuse validation.
  repeated string certificate_names = 3;
}
// Read the persisted listener value, conditional revision and currently bound endpoint.
message ListenerGetRequest {
  // No payload fields.
}
// Returns persisted listener configuration, its conditional revision and the actual attached socket address.
message ListenerGetResponse {
  ListenerValue value = 1;
  // Opaque conditional listener revision; use the exact bytes for Set rather than deriving or incrementing them.
  bytes revision = 2;
  // Actual attached socket endpoint, which can differ from a configured port-zero address; empty when no listener is attached.
  string bound_endpoint = 3;
}
// Validate and apply the complete listener value at its expected revision; failed staging preserves the active listener and revision conflicts refuse.
message ListenerSetRequest {
  ListenerValue value = 1;
  // Exact revision returned by the corresponding read. A mismatch refuses; read again before retrying with changed input.
  bytes expected_revision = 2;
}
// Returns applied listener configuration, its conditional revision and the actual attached socket address.
message ListenerSetResponse {
  ListenerValue value = 1;
  // Opaque conditional listener revision; use the exact bytes for Set rather than deriving or incrementing them.
  bytes revision = 2;
  // Actual attached socket endpoint after applying the value; empty when no listener is attached.
  string bound_endpoint = 3;
}
// Owns the client TLS listener's persisted configuration and staged live replacement.
service Listener {
  // Read the persisted listener value, conditional revision and currently bound endpoint.
  rpc Get(ListenerGetRequest) returns (ListenerGetResponse);
  // Validate and apply the complete listener value at its expected revision; failed staging preserves the active listener and revision conflicts refuse.
  rpc Set(ListenerSetRequest) returns (ListenerSetResponse);
}
