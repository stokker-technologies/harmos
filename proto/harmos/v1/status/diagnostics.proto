// Client Diagnostics
//
// Calls an application or tool makes to the host.

syntax = "proto3";

package harmos.v1.status;

// === Imports === //

// === Options === //

option csharp_namespace = "Harmos.V1.StatusResources";

// === Services === //

// Exposes bounded ranges of the host's retained redacted diagnostics archive.
service Diagnostics {
  // Create a redacted diagnostics archive on an empty name at offset zero, or read bounded ranges of the retained archive; unknown/expired names refuse.
  rpc Get(DiagnosticsGetRequest) returns (DiagnosticsGetResponse);
}

// === Requests and Responses === //

// Carries the resource name, byte offset and byte bound for Diagnostics.Get.
message DiagnosticsGetRequest {
  // Empty creates a fresh archive and requires offset zero; otherwise selects the retained archive returned by an earlier response.
  string name = 1;
  // Zero-based byte offset, at most the selected archive length.
  uint64 offset = 2;
  // Positive range size no greater than the host's configured range_bytes budget.
  uint64 max_bytes = 3;
}

// Returns archive bytes at the requested offset with the retained archive identity, complete length and complete digest.
message DiagnosticsGetResponse {
  // Opaque retained archive identity used for subsequent ranges; a newer archive can retire it.
  string name = 1;
  bytes data = 2;
  uint64 total_length = 3;
  // 32-byte SHA-256 of the complete archive, not just the returned range.
  bytes sha256 = 4;
}

