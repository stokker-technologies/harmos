syntax = "proto2";
package harmos.storage.v1;

// One Storage Setting Shared by Host and SDK Defaults.
message StorageTransferSettings {
  optional uint64 chunk_bytes = 1 [default = 4194304];
}

// Space for Default Session, Receipt, Cut and Carrier Framing.
enum TransferFraming {
  TRANSFER_FRAMING_UNSPECIFIED = 0;
  TRANSFER_FRAMING_BYTES = 512;
}
