syntax = "proto3";
package harmos.v1;
import "harmos/v1/types.proto";
import "google/protobuf/timestamp.proto";
message HostIdentity { string application_name = 1; string application_version = 2; string library_version = 3; google.protobuf.Timestamp process_started_at = 4; string host_id = 5; }
enum ComponentState { COMPONENT_STATE_UNSPECIFIED = 0; COMPONENT_STATE_HEALTHY = 1; COMPONENT_STATE_DEGRADED = 2; COMPONENT_STATE_UNAVAILABLE = 3; }
message HealthComponent { string name = 1; ComponentState state = 2; string reason = 3; }
message HostStatus { HostIdentity identity = 1; bool available = 2; repeated HealthComponent components = 3; }
message StatusGetRequest {}
message StatusGetResponse { HostStatus status = 1; Position resolved_at = 2; }
message StatusWatchRequest { Position at = 1; }
message StatusWatchResponse { HostStatus status = 1; Position resolved_at = 2; }
service Status {
 rpc Get(StatusGetRequest) returns (StatusGetResponse);
 rpc Watch(StatusWatchRequest) returns (stream StatusWatchResponse);
}
