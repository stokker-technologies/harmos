syntax = "proto3";
package harmos.host.v1;

import "harmos/v1/plugin.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Resource Services Projected by the Runtime from These Same Contracts.
service CatalogEntries {
  rpc List(CatalogEntriesListRequest) returns (CatalogEntriesListResponse);
}
service Invocations {
  rpc Get(InvocationsGetRequest) returns (InvocationsGetResponse);
  rpc Cancel(InvocationsCancelRequest) returns (InvocationsCancelResponse);
  rpc Watch(InvocationsWatchRequest) returns (stream InvocationsWatchResponse);
}
service Time {
  rpc Get(harmos.v1.TimeGetRequest) returns (harmos.v1.TimeGetResponse);
  rpc Sleep(harmos.v1.TimeSleepRequest) returns (harmos.v1.TimeSleepResponse);
}

// Assignments are frozen for the lifetime of a private guest activation.
message AssignedOperation {
  string operation = 1;
  bytes fingerprint = 2;
  uint64 generation = 3;
}

message OperationAssignments {
  repeated AssignedOperation operations = 1;
}

// Controls refer only to invocations owned by the authenticated caller.
message InvocationsGetRequest { uint64 instance = 1; }
message InvocationsCancelRequest { uint64 instance = 1; string reason = 2; }
message InvocationsWatchRequest { uint64 instance = 1; }
message InvocationsGetResponse { InstanceState invocation = 1; }
message InvocationsCancelResponse { InstanceState invocation = 1; }
message InvocationsWatchResponse { InstanceState invocation = 1; }
message InstanceState {
  string phase = 1;
  string outcome = 2;
  bool cancellation_requested = 3;
  uint32 attempt = 4;
}

message CatalogEntriesListRequest {
  CatalogKind kind = 1;
  optional string schema = 2;
  harmos.v1.PageRequest page = 3;
}
// Storage catalogs retain their documented JSON storage representation.
message CatalogEntriesListResponse {
  bytes entries = 1;
  string next_page_token = 2;
  repeated DiscoveredOperation operations = 3;
  harmos.v1.ReadCut resolved_at = 4;
}
enum CatalogKind {
  CATALOG_KIND_OPERATIONS = 0;
  CATALOG_KIND_SCHEMAS = 1;
  CATALOG_KIND_STREAMS = 2;
  CATALOG_KIND_OBJECTS = 3;
}

// Descriptor bytes are a google.protobuf.FileDescriptorSet. Roots name messages
// in that set; input and output, when present, are stream item messages.
message Protobuf {
  bytes descriptors = 1;
  string request = 2;
  string response = 3;
  optional string input = 4;
  optional string output = 5;
}
message Grpc { string package = 1; string service = 2; string method = 3; bool managed = 4; }
message Grant { string operation = 1; optional string scope = 2; }
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PRIVATE = 1;
  VISIBILITY_PUBLIC = 2;
}
message OperationContract {
  string id = 1;
  string description = 2;
  Visibility visibility = 3;
  harmos.v1.OperationPolicy policy = 4;
  // True only for an explicitly replay-safe declaration.
  bool replay_safe = 5;
  bytes fingerprint = 6;
  // Absent for native-only declarations with no public protobuf binding.
  Protobuf protobuf = 7;
  Grpc grpc = 8;
}
message DiscoveredOperation {
  string owner = 1;
  uint64 generation = 2;
  OperationContract contract = 3;
  repeated Grant grants = 4;
  bool conditional_access = 5;
  bool grpc_available = 6;
}

// A Stream Publication Uses the Stream's Own Payload Codec.
message SamplesAppendRequest {
  string stream = 1;
  optional uint64 sequence = 3;
  google.protobuf.Timestamp published_at = 4;
  optional string context = 5;
  bytes payload = 6;
  repeated FollowingRow following = 7;
}
message FollowingRow {
  bytes payload = 1;
  google.protobuf.Duration published_delta = 2;
}
message SamplesAppendResponse {}
