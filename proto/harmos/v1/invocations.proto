syntax = "proto3";
package harmos.v1;
import "harmos/v1/types.proto";

service Invocations {
  rpc Invoke(InvocationsInvokeRequest) returns (InvocationsInvokeResponse);
  rpc Get(InvocationsGetRequest) returns (InvocationsGetResponse);
  rpc Cancel(InvocationsCancelRequest) returns (InvocationsCancelResponse);
  rpc Watch(InvocationsWatchRequest) returns (stream InvocationsWatchResponse);
}

message InvocationsGetRequest { uint64 instance = 1; }

message InvocationsCancelRequest { uint64 instance = 1; string reason = 2; }

message InvocationsWatchRequest { uint64 instance = 1; }

message InvocationsGetResponse { harmos.v1.InstanceState invocation = 1; }

message InvocationsCancelResponse { harmos.v1.InstanceState invocation = 1; }

message InvocationsWatchResponse { harmos.v1.InstanceState invocation = 1; }

message InvocationsInvokeRequest { string operation = 1; bytes fingerprint = 2; bytes payload = 3; }
message InvocationsInvokeResponse { bytes payload = 1; }
