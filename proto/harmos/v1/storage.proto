syntax = "proto3";
package harmos.storage.v1;

import "google/protobuf/timestamp.proto";

// Histories and positions are native storage identities, independent of transport.
message StoreHistory { string store = 1; string epoch = 2; }
message StorageCursor { StoreHistory history = 1; uint64 sequence = 2; }
message MutationWindow {
  StoreHistory history = 1;
  string id = 2;
  google.protobuf.Timestamp expires_at = 3;
}
message StorageStatus {}
message StorageInfo {
  StorageCursor accepted = 1;
  StorageCursor saved = 2;
  MutationWindow mutations = 3;
  uint64 file_batch_bytes = 4;
}

message MutationId { string window = 1; string key = 2; }
message FileMetadata {
  string id = 1;
  optional string scope = 2;
  string media_type = 3;
  optional uint64 expected_length = 4;
  optional bytes expected_sha256 = 5;
}
message StagedFile { StoreHistory history = 1; string id = 2; }
message FileSession { StoreHistory history = 1; string id = 2; uint64 generation = 3; }
message FileProducer { FileSession session = 1; uint64 length = 2; }
message FileReference { StorageCursor position = 1; FileMetadata metadata = 2; uint64 length = 3; bytes sha256 = 4; }
enum FilePhase { PRODUCING = 0; FINISHED = 1; ABANDONED = 2; }
message FileProgress { uint64 length = 1; FilePhase phase = 2; }
message CreateFile { MutationId mutation = 1; FileMetadata metadata = 2; }
message AppendFile { MutationId mutation = 1; FileSession session = 2; uint64 offset = 3; bytes bytes = 4; }
message ResumeFile { MutationId mutation = 1; FileSession session = 2; }
message FinishFile { MutationId mutation = 1; FileSession session = 2; }
message AbandonFile { MutationId mutation = 1; FileSession session = 2; }
message DeleteFile { MutationId mutation = 1; StagedFile file = 2; }

message DirectoryRule { string pattern = 1; bool include = 2; }
message DirectorySelection { string root = 1; bool recursive = 2; repeated DirectoryRule rules = 3; }
message DirectoryEntry { string path = 1; bool directory = 2; uint64 length = 3; }
message DirectoryCompletion { uint64 entries = 1; }
message DirectoryRename { string from = 1; string to = 2; }
message Empty {}
message DirectoryEvent {
  oneof event {
    DirectoryEntry existing = 1;
    Empty initial_scan_complete = 2;
    DirectoryEntry created = 3;
    DirectoryEntry modified = 4;
    string removed = 5;
    DirectoryRename renamed = 6;
    Empty rescan_required = 7;
  }
}
message ListDirectory { DirectorySelection selection = 1; }
message WatchDirectory { DirectorySelection selection = 1; bool include_existing = 2; }

message FileSource { oneof source { FileReference stored = 1; string local = 2; } }
message ByteRange { uint64 offset = 1; optional uint64 limit = 2; }
message FileBatch { uint64 offset = 1; bytes bytes = 2; }
message FileCompletion { uint64 bytes = 1; }
message FileHash { uint64 bytes_read = 1; bytes sha256 = 2; }
message FollowStart { oneof start { Empty beginning = 1; Empty end = 2; uint64 at = 3; } }
message FileEvent { oneof event { FileBatch data = 1; uint64 truncated = 2; Empty replaced = 3; } }
enum CaptureConsistency { BOUNDED = 0; STABLE = 1; }
message ReadFile { FileSource source = 1; ByteRange range = 2; }
message HashFile { FileSource source = 1; ByteRange range = 2; }
message CaptureFile { FileSource source = 1; ByteRange range = 2; FileMetadata metadata = 3; CaptureConsistency consistency = 4; }
message FollowFile { FileSource source = 1; FollowStart start = 2; }
message FollowProduction { StagedFile file = 1; uint64 offset = 2; }

// Storage schema graphs describe persisted payloads; they do not change their encoding.
enum PayloadEncoding { PAYLOAD_ENCODING_UNSPECIFIED = 0; POSTCARD_V1 = 1; }
message SchemaKey { string id = 1; uint32 version = 2; PayloadEncoding payload_encoding = 3; }
enum SchemaCardinality { REQUIRED = 0; OPTIONAL = 1; REPEATED = 2; VARIANT = 3; }
enum SchemaKind { BOOL = 0; UINT32 = 1; UINT64 = 2; INT32 = 3; INT64 = 4; FLOAT32 = 5; FLOAT64 = 6; STRING = 7; BYTES = 8; MESSAGE = 9; }
message SchemaField { string name = 1; uint32 tag = 2; SchemaKind kind = 3; SchemaCardinality cardinality = 4; optional uint64 definition = 5; }
message SchemaDefinition { repeated SchemaField fields = 1; }
enum SchemaForm { OBJECT = 0; UNIT = 1; VALUE = 2; TUPLE = 3; EXTERNAL = 4; INTERNAL = 5; ADJACENT = 6; UNTAGGED = 7; }
enum SchemaOmission { OMIT_NONE = 0; OMIT_EMPTY = 1; }
message SchemaRepresentation {
  uint64 definition = 1;
  SchemaForm form = 2;
  optional string tag = 3;
  optional string content = 4;
  map<string, SchemaOmission> omissions = 5;
  repeated string maps = 6;
}
message SchemaGraph { uint64 root = 1; repeated SchemaDefinition definitions = 2; repeated SchemaRepresentation representations = 3; }
message SchemaInput { SchemaKey key = 1; SchemaGraph graph = 2; }
message WriteSchema { MutationId mutation = 1; SchemaInput schema = 2; }
