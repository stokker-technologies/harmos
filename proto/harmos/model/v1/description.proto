// Plugin Descriptions
//
// Shared values exchanged by hosts, plugins and clients.

syntax = "proto3";

package harmos.model.v1;

// === Imports === //

import "google/protobuf/descriptor.proto";
import "harmos/model/v1/operation.proto";
import "harmos/model/v1/stream.proto";

// === Options === //

// === Services === //

// === Requests and Responses === //

// === Resources === //

// Freezes the operations, dependencies, streams, contribution sections and reachable protobuf types admitted for a plugin activation.
message Declarations {
  // Operations the plugin serves.
  repeated OperationContract operations = 1;
  // Operations it calls on the host or on other plugins.
  repeated Requirement requires = 2;
  // Streams it can publish.
  repeated StreamDeclaration streams = 3;
  // Product contributions, opaque to Harmos.
  repeated Section sections = 4;
  // SHA-256 over the serialized fields 1 to 4, 6 and 7, in field order.
  bytes digest = 5;
  // Definitions of every message named in this declarations.
  google.protobuf.FileDescriptorSet types = 6;
  // Admission lanes owned by this plugin instance; an empty list preserves the original encoding.
  repeated LaneDeclaration lanes = 7;
}

// Declares one plugin-owned admission lane; names must be unique and must not be empty or reserved.
message LaneDeclaration {
  string name = 1;
  // Exactly one capacity is required. Boolean alternatives must be true and concurrent must be positive.
  oneof capacity {
    // Admit one invocation at a time.
    bool serial = 2;
    // Admit at most this many invocations at a time.
    uint32 concurrent = 3;
    // Admit invocations without a concurrency bound.
    bool unbounded = 4;
  }
}

// Carries a typed product contribution whose payload is opaque to the library.
message Section {
  // Fully qualified message name of the payload, for example
  // "application.v1.Contributions". At most one section per name.
  string type = 1;
  // Encoded message named by type; interpretation belongs to the product contribution owner.
  bytes payload = 2;
}

