[project]
name = "harmos-tools"
version = "0.0.0"
description = "Repository automation for Harmos"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
test = ["build==1.6.1", "protobuf==7.36.2", "setuptools==84.0.0", "types-protobuf==7.35.1.20260906", "wheel==0.48.0"]
dev = ["ruff==0.17.0", "ty==0.0.86", "hatchling==1.32.4"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmos_tools"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"
