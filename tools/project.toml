[languages.python]
exclude = [".venv", "tools/python/.ruff_cache"]
generated = ["target/generated/python/src"]
roots = ["tools/python"]

[languages.rust]
exclude = ["crates/cargo-harmos/templates"]
roots = ["crates", "examples"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip2"]

[[package.bundles]]
language = "rust"
name = "schematic-{version}-{target}.zip"
profiles = ["dev", "release"]
targets = ["linux-x86_64"]

[[package.bundles.inputs]]
destination = "schematic-cli"
path = "target/build/{profile}/{target}/bin/schematic-cli"

[[package.bundles.inputs]]
destination = "plugins/schematic-sidecar"
path = "target/build/{profile}/{target}/bin/plugins/schematic-sidecar"

[[package.bundles.inputs]]
destination = "plugins/schematic-guest.wasm"
path = "target/build/{profile}/{target}/bin/plugins/schematic-guest.wasm"

[[package.bundles]]
language = "rust"
name = "schematic-{version}-{target}.zip"
profiles = ["dev", "release"]
targets = ["windows-x86_64"]

[[package.bundles.inputs]]
destination = "schematic-cli.exe"
path = "target/build/{profile}/{target}/bin/schematic-cli.exe"

[[package.bundles.inputs]]
destination = "plugins/schematic-sidecar.exe"
path = "target/build/{profile}/{target}/bin/plugins/schematic-sidecar.exe"

[[package.bundles.inputs]]
destination = "plugins/schematic-guest.wasm"
path = "target/build/{profile}/{target}/bin/plugins/schematic-guest.wasm"

[[package.executables]]
command = "cargo-harmos"
installers = ["mise"]
name = "cargo-harmos"
package = "cargo-harmos"
release = true
verify = ["--version"]

[package.executables.targets]
linux-x86_64 = "x86_64-unknown-linux-gnu"
windows-x86_64 = "x86_64-pc-windows-msvc"

[project]
name = "Harmos"
platforms = ["unix", "windows"]
visibility = "public"

[release]
crates_bootstrap_secret = "CARGO_REGISTRY_TOKEN"
lock_commands = [
  [
    "cargo",
    "update",
    "--workspace",
  ],
  [
    "cargo",
    "update",
    "--manifest-path",
    "examples/schematic/Cargo.toml",
    "--workspace",
  ],
  [
    "cargo",
    "update",
    "--manifest-path",
    "crates/harmos-guest/tests/fixtures/sandbox/Cargo.toml",
    "--workspace",
  ],
]
product = "harmos"
provider = "github"
repository = "stokker-technologies/harmos"
targets = ["linux-x86_64", "windows-x86_64"]

[version]
files = ["Cargo.toml", "examples/schematic/Cargo.toml", "crates/harmos-guest/tests/fixtures/sandbox/Cargo.toml"]
value = "0.1.13"
