[ci.runners]
unix = "ubuntu-24.04"
windows = "windows-2022"

[conventions.testing.deadlines]
acceptance = 900
integration = 120
system = 900
unit = 120


[[conventions.testing.overrides]]
category = "system"
language = "rust"
reason = "Reviewed correctness bound with the 120-second test minimum; performance is measured by benchmarks"
select = "binary_id(=harmos-runtime::system) & (test(=schematic::cli_backends_reopen) | test(=schematic::cli_streams_settle))"
timeout_seconds = 120

[[conventions.testing.overrides]]
category = "acceptance"
language = "rust"
reason = "Reviewed correctness bound with the 120-second test minimum; performance is measured by benchmarks"
select = "binary_id(=harmos-packaging::acceptance) & test(=proto::portable_messages_cross)"
timeout_seconds = 120

[[conventions.testing.overrides]]
category = "acceptance"
language = "rust"
reason = "Reviewed correctness bound with the 120-second test minimum; performance is measured by benchmarks"
select = "binary_id(=harmos-packaging::acceptance) & test(=proto::boxed_messages_cross)"
timeout_seconds = 120

[[conventions.testing.overrides]]
category = "acceptance"
language = "rust"
reason = "Reviewed correctness bound with the 120-second test minimum; performance is measured by benchmarks"
select = "binary_id(=harmos-packaging::acceptance) & test(=proto::exported_sources_compile)"
timeout_seconds = 120

[[conventions.testing.overrides]]
category = "system"
language = "rust"
reason = "Guest Component Journeys Retain Their Existing Hang Bound"
select = "binary_id(=harmos::system) | (binary_id(=harmos-runtime::system) & test(guest))"
timeout_seconds = 120

[languages.python]
exclude = [".venv", "tools/python/.ruff_cache"]
generated = ["target/generated/python/src", "sdk/python/src/harmos/v1/*_pb2*", "sdk/python/tests/fixtures/conformance/v1/*_pb2*"]
roots = ["tools/python", "sdk/python"]

[languages.rust]
exclude = []
roots = ["crates", "examples"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip2"]

[[package.bundles]]
language = "rust"
name = "schematic-{version}-{target}.zip"
profiles = ["dev", "release"]
targets = ["linux-x86_64"]

[[package.bundles.inputs]]
destination = "schematic-cli"
path = "target/build/{profile}/{target}/bin/schematic-cli"

[[package.bundles.inputs]]
destination = "plugins/schematic-sidecar"
path = "target/build/{profile}/{target}/bin/plugins/schematic-sidecar"

[[package.bundles.inputs]]
destination = "plugins/schematic-guest.wasm"
path = "target/build/{profile}/{target}/bin/plugins/schematic-guest.wasm"

[[package.bundles]]
language = "rust"
name = "schematic-{version}-{target}.zip"
profiles = ["dev", "release"]
targets = ["windows-x86_64"]

[[package.bundles.inputs]]
destination = "schematic-cli.exe"
path = "target/build/{profile}/{target}/bin/schematic-cli.exe"

[[package.bundles.inputs]]
destination = "plugins/schematic-sidecar.exe"
path = "target/build/{profile}/{target}/bin/plugins/schematic-sidecar.exe"

[[package.bundles.inputs]]
destination = "plugins/schematic-guest.wasm"
path = "target/build/{profile}/{target}/bin/plugins/schematic-guest.wasm"

[project]
name = "Harmos"
platforms = ["unix", "windows"]
visibility = "public"

[release]
nightly = true
crates_bootstrap_secret = "CARGO_REGISTRY_TOKEN"
lock_commands = [
  [
    "cargo",
    "update",
    "--workspace",
  ],
  [
    "cargo",
    "update",
    "--manifest-path",
    "examples/schematic/Cargo.toml",
    "--workspace",
  ],
  [
    "cargo",
    "update",
    "--manifest-path",
    "sdk/rust/tests/fixtures/sandbox/Cargo.toml",
    "--workspace",
  ],
]
product = "harmos"
provider = "github"
repository = "stokker-technologies/harmos"
targets = ["linux-x86_64", "windows-x86_64"]

[release.target_triples]
linux-x86_64 = "x86_64-unknown-linux-gnu"
windows-x86_64 = "x86_64-pc-windows-msvc"

[version]
files = ["Cargo.toml", "examples/schematic/Cargo.toml", "sdk/rust/tests/fixtures/sandbox/Cargo.toml", "sdk/python/pyproject.toml"]
value = "0.1.14"
