[ci.impact]
default = "full"

[[ci.impact.rules]]
include = [
  "**/skills/**",
  "**/.agents/**",
  "**/.codex/**",
  "**/.claude/**",
  "**/AGENTS.md",
  "**/CLAUDE.md",
  "**/.github/copilot-instructions.md",
  "**/README.md",
  "**/readme.md",
  "**/CONTRIBUTING.md",
  "**/contributing.md",
]
jobs = []
name = "guidance"

[[ci.impact.rules]]
exclude = [
  "docs/examples/**",
  "docs/tutorials/**",
  "docs/src/**",
  "**/skills/**",
  "**/.agents/**",
  "**/.codex/**",
  "**/.claude/**",
  "**/AGENTS.md",
  "**/CLAUDE.md",
  "**/.github/copilot-instructions.md",
  "**/README.md",
  "**/readme.md",
  "**/CONTRIBUTING.md",
  "**/contributing.md",
]
include = ["LICENSE", "LICENSE.*", "docs/**/*.md"]
jobs = ["check:repository"]
name = "prose"

[[ci.jobs]]
id = "check:python:generated"
inputs = ["build#product"]

[[ci.jobs]]
id = "build"

[ci.jobs.outputs]
product = [
  "target/build/{profile}/{target}/bin",
  "target/build/{profile}/{target}/lib",
  "target/build/{profile}/{target}/product",
  "target/generated/python/pyproject.toml",
  "target/generated/python/src",
]

[[ci.jobs]]
id = "build:rust:tests"

[ci.jobs.outputs]
fixtures = ["target/build/{profile}/{target}/fixtures"]
tests = ["target/build/{profile}/{target}/tests/archive.tar.zst", "target/build/{profile}/{target}/tests/compiler.json"]

[[ci.jobs]]
id = "build:rust:bench"

[ci.jobs.outputs]
bench = ["target/build/bench/{target}/bench", "target/build/bench/{target}/bin", "target/build/bench/{target}/fixtures"]

[[ci.jobs]]
id = "prepare:tests:fixtures"
inputs = ["build#product", "build:rust:tests#fixtures"]

[ci.jobs.outputs]
fixtures = ["target/build/{profile}/{target}/fixtures"]

[[ci.jobs]]
id = "test:rust:unit"
inputs = ["build:rust:tests#tests"]

[[ci.jobs]]
id = "test:rust:integration"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures"]

[[ci.jobs]]
id = "test:rust:acceptance"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures", "build#product"]

[[ci.jobs]]
id = "test:rust:system"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures", "build#product"]

[[ci.jobs]]
id = "test:rust:starter"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures", "build#product"]
pipelines = ["nightly"]

[[ci.jobs]]
id = "test:rust:coverage"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures", "build#product"]

[[ci.jobs]]
id = "bench:rust:unit"
inputs = ["build:rust:bench#bench"]

[[ci.jobs]]
id = "bench:rust:integration"
inputs = ["build:rust:bench#bench"]

[[ci.jobs]]
id = "bench:rust:system"
inputs = ["build:rust:bench#bench"]

[[ci.jobs]]
id = "package:rust"
inputs = ["build#product"]

[ci.jobs.outputs]
package = ["target/package/{profile}/{target}"]

[[ci.jobs]]
id = "release:publish:dry"
inputs = ["package:rust#package"]

[[ci.jobs]]
id = "release:rehearse"
inputs = ["package:rust#package"]

[[ci.jobs]]
id = "release:publish"
inputs = ["package:rust#package"]

[[ci.jobs]]
id = "release:verify"
inputs = ["package:rust#package"]

[ci.runners]
unix = "ubuntu-24.04"
windows = "windows-2022"

[conventions.testing.deadlines]
acceptance = 900
integration = 120
system = 900
unit = 120

[conventions.testing.limits]
acceptance = 128
integration = 1024
system = 64
unit = 512

