[package]
name = "cargo-metadata-fixture"
version = "@VERSION@"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[[bin]]
name = "cargo-metadata-fixture"
required-features = ["native"]
[features]
default = ["native"]
native = ["harmos/derive", "harmos/sidecar"]
guest = ["harmos/derive", "harmos/guest"]
[dependencies]
harmos = { path = "@HARMOS_PATH@", default-features = false, features = ["artifact"] }
serde = { version = "1", features = ["derive"] }
[workspace]
[profile.stripped-fixture]
inherits = "dev"
debug = 0
strip = true
[profile.plugin-fixture]
inherits = "dev"
debug = 0
