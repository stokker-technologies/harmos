[package]
name = "cargo-metadata-fixture"
version = "@VERSION@"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[[bin]]
name = "cargo-metadata-fixture"
required-features = ["native"]
[features]
default = ["native"]
native = []
guest = []
[dependencies]
harmos = { package = "@SDK_PACKAGE@", path = "@SDK_PATH@", default-features = false, features = ["derive", "kit"] }
serde = { version = "1", features = ["derive"] }
[workspace]
[profile.stripped-fixture]
inherits = "dev"
debug = 0
strip = true
[profile.plugin-fixture]
inherits = "dev"
debug = 0
