# === Package ===

[package]
name = "harmos-sidecar"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version = { workspace = true }

# === Package Targets ===

[[bin]]
name = "harmos-sidecar-catalog-fixture"
path = "tests/fixtures/catalog_sidecar.rs"
required-features = ["kit", "derive"]
test = false
bench = false

[[bin]]
name = "harmos-sidecar-throughput-fixture"
path = "tests/fixtures/throughput_sidecar.rs"
required-features = ["kit", "derive"]
test = false
bench = false

[[bin]]
name = "harmos-sidecar-attach-fixture"
path = "tests/fixtures/attach_sidecar.rs"
required-features = ["transport"]
test = false
bench = false

# === Features ===

[features]
default = ["derive", "kit"]
kit = ["transport", "dep:getrandom"]
# The Shared Process Boundary Without Plugin Authoring Or Callback Runners
transport = [
  "dep:sha2",
  "dep:getrandom",
  "dep:libc",
  "dep:postcard",
  "dep:futures-util",
  "dep:tokio",
  "dep:windows-sys",
]

derive = ["harmos-domain/derive"]
# Optional Payload Codec Only; No Host Networking Or gRPC Carrier
grpc = ["harmos-sdk/grpc"]
streaming = ["harmos-sdk/streaming"]

# === Dependencies ===

[dependencies]
# Local
harmos-sdk = { workspace = true }
harmos-domain = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
getrandom = { workspace = true, features = ["std"], optional = true }
semver = { workspace = true, default-features = true }
sha2 = { workspace = true, default-features = true, optional = true }

# Serialization
postcard = { workspace = true, optional = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, default-features = true, features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
], optional = true }

