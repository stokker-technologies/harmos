# === Package ===

[package]
name = "harmos-domain"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The authoring attributes, on by default the way serde ships its derives. Every
# trait beneath them is an ordinary public contract, so a crate that turns this
# off writes the implementations by hand and links no proc-macro chain at all.
version = { workspace = true }

# === Package Targets ===

# === Features ===

[features]
default = ["derive"]
bindings-python = ["reflection", "dep:sha2", "dep:tempfile"]
derive = ["dep:harmos-macros"]
grpc = ["dep:prost", "dep:prost-reflect"]
reflection = ["grpc", "dep:heck"]
streaming = ["dep:tokio"]

# === Dependencies ===

[dependencies]
# Local
harmos-macros = { workspace = true, default-features = true, optional = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging

# Utilities
heck = { workspace = true, optional = true }
semver = { workspace = true, default-features = true }
sha2 = { workspace = true, optional = true }
time = { workspace = true, default-features = true }

# Serialization
postcard = { workspace = true }
prost = { workspace = true, default-features = true, optional = true }
prost-reflect = { workspace = true, optional = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }

# Configuration

# Filesystem
tempfile = { workspace = true, optional = true }

# Parsing
memchr = { workspace = true, default-features = true }

# Concurrency

# Async
tokio = { workspace = true, optional = true }

# Networking

# Storage

# UI

# Testing

# === Build Dependencies ===

# === Dev Dependencies ===

[dev-dependencies]
# Local
harmos-macros = { workspace = true }

# Git

# Error Handling

# Logging

# Utilities

# Serialization
protoc-bin-vendored = { workspace = true }

# Configuration

# Filesystem
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

# Networking

# Storage

# UI

# Testing

# === Target Dependencies ===

# === Test Targets ===

[[test]]
name = "message"
path = "tests/message/main.rs"
required-features = ["derive", "grpc"]

[[test]]
name = "grpc"
path = "tests/grpc/main.rs"
required-features = ["derive", "reflection"]

