# === Package === #

[package]
name = "harmos-domain"
description = "Harmos domain model: stored schemas, identities, state recovery and storage contracts."
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The data derives, on by default the way serde ships its derives. Every
# trait beneath them is an ordinary public contract, so a crate that turns this
# off writes the implementations by hand and links no proc-macro chain at all.
version = { workspace = true }

# === Package Targets === #

# === Features === #

[features]
default = ["derive"]
derive = ["dep:harmos-sdk-derive"]

# === Dependencies === #

[dependencies]
# Local
harmos-protocol = { workspace = true }
harmos-sdk-derive = { workspace = true, default-features = true, optional = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, features = ["std"] }

# Utilities
sha2 = { workspace = true }
time = { workspace = true, default-features = true }

# Serialization
prost = { workspace = true }
prost-reflect = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

# Downstream Crates Stay Path-Only So the Packaged Manifest Drops Them Instead of Forming a Publish Cycle
[dev-dependencies]
# Local
harmos-sdk-derive = { path = "../../sdk/rust/derive" }
harmos-packaging = { path = "../../tools/packaging", features = ["generate-proto"] }
harmos-operations = { path = "../harmos-operations", features = ["grpc"] }

# Git

# Error Handling

# Logging
tracing = { workspace = true, features = ["std"] }

# Utilities

# Serialization
prost-reflect = { workspace = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Target Dependencies === #

# === Test Targets === #

[[test]]
name = "integration"
path = "tests/message/main.rs"
required-features = ["derive"]

# === Bench Targets === #

# === Example Targets === #

# === Workspace Lints === #

# === Lints === #

[lints]
workspace = true

