[dependencies]
# Local
harmos-packaging = { workspace = true, optional = true }
harmos-domain = { workspace = true, features = ["derive", "streaming"] }
harmos-guest = { workspace = true, optional = true }
harmos-macros = { workspace = true, default-features = true }
harmos-signal = { workspace = true, default-features = false }

