# === Package === #

[package]
name = "harmos"
description = "Harmos facade: stateful Rust applications with history, live data and plugins."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

version = { workspace = true }

# === Package Targets === #

# === Features === #

[features]
default = []
runtime = ["dep:harmos-runtime", "dep:harmos-sdk"]
plugin = ["runtime", "harmos-runtime/plugin"]
sidecar = [
  "runtime",
  "dep:harmos-sidecar",
  "harmos-sidecar/kit",
  "harmos-sidecar/derive",
  "harmos-sidecar/grpc",
  "harmos-sidecar/streaming",
  "harmos-runtime?/plugin-sidecar",
]
grpc = ["runtime", "harmos-runtime?/grpc", "harmos-sdk?/grpc", "harmos-sidecar?/grpc"]
streaming = ["runtime", "harmos-sdk?/streaming", "harmos-sidecar?/streaming"]
generate-proto = ["runtime", "harmos-runtime/generate-proto"]
signal = ["runtime", "harmos-runtime/signal"]
signal-fft = ["runtime", "harmos-runtime/signal-fft"]
simulation = ["runtime", "harmos-runtime/simulation"]

# === Dependencies === #

[dependencies]
# Local
harmos-domain = { workspace = true, features = ["derive"] }
harmos-macros = { workspace = true }
harmos-operations = { workspace = true }

