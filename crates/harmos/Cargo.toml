# === Bench Targets ===

# Both carriers, because the fixture is a sidecar program that co-links a guest
# declaration into its own artifact — the one shape that proves a single binary
# can carry two declarations. Declaring only `sidecar` left it built against a
# `harmos::guest` that the selected features had not opened.
[[bench]]
name = "runtime"
path = "benches/runtime/main.rs"
harness = false

[[bench]]
name = "operations"
path = "benches/operations/main.rs"
harness = false

[[bench]]
name = "storage"
