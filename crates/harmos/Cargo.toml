# === Package ===

[package]
name = "harmos"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

# One binary per pillar, so a failure names the pillar it belongs to, a
# filter compiles one pillar rather than all of them, and no pillar's
# failure hides another's. The floor is the host core and the durable ports
# every pillar commits against; the carriers `boundaries` aggregates stay
# gated inside it, so a build that names no carrier still compiles it.

# The census names both carriers in type position — that is how a renamed or
# deleted loader surface breaks the build rather than passing unwatched — so
# unlike its siblings it cannot be compiled without them.
version = { workspace = true }

# === Package Targets ===

[[bin]]
name = "harmos-sidecar-fixture"
path = "tests/fixtures/sidecar.rs"
required-features = ["plugin-sidecar", "plugin-guest"]

[[bin]]
name = "harmos-admission-fixture"
path = "tests/fixtures/admission.rs"
required-features = ["plugin-sidecar"]

[[bin]]
name = "harmos-process-fixture"
path = "tests/fixtures/routing.rs"
required-features = ["plugin-sidecar"]
test = false
bench = false

[[bin]]
name = "harmos-process-core-fixture"
path = "tests/fixtures/process_core.rs"
required-features = ["plugin-sidecar"]
test = false
bench = false

[[bin]]
name = "harmos-process-provider-fixture"
path = "tests/fixtures/process_provider_main.rs"
required-features = ["plugin-sidecar"]
test = false
bench = false

[[bin]]
name = "harmos-process-client-fixture"
path = "tests/fixtures/process_client_main.rs"
required-features = ["plugin-sidecar"]
test = false
bench = false

[[bin]]
name = "harmos-stream-consumer-fixture"
path = "tests/fixtures/stream_consumer.rs"
required-features = ["plugin-sidecar"]
test = false
bench = false

# === Features ===

# Core Runtime And Authoring Are Always Available
[features]
default = []
bindings-python = ["harmos-contract/bindings-python"]
packaging = ["dep:harmos-bundle", "dep:notify", "dep:process-wrap", "dep:tempfile"]
packaging-sidecar = ["packaging"]
packaging-guest = ["packaging", "dep:harmos-guest", "harmos-guest/componentize"]
plugin = ["dep:petgraph", "dep:semver", "semver/serde", "dep:harmos-bundle"]
plugin-sidecar = [
  "plugin",
  "dep:harmos-sidecar",
  "harmos-sidecar/kit",
  "harmos-sidecar/derive",
  "tokio/io-util",
  "tokio/process",
]
plugin-guest = [
  "plugin",
  "dep:harmos-guest",
  "harmos-guest/kit",
  "harmos-guest/derive",
  "dep:wasmtime",
]
grpc = [
  "reflection",
  "dep:tonic-reflection",
  "dep:http-body",
  "dep:heck",
  "dep:bytes",
  "dep:tonic",
  "dep:prost-reflect",
  "dep:tonic-web",
  "dep:tower",
  "dep:tower-http",
  "tonic/tls-ring",
]
# Descriptor Projection (`harmos::grpc::Artifacts`) Without The gRPC Server.
reflection = ["harmos-contract/reflection"]
signal = ["dep:harmos-signal"]
signal-fft = ["signal", "harmos-signal/fft"]
simulation = ["tokio/test-util"]

# === Dependencies ===

[dependencies]
# Local
harmos-bundle = { workspace = true, optional = true }
harmos-contract = { workspace = true, features = ["derive", "streaming"] }
harmos-guest = { workspace = true, optional = true }
harmos-macros = { workspace = true, default-features = true }
harmos-signal = { workspace = true, default-features = false, optional = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
bytes = { workspace = true, optional = true }
# Retry Windows Use Native Entropy Or Web Crypto On Browser WebAssembly.
getrandom = { workspace = true, features = ["std", "wasm_js"] }
heck = { workspace = true, optional = true }
petgraph = { workspace = true, default-features = true, optional = true }
semver = { workspace = true, default-features = true, optional = true }
sha2 = { workspace = true, default-features = true }

# Serialization
prost-reflect = { workspace = true, optional = true, features = ["serde"] }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true, features = ["raw_value"] }

# Configuration

# Filesystem
notify = { workspace = true, optional = true }
tempfile = { workspace = true, default-features = true, optional = true }

# Parsing

# Concurrency
process-wrap = { workspace = true, optional = true, features = [
  "std",
  "job-object",
  "process-group",
] }

# Async
futures-core = { workspace = true, default-features = true }
futures-util = { workspace = true }
tokio = { workspace = true, default-features = true, features = [
  "rt",
  "sync",
  "time",
  "macros",
] }

# Networking
http-body = { workspace = true, optional = true }
tonic = { workspace = true, default-features = true, optional = true }
tonic-reflection = { workspace = true, features = ["server"], optional = true }
tonic-web = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
