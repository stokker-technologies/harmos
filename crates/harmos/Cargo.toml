path = "tests/fixtures/stream_consumer.rs"
required-features = ["runtime", "sidecar", "derive"]
test = false
bench = false

# === Features ===

# One feature per facility a consumer reaches through this crate, so a product
# names `harmos` and nothing beneath it. Storage ports and implementation share
# the runtime feature. A default build is a host with authoring macros and none
# of the direct carrier boundaries.
[features]
default = ["runtime", "derive"]
# The authoring attributes, on by default the way serde ships its derives.
# Every trait they generate an implementation of is an ordinary public contract
# — `Plugin`, operation providers, observers and catalogs — so a crate that
# turns this off writes those implementations by hand against the same paths and
# links no proc-macro chain. `__private` stays open either way, because that is
# where a hand-written implementation names what it cannot spell.
derive = [
  "dep:harmos-macros",
  "harmos-contract/derive",
  "harmos-guest?/derive",
  "harmos-sidecar?/derive",
]
# The host core: the journal, and everything derived from it — streams, work,
# evidence, recovery, and the assembly that boots them. An author who only
# declares — a native sidecar, a packaging tool — compiles the kit and the
# declaration types and none of this, which is what makes it a feature rather
# than the crate.
runtime = [
  "harmos-contract/streaming",
  "dep:getrandom",
  "dep:futures-core",
  "dep:futures-util",
  "dep:sha2",
  "dep:tokio",
  "tokio/macros",
]
# The declaration surface both plugin carriers name: routes, refusals, the
# registrar an artifact declares through, and the artifact scan a host reads
# before it loads anything. No optional dependency — the contract is already
# linked, and the feature is what decides whether a product may name it.
artifact = []
# The measurement kernels. They name no runtime and this crate names them
# nowhere: the feature is a hand-out, not a layer the read path gained.
signal = ["dep:harmos-signal"]
fft = ["signal", "harmos-signal/fft"]
sim = ["runtime", "tokio/macros", "tokio/test-util"]
# In-process providers use the shared planner and lifecycle without a process
# transport or WebAssembly engine. Existing artifact hosts expose it as well.
load = ["runtime", "dep:petgraph", "dep:semver", "tokio/macros"]
# Native authoring selects the SDK without supervising child processes.
grpc = [
  "dep:tonic-reflection",
  "dep:http-body",
  "dep:heck",
  "dep:bytes",
  "dep:tonic",
  "dep:prost-reflect",
  "harmos-contract/reflection",
]
grpc-tls = ["grpc", "tonic/tls-ring"]
# Serves gRPC-Web (HTTP/1.1 and HTTP/2) On The Same Listener As gRPC.
grpc-web = ["grpc", "dep:tonic-web"]
sidecar = ["dep:harmos-sidecar", "harmos-sidecar/kit"]
# Supervision selects the original runtime and its native transport explicitly.
sidecar-host = [
  "runtime",
  "dep:harmos-sidecar",
  "harmos-sidecar/transport",
  "dep:getrandom",
  "dep:petgraph",
  "dep:semver",
  "tokio/io-util",
  "tokio/process",
  "tokio/macros",
]
# Portable guest authoring never selects the host runtime or native engine.
guest = ["dep:harmos-guest", "harmos-guest/kit"]
# Native execution exposes metadata without selecting the guest authoring kit.
guest-host = [
  "runtime",
  "dep:harmos-guest",
  "dep:futures-util",
  "dep:getrandom",
  "dep:petgraph",
  "dep:semver",
  "dep:wasmtime",
  "tokio/macros",
]
# The world's build side without its host side. Wrapping a core module into a
# component takes an encoder; running one takes a virtual-memory JIT. A
# packaging tool needs the first and must not be made to link the second, which
# is why this is its own feature rather than part of `guest`.
componentize = ["dep:harmos-guest", "harmos-guest/componentize"]
plugin = [
  "dep:harmos-sidecar",
  "dep:harmos-guest",
  "dep:semver",
  "semver/serde",
  "dep:tar",
  "dep:sha2",
  "dep:tempfile",
]

