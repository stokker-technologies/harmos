# === Package === #

[package]
name = "harmos-ffi"
description = "Prototype C ABI for Harmos native sidecar authoring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# === Package Targets === #

[lib]
crate-type = ["staticlib", "rlib"]

# === Features === #

# === Dependencies === #

[dependencies]
# Local
harmos-domain = { workspace = true }
harmos-sidecar = { workspace = true, features = ["kit", "arrow"] }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging

# Utilities

# Serialization
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true, features = ["ffi"] }
serde_json = { workspace = true, default-features = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["rt", "time", "net"] }

