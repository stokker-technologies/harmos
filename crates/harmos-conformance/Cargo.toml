# === Package === #

[package]
name = "harmos-conformance"
description = "Language-neutral Harmos plugin conformance host and reference plugin."
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# === Package Targets === #

[[bin]]
name = "harmos-conformance-plugin"
path = "src/bin/harmos-conformance-plugin.rs"

# === Features === #

# === Dependencies === #

[dependencies]
# Local
harmos-protocol = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging

# Utilities

# Serialization
prost = { workspace = true, features = ["derive", "std"] }
prost-types = { workspace = true, features = ["std"] }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
futures-core = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

# Networking
tonic = { workspace = true, features = ["codegen", "router", "transport"] }

# Storage

# UI

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

# === Target Dependencies === #

# === Test Targets === #

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# === Bench Targets === #

# === Example Targets === #

# === Workspace Lints === #

# === Lints === #

[lints]
workspace = true

