# === Package ===

[package]
name = "harmos-runtime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

version = { workspace = true }

# === Package Targets ===

[[bin]]
name = "harmos-stream-consumer-fixture"
path = "tests/fixtures/stream_consumer.rs"
required-features = ["plugin-sidecar"]
test = false
bench = false

# === Features ===

# Core Runtime And Authoring Are Always Available
[features]
default = []
plugin = ["dep:petgraph", "dep:semver", "semver/serde", "dep:harmos-packaging"]
plugin-sidecar = [
  "plugin",
  "dep:harmos-sidecar",
  "harmos-sidecar/kit",
  "harmos-sidecar/derive",
  "tokio/io-util",
  "tokio/process",
]
plugin-guest = [
  "plugin",
  "dep:harmos-guest",
  "harmos-guest/kit",
  "harmos-guest/derive",
  "dep:wasmtime",
]
grpc = [
  "harmos-sdk/grpc",
  "bindings-proto",
  "dep:tonic-reflection",
  "dep:http-body",
  "dep:heck",
  "dep:bytes",
  "dep:tonic",
  "dep:prost-reflect",
  "dep:tonic-web",
  "dep:tower",
  "dep:tower-http",
  "tonic/tls-ring",
]
# Protobuf Descriptor Projection For The Runtime Transport.
bindings-proto = ["dep:harmos-packaging", "harmos-packaging/bindings-proto"]
# Hands Out The Signal Kernels; Core Reductions Use Them Regardless.
signal = []
signal-fft = ["signal", "harmos-storage/fft"]
simulation = ["tokio/test-util"]

# === Dependencies ===

[dependencies]
# Local
harmos-sdk = { workspace = true, features = ["streaming"] }
harmos-packaging = { workspace = true, optional = true }
harmos-domain = { workspace = true, features = ["derive"] }
harmos-guest = { workspace = true, optional = true }
harmos-macros = { workspace = true, default-features = true }
harmos-storage = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
bytes = { workspace = true, optional = true }
# Retry Windows Use Native Entropy Or Web Crypto On Browser WebAssembly.
getrandom = { workspace = true, features = ["std", "wasm_js"] }
heck = { workspace = true, optional = true }
petgraph = { workspace = true, default-features = true, optional = true }
semver = { workspace = true, default-features = true, optional = true }
sha2 = { workspace = true, default-features = true }

# Serialization
postcard = { workspace = true }
prost-reflect = { workspace = true, optional = true, features = ["serde"] }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true, features = ["raw_value"] }

# Configuration

# Filesystem
tempfile = { workspace = true, default-features = true }

# Parsing

# Concurrency

# Async
futures-core = { workspace = true, default-features = true }
futures-util = { workspace = true }
tokio = { workspace = true, default-features = true, features = [
  "rt",
  "sync",
  "time",
  "macros",
] }

# Networking
http-body = { workspace = true, optional = true }
tonic = { workspace = true, default-features = true, optional = true }
tonic-reflection = { workspace = true, features = ["server"], optional = true }
tonic-web = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

# Storage

# UI

# Testing

