# === Package === #

[package]
name = "harmos-runtime"
description = "Harmos runtime: managed state, undo, recovery, background work and typed streams."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

version = { workspace = true }

# === Package Targets === #

[[bin]]
name = "harmos-grpc-benchmark-fixture"
path = "tests/fixtures/benchmark_grpc.rs"
required-features = ["benchmark-fixtures"]
test = false
bench = false

# === Features === #

# Core Runtime and Authoring Are Always Available
[features]
default = ["grpc"]
# Benchmark Servers Are Not Inputs to Product or Test Builds.
benchmark-fixtures = ["grpc"]
plugin-guest = ["dep:harmos-guest", "harmos-guest/kit", "harmos-guest/derive", "dep:wasmtime", "dep:postcard"]
grpc = [
  "dep:heck",
  "harmos-operations/grpc",
  "dep:tonic-reflection",
  "dep:http-body",
  "dep:bytes",
  "tonic/tls-ring",
  "dep:rustls",
  "dep:tokio-rustls",
]
simulation = []

# === Dependencies === #

[dependencies]
# Local
harmos-domain = { workspace = true, features = ["derive"] }
harmos-guest = { workspace = true, optional = true }
harmos-sdk-derive = { workspace = true, default-features = true }
harmos-operations = { workspace = true, features = ["lifecycle", "streaming", "grpc"] }
harmos-protocol = { workspace = true }
harmos-storage = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
heck = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# Retry Windows Use Native Entropy Or Web Crypto On Browser WebAssembly.
getrandom = { workspace = true, features = ["std", "wasm_js"] }
semver = { workspace = true, default-features = true, features = ["serde"] }
sha2 = { workspace = true, default-features = true }

# Serialization
postcard = { workspace = true, optional = true }
prost = { workspace = true }
prost-reflect = { workspace = true, features = ["serde"] }
prost-types = { workspace = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true, features = ["raw_value"] }

# Configuration

# Filesystem
tar = { workspace = true }
tempfile = { workspace = true, default-features = true }

# Parsing

# Concurrency

# Async
futures-core = { workspace = true, default-features = true }
futures-util = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["rt", "sync", "time", "macros", "fs", "io-util", "net", "process"] }

# Networking
http-body = { workspace = true, optional = true }
hyper-util = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"], optional = true }
tokio-rustls = { workspace = true, features = ["ring"], optional = true }
tonic = { workspace = true, default-features = true }
tonic-reflection = { workspace = true, features = ["server"], optional = true }
tower = { workspace = true }

# Storage

# UI

# Testing

# === Build Dependencies === #


# === Dev Dependencies === #

[dev-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
# Local
harmos = { workspace = true }
harmos-packaging = { path = "../../tools/packaging", default-features = false, features = ["generate-proto", "guest"] }
harmos-operations = { path = "../harmos-operations", default-features = false, features = ["grpc"] }
schematic-domain = { path = "../../examples/schematic/domain" }
schematic-operations = { path = "../../examples/schematic/operations", features = ["runtime"] }

# Git

# Error Handling

# Logging
tracing-perfetto-file = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
rcgen = { workspace = true, features = ["pem", "ring"] }

# Serialization
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
prost = { workspace = true, features = ["derive"] }

# Configuration

# Filesystem
tar = { workspace = true }
tempfile = { workspace = true, default-features = true }

# Parsing

# Concurrency

# Async
futures-util = { workspace = true, features = ["async-await-macro"] }
tokio = { workspace = true, default-features = true, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "test-util",
  "time",
] }

# Networking
http-body-util = { workspace = true }
tonic-prost = { workspace = true }

# Storage

# UI

# Testing
criterion = { workspace = true, default-features = false }

