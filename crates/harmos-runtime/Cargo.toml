# === Test Targets === #

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

[[test]]
name = "system"
path = "tests/system/main.rs"

# === Bench Targets === #

[[bench]]
name = "integration-runtime"
path = "benches/runtime/main.rs"
harness = false

[[bench]]
name = "integration-operations"
path = "benches/operations/main.rs"
harness = false

[[bench]]
name = "unit-storage-transforms"
path = "benches/storage/main.rs"
harness = false

[[bench]]
name = "integration-streams"
path = "benches/streams/main.rs"
harness = false

[[bench]]
name = "system-guest"
path = "benches/guest/main.rs"
harness = false
required-features = ["plugin-guest"]

[[bench]]
name = "system-grpc"
path = "benches/grpc/main.rs"
harness = false
