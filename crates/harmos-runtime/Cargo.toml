tracing-subscriber = { workspace = true }

# Utilities

# Serialization
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
prost = { workspace = true, features = ["derive"] }

# Configuration

# Filesystem
tar = { workspace = true }
tempfile = { workspace = true, default-features = true }

# Parsing

# Concurrency

# Async
futures-util = { workspace = true, features = ["async-await-macro"] }
tokio = { workspace = true, default-features = true, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "test-util",
  "time",
