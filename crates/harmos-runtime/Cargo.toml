# Testing

# === Test Targets ===

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["grpc"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
required-features = ["grpc"]

[[test]]
name = "system"
path = "tests/system/main.rs"
required-features = ["grpc"]

# === Bench Targets ===

# Both carriers, because the fixture is a sidecar program that co-links a guest
# declaration into its own artifact — the one shape that proves a single binary
# can carry two declarations. Declaring only `sidecar` left it built against a
# `harmos::guest` that the selected features had not opened.
[[bench]]
name = "integration-runtime"
path = "benches/runtime/main.rs"
harness = false
required-features = ["grpc"]

[[bench]]
name = "integration-operations"
path = "benches/operations/main.rs"
harness = false
required-features = ["grpc"]

[[bench]]
name = "integration-storage"
path = "benches/storage/main.rs"
harness = false
required-features = ["grpc"]

[[bench]]
name = "integration-streams"
path = "benches/streams/main.rs"
harness = false
required-features = ["grpc"]

[[bench]]
name = "integration-sidecar"
path = "benches/sidecar/main.rs"
harness = false
required-features = ["plugin-sidecar", "grpc"]

[[bench]]
name = "unit-codecs"
path = "benches/codecs/main.rs"
harness = false
required-features = ["plugin-sidecar", "grpc"]

[[bench]]
name = "system-transport"
path = "benches/transport/main.rs"
harness = false
required-features = ["plugin-sidecar", "grpc"]

[[bench]]
name = "integration-simulation"
path = "benches/simulation/main.rs"
harness = false
required-features = ["simulation", "grpc"]

