# === Package === #

[package]
name = "harmos-packaging"
description = "Harmos packaging: reusable Cargo builds, inert inspection."
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# === Package Targets === #

# === Features === #

[features]
default = []
sidecar = []
generate-proto = ["dep:heck", "dep:prost-reflect"]
generate-python = ["generate-proto"]

# === Dependencies === #

[dependencies]
# Local
harmos-domain = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
heck = { workspace = true, optional = true }
semver = { workspace = true, default-features = true, features = ["serde"] }
sha2 = { workspace = true, default-features = true }

# Serialization
prost-reflect = { workspace = true, optional = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true, features = ["raw_value"] }

# Configuration

# Filesystem
notify = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true, default-features = true }

# Parsing

# Concurrency
process-wrap = { workspace = true, features = ["std", "job-object", "process-group", "creation-flags"] }

# Async

# Networking

# Storage

# UI

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Local
harmos-domain = { path = "../harmos-domain", default-features = false, features = ["derive"] }
harmos-sdk = { path = "../harmos-sdk", default-features = false, features = ["grpc"] }

# Git

# Error Handling

# Logging

# Utilities

# Serialization
# harmos_tools.build locates protoc through this package in cargo metadata.
protoc-bin-vendored = { workspace = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Target Dependencies === #

# === Test Targets === #

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
required-features = ["generate-proto", "generate-python"]

# === Bench Targets === #

# === Example Targets === #

# === Workspace Lints === #

# === Lints === #

[lints]
workspace = true

# === Profiles === #

# === Patches === #

# === Other === #
