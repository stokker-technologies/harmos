# === Package === #

[package]
name = "harmos-operations"
description = "Portable Harmos built-in operations and optional execution."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

version = { workspace = true }

# === Package Targets === #

# === Features === #

[features]
default = ["runtime"]
lifecycle = []
derive = ["harmos-domain/derive"]
grpc = ["dep:prost-reflect", "dep:prost-types"]
streaming = []
runtime = ["lifecycle", "dep:harmos-storage", "grpc", "streaming"]

# === Dependencies === #

[dependencies]
# Local
harmos-protocol = { workspace = true }
harmos-domain = { workspace = true, features = ["derive"] }
harmos-macros = { workspace = true }
harmos-storage = { workspace = true, optional = true }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities

# Serialization
prost = { workspace = true }
prost-reflect = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["sync", "macros", "time"] }

# Networking

# Storage

# UI

# Testing

