# === Package === #

[package]
name = "harmos-operations"
description = "Portable Harmos built-in operations and optional execution."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

version = { workspace = true }

# === Package Targets === #

# === Features === #

[features]
default = []
lifecycle = ["dep:harmos-sdk", "dep:thiserror"]
runtime = ["lifecycle", "dep:tokio", "dep:harmos-storage", "dep:serde", "dep:serde_json", "dep:tracing"]

# === Dependencies === #

[dependencies]
# Local
harmos-domain = { workspace = true, features = ["derive"] }
harmos-macros = { workspace = true }
harmos-sdk = { workspace = true, features = ["streaming"], optional = true }
harmos-storage = { workspace = true, optional = true }

# Git

# Error Handling
thiserror = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }

# Utilities

# Serialization
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["sync", "macros", "time"], optional = true }

# Networking

# Storage

# UI

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Target Dependencies === #

# === Test Targets === #

[[test]]
name = "unit"
path = "tests/unit/main.rs"

# === Bench Targets === #

# === Example Targets === #

# === Workspace Lints === #

# === Lints === #

[lints]
workspace = true

