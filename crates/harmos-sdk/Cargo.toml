# === Package ===

[package]
name = "harmos-sdk"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The authoring attributes, on by default the way serde ships its derives. Every
# trait beneath them is an ordinary public contract, so a crate that turns this
# off writes the implementations by hand and links no proc-macro chain at all.
version = { workspace = true }

# === Package Targets ===

# === Features ===

[features]
default = ["derive"]
derive = ["harmos-domain/derive"]
grpc = ["harmos-domain/grpc"]
streaming = ["dep:tokio"]

# === Dependencies ===

[dependencies]
# Local
harmos-domain = { workspace = true }

# Error Handling
thiserror = { workspace = true, default-features = true }

# Serialization
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
postcard = { workspace = true }

# Async
tokio = { workspace = true, optional = true }

# === Build Dependencies ===

# === Dev Dependencies ===

[dev-dependencies]

# === Target Dependencies ===

# === Test Targets ===

# === Bench Targets ===

# === Example Targets ===

# === Workspace Lints ===

# === Lints ===

[lints]
workspace = true

