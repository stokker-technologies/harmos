# === Package === #

[package]
name = "__PACKAGE_NAME__"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

# === Package Targets === #

# === Features === #

# === Dependencies === #

[dependencies]
# Git
harmos-domain = { git = "https://github.com/stokker-technologies/harmos", rev = "__HARMOS_REVISION__", default-features = false, features = [
  "derive",
] }
harmos-sidecar = { git = "https://github.com/stokker-technologies/harmos", rev = "__HARMOS_REVISION__", default-features = false, features = [
  "derive",
  "kit",
] }

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


