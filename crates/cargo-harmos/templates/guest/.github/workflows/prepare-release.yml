name: Prepare Release
"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        required: true
        type: string
permissions:
  contents: write
env:
  MISE_LOCKED: "1"
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_TERM_COLOR: always
jobs:
  release_prepare:
    name: Release / Prepare
    runs-on:
    - ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
