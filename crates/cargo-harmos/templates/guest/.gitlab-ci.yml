  before_script:
  - mise trust --yes
  - mise install --yes
variables:
  GIT_DEPTH: "0"
  MISE_YES: "1"
  MISE_LOCKED: "1"
  CARGO_INCREMENTAL: "0"
  MISE_DATA_DIR: $CI_PROJECT_DIR/.cache/mise
  CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
  npm_config_store_dir: $CI_PROJECT_DIR/.cache/pnpm
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
    when: never
  - if: $CI_COMMIT_BRANCH
  - if: $CI_COMMIT_TAG =~ /^v[0-9]/
Check / Source:
  stage: Check
  tags: []
  timeout: 10 minutes
  needs: []
  script:
  - mise run format:python --check
  - mise run format:rust --check
  - mise run format:toml --check
  - mise run lint:python
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: >-
      $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~
      /^(dev|main|release\/v.*)$/
  - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  cache:
  - key:
      prefix: linux-tools
      files:
      - mise.lock
    paths:
    - .cache/mise/
    policy: pull-push
  - key:
      prefix: linux-cargo
      files:
      - Cargo.lock
    paths:
    - .cache/cargo/registry/
    - .cache/cargo/git/
    policy: pull
  variables:
    MISE_ENABLE_TOOLS: python,rust,uv,taplo
