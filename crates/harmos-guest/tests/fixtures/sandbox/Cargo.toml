# === Workspace === #

# A Fixture Outside The Root Workspace, Built Once For wasm32-unknown-unknown
[workspace]

# === Workspace Package === #

# === Workspace Dependencies === #

# === Package === #

[package]
name = "harmos-sandbox-guest"
description = "The guest the host harness drives through every sandbox behaviour"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
version = "0.1.10"
publish = false

# === Package Targets === #

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# === Features === #

[features]
default = ["runtime"]
runtime = []

# === Dependencies === #

[dependencies]
# Local
harmos-domain = { path = "../../../../harmos-domain", default-features = false, features = ["derive"] }
harmos-guest = { path = "../../..", default-features = false, features = ["derive", "kit"] }

