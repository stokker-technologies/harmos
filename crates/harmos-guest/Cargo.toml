# === Package ===

[package]
name = "harmos-guest"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version = { workspace = true }

# === Package Targets ===

[[bin]]
name = "harmos-component-fixture"
path = "tests/fixtures/componentizer.rs"
required-features = ["test-component"]
test = false
bench = false

# === Features ===

[features]
default = ["derive"]
derive = ["harmos-domain/derive"]
# Optional Payload Codec Only; No Host Networking Or gRPC Carrier
grpc = ["harmos-domain/grpc"]
# Stream Traffic Wakes An Original Operation Waiting On A Rust Channel.
streaming = ["harmos-domain/streaming", "wit-bindgen?/inter-task-wakeup"]
# The generated world bindings and the wrappers over them — everything a guest
# author writes against. Optional because the other half of this crate is not
# authoring at all: `Declaration::inspect` reads an already-built component's
# custom sections, and a native host that only does that has no world to bind.
kit = ["dep:wit-bindgen"]
componentize = ["dep:wit-component"]
test-component = ["componentize", "kit"]

# === Dependencies ===

[dependencies]
# Local
harmos-domain = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
semver = { workspace = true, default-features = true }

# Serialization
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
wit-bindgen = { workspace = true, default-features = true, features = [
  "async-spawn",
], optional = true }

