# === Example Targets ===

[[example]]
name = "test-component"
path = "examples/test_component.rs"
crate-type = ["cdylib"]
required-features = ["test-component"]

# The routed guest the host harness drives. A second binary rather than a mode
# of the routeless one, so that "a guest serving routes presents the same world
# as one serving none" is a claim about two components.
[[example]]
name = "route-component"
path = "examples/route_component.rs"
crate-type = ["cdylib"]
required-features = ["test-component"]

[[example]]
name = "catalog-component"
path = "examples/catalog_component.rs"
crate-type = ["cdylib"]
required-features = ["componentize", "kit"]

[[example]]
name = "operation-component"
path = "examples/operation_component.rs"
crate-type = ["cdylib"]
required-features = ["componentize", "kit", "streaming"]

[[example]]
name = "plugin-component"
path = "examples/plugin_component.rs"
crate-type = ["cdylib"]
required-features = ["componentize", "kit"]

