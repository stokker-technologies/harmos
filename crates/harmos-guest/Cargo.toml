# === Package === #

[package]
name = "harmos-guest"
description = "Harmos guest kit for WebAssembly component plugins."
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version = { workspace = true }

# === Package Targets === #

# === Features === #

[features]
default = ["derive"]
derive = ["harmos-domain/derive"]
# Provider Protobuf Decoding For Contracts That Bind A gRPC Method; No Host Networking.
grpc = ["harmos-sdk/grpc"]
# Stream Endpoints Add Rust Channel Traffic.
streaming = ["harmos-sdk/streaming"]
# The generated world bindings and the wrappers over them — everything a guest
# author writes against. Optional because the other half of this crate is not
# authoring at all: `Declaration::inspect` reads an already-built component's
# custom sections, and a native host that only does that has no world to bind.
# Any Authored Async Lifecycle Or Operation May Wait On Rust-Originating Events.
kit = ["harmos-operations/lifecycle", "dep:wit-bindgen", "wit-bindgen/inter-task-wakeup"]

# === Dependencies === #

[dependencies]
# Local
harmos-operations = { workspace = true }
harmos-domain = { workspace = true }
harmos-sdk = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities

# Serialization
wit-bindgen = { workspace = true, default-features = true, features = ["async-spawn"], optional = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

