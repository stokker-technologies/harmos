# === Package ===

[package]
name = "harmos-guest"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version = { workspace = true }

# === Package Targets ===

# === Features ===

[features]
default = ["derive"]
derive = ["harmos-domain/derive"]
# Stream Endpoints Add Rust Channel Traffic.
streaming = ["harmos-sdk/streaming"]
# The generated world bindings and the wrappers over them — everything a guest
# author writes against. Optional because the other half of this crate is not
# authoring at all: `Declaration::inspect` reads an already-built component's
# custom sections, and a native host that only does that has no world to bind.
# Any Authored Async Lifecycle Or Operation May Wait On Rust-Originating Events.
kit = ["dep:wit-bindgen", "wit-bindgen/inter-task-wakeup"]

# === Dependencies ===

[dependencies]
# Local
harmos-sdk = { workspace = true }
harmos-domain = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
semver = { workspace = true, default-features = true }

# Serialization
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
wit-bindgen = { workspace = true, default-features = true, features = [
  "async-spawn",
], optional = true }

