schematic-operations = { path = "../../examples/schematic/operations", default-features = false }

# Git

# Error Handling

# Logging
tracing-perfetto-file = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
wasmtime = { workspace = true }
wit-component = { workspace = true, default-features = true }

# Serialization
serde_json = { workspace = true, default-features = true }

