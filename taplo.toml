# Maintained TOML Formatting
include = [
  "*.toml",
  ".config/**/*.toml",
  "crates/**/*.toml",
  "tools/**/*.toml",
  "plugins/**/*.toml",
  "examples/**/*.toml",
  "tests/**/*.toml",
  "mise/**/*.toml",
]
exclude = [
  "target/**",
  "dist/**",
  "node_modules/**",
  ".venv/**",
  "vendor/**",
  "Cargo.lock",
  "crates/cargo-dokime/templates/**",
  "crates/harmos-macros/tests/fixtures/metadata/manifest.toml",
]

[formatting]
align_entries = false
array_auto_collapse = false
array_auto_expand = true
column_width = 100
indent_string = "  "
reorder_keys = false
