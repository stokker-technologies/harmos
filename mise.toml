# === Settings === #

[settings]
lockfile = true
github_attestations = false

# === Tools === #

[tools]
# Languages And Runtimes
python = "3.15.0"
rust = { version = "1.99.0", components = "clippy,rustfmt,llvm-tools-preview", profile = "minimal", targets = "wasm32-unknown-unknown,wasm32-wasip2" }

# Package Managers
uv = "0.13.0"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
sccache = "0.18.0"

# Formatting And Linting
"aqua:rhysd/actionlint" = "1.7.12"
taplo = "0.10.0"

# Release And Signing
gh = "2.102.0"
git-cliff = "2.14.2"
glab = "1.123.0"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# Product Tools
"aqua:cargo-bins/cargo-binstall" = "1.26.0"

# === Environment === #

[env]
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"

# === Variables === #

[vars]

# === Prepare === #

[tasks."prepare:tools"]
description = "Prepare Locked Repository Tools"
run = ["uv sync --locked --project tools/python --all-groups"]

# === Format === #

[tasks.format]
description = "Format Every Language"
usage = 'flag "--check"'
depends = [
  "format:rust{% if usage.check %} --check{% endif %}",
  "format:python{% if usage.check %} --check{% endif %}",
  "format:toml{% if usage.check %} --check{% endif %}",
]

[tasks."format:python"]
description = "Format Python"
usage = 'flag "--check"'
run = "uv run --locked --project tools/python ruff format tools/python crates/harmos-packaging{% if usage.check %} --check{% endif %}"

[tasks."format:rust"]
description = "Format Rust"
usage = 'flag "--check"'
run = [
  "cargo fmt --all{% if usage.check %} --check{% endif %}",
  "cargo fmt --manifest-path examples/schematic/Cargo.toml --all{% if usage.check %} --check{% endif %}",
  "cargo fmt --manifest-path crates/harmos-guest/tests/fixtures/sandbox/Cargo.toml{% if usage.check %} --check{% endif %}",
]

[tasks."format:toml"]
description = "Format TOML"
usage = 'flag "--check"'
run = "uv run --locked --project tools/python python -m harmos_tools.format.toml{% if usage.check %} --check{% endif %}"

# === Lint === #

[tasks.lint]
description = "Lint Every Language"
depends = ["lint:rust", "lint:python"]

[tasks."lint:python"]
description = "Lint Python"
run = [
  "uv run --locked --project tools/python ruff check tools/python crates/harmos-packaging",
  "uv run --locked --project tools/python ty check --project tools/python tools/python",
]

[tasks."lint:rust"]
description = "Lint Rust"
run = [
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo clippy --locked --manifest-path examples/schematic/Cargo.toml --workspace --all-targets -- -D warnings",
]

# === Check === #

[tasks.check]
description = "Check Every Language And Workflows"
depends = ["check:rust"]
run = "actionlint"

[tasks."check:rust"]
description = "Check Rust"
run = [
  "cargo check --locked --workspace --all-targets --all-features",
  "cargo check --locked --workspace --all-targets --no-default-features",
  "cargo check --locked -p harmos-domain --target wasm32-unknown-unknown",
  "cargo check --locked -p harmos-domain --target wasm32-wasip2",
  "cargo check --locked --manifest-path examples/schematic/Cargo.toml -p schematic-domain --target wasm32-unknown-unknown",
  "cargo check --locked --manifest-path examples/schematic/Cargo.toml -p schematic-guest --target wasm32-unknown-unknown",
]

# === Build === #

[tasks.build]
description = "Build Packageable Products"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.fixtures --product --profile {{usage.profile}}"
env = { CARGO_INCREMENTAL = "0" }

[tasks."build:bench"]
description = "Build Benchmark Executables"
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.bench -- --all-features"
env = { CARGO_INCREMENTAL = "0" }

[tasks."build:tests"]
description = "Build The Shared Test Archive And Fixtures"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.fixtures --profile {{usage.profile}}"
env = { CARGO_INCREMENTAL = "0" }

# === Dev === #

# === Test === #

[tasks.test]
description = "Test Every Layer"
usage = 'flag "--profile <profile>" default="dev"'
depends = [
  "test:unit --profile {{usage.profile}}",
  "test:integration --profile {{usage.profile}}",
  "test:acceptance --profile {{usage.profile}}",
  "test:system --profile {{usage.profile}}",
  "test:generated --profile {{usage.profile}}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:unit"]
description = "Test Unit Layer"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["test:unit:rust --profile {{usage.profile}}"]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:unit:rust"]
description = "Test Unit Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category unit --language rust --profile {{usage.profile}}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:integration"]
description = "Test Integration Layer"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["test:integration:rust --profile {{usage.profile}}"]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:integration:rust"]
description = "Test Integration Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category integration --language rust --profile {{usage.profile}}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:acceptance"]
description = "Test Acceptance Layer"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["test:acceptance:rust --profile {{usage.profile}}"]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:acceptance:rust"]
description = "Test Acceptance Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category acceptance --language rust --profile {{usage.profile}}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:coverage"]
description = "Measure Coverage Over Instrumented Lanes"
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run coverage --language rust"
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:system"]
description = "Test System Layer"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["test:system:rust --profile {{usage.profile}}"]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:system:rust"]
description = "Test System Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category system --language rust --profile {{usage.profile}}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:generated"]
description = "Test Generated Clients"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["test:generated:python"]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:generated:python"]
description = "Test Generated Python"
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python ty check target/generated/python/src",
  "uv run --locked --no-sync --project tools/python ruff check --config tools/python/ruff.toml --extend-exclude _wire target/generated/python/src",
  "uv run --locked --no-sync --project tools/python python -c \"import sys, pkgutil, importlib; sys.path.insert(0, 'target/generated/python/src'); [importlib.import_module(m.name) for m in pkgutil.walk_packages(['target/generated/python/src'])]\"",
]
env = { CARGO_INCREMENTAL = "0" }

# === Bench === #

[tasks.bench]
description = "Bench Every Layer"
usage = 'flag "--refresh-baseline"'
depends = [
  "bench:unit {% if usage.refresh_baseline %}--refresh-baseline{% endif %}",
  "bench:integration {% if usage.refresh_baseline %}--refresh-baseline{% endif %}",
  "bench:system {% if usage.refresh_baseline %}--refresh-baseline{% endif %}",
]

[tasks."bench:unit"]
description = "Bench Unit Layer"
usage = 'flag "--refresh-baseline"'
depends = ["bench:unit:rust{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"]

[tasks."bench:unit:rust"]
description = "Bench Unit Rust"
usage = 'flag "--refresh-baseline"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category unit --language rust --archive-argument=--all-features{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

[tasks."bench:integration"]
description = "Bench Integration Layer"
usage = 'flag "--refresh-baseline"'
depends = ["bench:integration:rust{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"]

[tasks."bench:integration:rust"]
description = "Bench Integration Rust"
usage = 'flag "--refresh-baseline"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category integration --language rust --archive-argument=--all-features{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

[tasks."bench:system"]
description = "Bench System Layer"
usage = 'flag "--refresh-baseline"'
depends = ["bench:system:rust{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"]

[tasks."bench:system:rust"]
description = "Bench System Rust"
usage = 'flag "--refresh-baseline"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category system --language rust --archive-argument=--all-features{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

# === Docs === #

# === Package === #

[tasks.package]
description = "Package Rust Artifacts"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["package:rust --profile {{usage.profile}}"]

[tasks."package:rust"]
description = "Package Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.package.rust --profile {{usage.profile}}"

# === CI === #

[tasks.ci]
description = "Run The CI Flow Locally"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "format --check" },
  { task = "build --profile {{usage.profile}}" },
  { task = "build:tests --profile {{usage.profile}}" },
  { task = "check" },
  { task = "lint" },
  { task = "test --profile {{usage.profile}}" },
  { task = "package --profile {{usage.profile}}" },
  { task = "release:publish:dry" },
]

[tasks."ci:nightly"]
description = "Run The Nightly Coverage And Bench Flow"
run = [
  { task = "build" },
  { task = "build:tests" },
  { task = "test:coverage" },
  { task = "build:bench" },
  { task = "bench:unit --refresh-baseline" },
  { task = "bench:integration --refresh-baseline" },
  { task = "bench:system --refresh-baseline" },
]

# === Release === #

[tasks.release]
description = "Prepare And Validate A Release Branch"
run = [{ task = "release:prepare" }, { task = "ci" }]

[tasks."release:prepare"]
description = "Prepare The Release Branch"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run prepare"

[tasks."release:publish"]
description = "Publish A Tagged Release"
run = [{ task = "release:publish:rust" }, { task = "release:publish:assets" }]

[tasks."release:publish:assets"]
description = "Publish Verified Release Assets"
run = [
  "uv run --locked --project tools/python python -m harmos_tools.release.run publish",
  "uv run --locked --project tools/python python -m harmos_tools.release.run finalize",
]

[tasks."release:publish:dry"]
description = "Verify Rust Registry Publication"
run = "uv run --locked --project tools/python python -m harmos_tools.test.publish --rust"

[tasks."release:publish:rust"]
description = "Publish Rust Crates"
run = "cargo publish --workspace --locked"

[tasks."release:stage"]
description = "Stage Native Release Assets"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run stage"

[tasks."release:verify"]
description = "Verify Published Release Assets And Opted-In Installers"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run verify"

# === Housekeeping === #

[tasks.housekeeping]
description = "Inspect Repository Housekeeping"
run = "stkr project housekeeping preview"

[tasks."housekeeping:stats"]
description = "Report Project Statistics"
run = "scc --include-ext rs,py --avg-wage 100000 --cocomo-project-type semi-detached"
