# === Settings === #

[settings]
lockfile = true
github_attestations = false

# === Tools === #

[tools]
# Languages And Runtimes
python = "3.15.0"
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt,llvm-tools-preview,rust-analyzer", targets = ["wasm32-unknown-unknown", "wasm32-wasip2"] }

# Package Managers
uv = "0.13.0"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"cargo:cargo-llvm-cov" = "0.9.1"
sccache = "0.18.0"

# Formatting And Linting
"aqua:rhysd/actionlint" = "1.7.7"
taplo = "0.10.0"

# Release And Signing
git-cliff = "2.14.2"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
TMPDIR = "{{config_root}}/target/tmp"

# === Variables === #

[vars]

# === Prepare === #

[tasks."prepare:tools"]
description = "Prepare Locked Repository Tools"
run = [
  "python -c \"from pathlib import Path; Path('target/tmp').mkdir(parents=True, exist_ok=True)\"",
  "uv sync --locked --project tools/python --all-groups",
]

# === Format === #

[tasks.format]
description = "Format Every Language"
usage = 'flag "--check"'
depends = ["format:rust{% if usage.check %} --check{% endif %}", "format:python{% if usage.check %} --check{% endif %}", "format:toml{% if usage.check %} --check{% endif %}"]

[tasks."format:python"]
description = "Format Python"
usage = 'flag "--check"'
run = "uv run --locked --project tools/python ruff format tools/python crates/harmos-packaging{% if usage.check %} --check{% endif %}"

[tasks."format:rust"]
description = "Format Rust"
usage = 'flag "--check"'
run = [
  "cargo fmt --all{% if usage.check %} --check{% endif %}",
  "cargo fmt --manifest-path examples/schematic/Cargo.toml --all{% if usage.check %} --check{% endif %}",
  "cargo fmt --manifest-path crates/harmos-guest/tests/fixtures/sandbox/Cargo.toml{% if usage.check %} --check{% endif %}",
]

[tasks."format:toml"]
description = "Format TOML"
usage = 'flag "--check"'
run = "uv run --locked --project tools/python python -m harmos_tools.format.toml{% if usage.check %} --check{% endif %}"

# === Lint === #

[tasks.lint]
description = "Lint Every Language"
depends = ["lint:rust", "lint:python"]

[tasks."lint:python"]
description = "Lint Python"
run = "uv run --locked --project tools/python ruff check tools/python crates/harmos-packaging"

[tasks."lint:rust"]
description = "Lint Rust"
run = [
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo clippy --locked --manifest-path examples/schematic/Cargo.toml --workspace --all-targets -- -D warnings",
]

# === Check === #

[tasks.check]
description = "Check Every Language And Workflows"
depends = ["check:rust", "check:python"]
run = "actionlint"

[tasks."check:python"]
description = "Check Python"
run = "uv run --locked --project tools/python ty check --project tools/python tools/python"

[tasks."check:rust"]
description = "Check Rust"
run = [
  "cargo check --locked --workspace --all-targets --all-features",
  "cargo check --locked --workspace --all-targets --no-default-features",
  "cargo check --locked -p harmos-domain --target wasm32-unknown-unknown",
  "cargo check --locked -p harmos-domain --target wasm32-wasip2",
  "cargo check --locked --manifest-path examples/schematic/Cargo.toml -p schematic-domain --target wasm32-unknown-unknown",
  "cargo check --locked --manifest-path examples/schematic/Cargo.toml -p schematic-guest --target wasm32-unknown-unknown",
]

# === Build === #

[tasks.build]
description = "Build Binaries, Fixtures And The Test Archive"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.fixtures --profile {{usage.profile}}"

# === Dev === #

# === Test === #

[tasks.test]
description = "Test Every Layer"
depends = ["test:unit", "test:integration", "test:acceptance", "test:system"]

[tasks."test:unit"]
description = "Test Unit Layer"
depends = ["test:unit:rust"]

[tasks."test:unit:rust"]
description = "Test Unit Rust"
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category unit --language rust",
]

[tasks."test:integration"]
description = "Test Integration Layer"
depends = ["test:integration:rust"]

[tasks."test:integration:rust"]
description = "Test Integration Rust"
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category integration --language rust",
]

[tasks."test:acceptance"]
description = "Test Acceptance Layer"
depends = ["test:acceptance:rust"]

[tasks."test:acceptance:rust"]
description = "Test Acceptance Rust"
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category acceptance --language rust",
]

[tasks."test:system"]
description = "Test System Layer"
depends = ["test:system:rust"]

[tasks."test:system:rust"]
description = "Test System Rust"
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category system --language rust",
]

[tasks."test:verify"]
description = "Verify Complete Candidate Evidence"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run verify"

[tasks.coverage]
description = "Measure Instrumented Rust Coverage"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run coverage --language rust"

# === Bench === #

[tasks.bench]
description = "Bench Every Layer"
depends = ["bench:unit", "bench:integration", "bench:system"]

[tasks."bench:unit"]
description = "Bench Unit Layer"
depends = ["bench:unit:rust"]

[tasks."bench:unit:rust"]
description = "Bench Unit Rust"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category unit --language rust"

[tasks."bench:integration"]
description = "Bench Integration Layer"
depends = ["bench:integration:rust"]

[tasks."bench:integration:rust"]
description = "Bench Integration Rust"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category integration --language rust"

[tasks."bench:system"]
description = "Bench System Layer"
depends = ["bench:system:rust"]

[tasks."bench:system:rust"]
description = "Bench System Rust"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category system --language rust"

# === Package === #

[tasks.package]
description = "Package Rust Artifacts"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["package:rust --profile {{usage.profile}}"]

[tasks."package:rust"]
description = "Package Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.package.rust --profile {{usage.profile}}"

# === CI === #

[tasks.ci]
description = "Run The CI Flow Locally"
run = [
  { task = "format --check" },
  { task = "lint" },
  { task = "check" },
  { task = "build" },
  { task = "test:unit" },
  { task = "test:integration" },
  { task = "test:acceptance" },
  { task = "test:system" },
  { task = "package" },
  { task = "test:verify" },
]

[tasks."ci:nightly"]
description = "Run Nightly Coverage And Benchmarks"
run = [{ task = "build" }, { task = "coverage" }, { task = "bench:unit" }, { task = "bench:integration" }, { task = "bench:system" }]

# === Release === #

[tasks.release]
description = "Prepare And Validate A Release"
run = [{ task = "release:prepare" }, { task = "ci" }, { task = "package --profile release" }]

[tasks."release:prepare"]
description = "Prepare The Release Branch"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run prepare"

[tasks."release:publish"]
description = "Publish A Tagged Release"
run = [{ task = "release:publish:rust" }]

[tasks."release:publish:dry"]
description = "Verify Rust Registry Publication"
run = "cargo publish --workspace --locked --dry-run"

[tasks."release:publish:rust"]
description = "Publish Rust Crates"
run = "cargo publish --workspace --locked"

# === Housekeeping === #

[tasks.housekeeping]
description = "Inspect Repository Housekeeping"
run = "stkr project housekeeping preview"

[tasks."housekeeping:stats"]
description = "Report Project Statistics"
run = "scc --include-ext rs,py --avg-wage 100000 --cocomo-project-type semi-detached"
