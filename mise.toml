# === Settings === #

[settings]
lockfile = true
github_attestations = false

# === Tools === #

[tools]
# Languages And Runtimes
go = "1.27.3"
node = "26.12.1"
python = "3.15.2"
rust = { version = "1.99.1", components = "clippy,rustfmt,llvm-tools", profile = "minimal", targets = "wasm32-unknown-unknown,wasm32-wasip2" }

# Package Managers
uv = "0.13.6"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.150"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
sccache = "0.19.0"

# Formatting And Linting
"aqua:koalaman/shellcheck" = "0.11.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "v1.7.13-0.20260417151945-fd33e9f582a0"
"npm:@fission-ai/openspec" = "1.15.0"
taplo = "0.10.0"

# Release And Signing
gh = "2.103.3"
git-cliff = "2.14.2"
glab = "1.125.0"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]

# === Variables === #

[vars]

# === Prepare === #

[tasks."prepare:tests:fixtures"]
description = "Join Independently Built Product And Test Fixtures"
usage = '''
flag "--profile <profile>" default="dev"
flag "--focused-messages <path>"
flag "--libraries <names>"
flag "--inspection-messages <paths>"
flag "--inspections <names>"
'''
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.prepare.tests.fixtures --profile {{usage.profile}}{% if usage.focused_messages %} --focused-messages {{usage.focused_messages}} --libraries {{usage.libraries}}{% endif %}{% if usage.inspection_messages %} --inspection-messages {{usage.inspection_messages}} --inspections {{usage.inspections}}{% endif %}"

[tasks."prepare:tools"]
description = "Prepare Locked Repository Tools"
run = ["uv sync --locked --project tools/python --all-groups"]

# === Format === #

[tasks.format]
description = "Format Every Language"
usage = 'flag "--check"'
depends = [
  "format:rust{% if usage.check %} --check{% endif %}",
  "format:python{% if usage.check %} --check{% endif %}",
  "format:toml{% if usage.check %} --check{% endif %}",
]

[tasks."format:python"]
description = "Format Python"
usage = 'flag "--check"'
run = "uv run --locked --project tools/python ruff format tools/python crates/harmos-packaging{% if usage.check %} --check{% endif %}"

[tasks."format:rust"]
description = "Format Rust"
usage = 'flag "--check"'
run = [
  "cargo fmt --all{% if usage.check %} --check{% endif %}",
  "cargo fmt --manifest-path examples/schematic/Cargo.toml --all{% if usage.check %} --check{% endif %}",
  "cargo fmt --manifest-path crates/harmos-guest/tests/fixtures/sandbox/Cargo.toml{% if usage.check %} --check{% endif %}",
]

[tasks."format:toml"]
description = "Format TOML"
usage = 'flag "--check"'
run = "uv run --locked --project tools/python python -m harmos_tools.format.toml{% if usage.check %} --check{% endif %}"

# === Lint === #

[tasks.lint]
description = "Lint Every Language"
depends = ["lint:python", "lint:rust"]

[tasks."lint:python"]
description = "Lint Python"
run = [
  "uv run --locked --project tools/python ruff check tools/python crates/harmos-packaging",
  "uv run --locked --project tools/python ty check --project tools/python tools/python",
]

[tasks."lint:rust"]
description = "Lint Rust Over Every Product And Tests Selection"
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --workspace --profile dev",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --workspace --tests --profile test",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile dev --manifest-path examples/schematic/Cargo.toml -p schematic-cli -p schematic-sidecar",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile dev --manifest-path examples/schematic/Cargo.toml -p schematic-guest --target wasm32-unknown-unknown",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --manifest-path crates/harmos-guest/tests/fixtures/sandbox/Cargo.toml -p harmos-sandbox-guest --target wasm32-unknown-unknown",
]

# === Check === #

[tasks.check]
description = "Check Every Language And Workflows"
run = [{ task = "check:repository" }, { task = "check:rust" }, { task = "check:python" }]

[tasks."check:python"]
description = "Check Python"
run = [{ task = "format:python --check" }, { task = "lint:python" }]

[tasks."check:python:generated"]
description = "Check Generated Python"
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python ty check target/generated/python/src",
  "uv run --locked --no-sync --project tools/python ruff check --config tools/python/ruff.toml --extend-exclude _wire target/generated/python/src",
  "uv run --locked --no-sync --project tools/python python -c \"import sys, pkgutil, importlib; sys.path.insert(0, 'target/generated/python/src'); [importlib.import_module(m.name) for m in pkgutil.walk_packages(['target/generated/python/src'])]\"",
]

[tasks."check:repository"]
description = "Check Repository Configuration And Conventions"
run = [
  { task = "format:toml --check" },
  "uv run --locked --project tools/python python -m harmos_tools.ci.mise",
  "shellcheck --version",
  "actionlint",
]

[tasks."check:rust"]
description = "Check Rust"
run = [{ task = "format:rust --check" }, { task = "lint:rust" }, "cargo-machete --skip-target-dir"]

# === Build === #

[tasks.build]
description = "Build Packageable Products"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = ["uv run --locked --no-sync --project tools/python python -m harmos_tools.build --profile {{usage.profile}}"]

[tasks."build:rust:bench"]
description = "Build Benchmark Executables"
usage = 'flag "--extended"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.benchmark_fixtures{% if usage.extended %} -- --all-features{% endif %}"

[tasks."build:rust:compatibility"]
description = "Check Optional Local Compatibility Configurations"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test -p harmos-domain --target wasm32-unknown-unknown",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test -p harmos-domain --target wasm32-wasip2",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --manifest-path examples/schematic/Cargo.toml -p schematic-domain --target wasm32-unknown-unknown",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --workspace --all-targets --no-default-features",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --workspace --examples --benches --all-features",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --manifest-path examples/schematic/Cargo.toml --workspace --all-targets",
]

[tasks."build:rust:focused"]
description = "Compile And Run A Focused Rust Selection"
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo focused"

[tasks."build:rust:tests"]
description = "Build The Shared Test Archive And Fixtures"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = ["uv run --locked --no-sync --project tools/python python -m harmos_tools.build.rust.tests --profile {{usage.profile}}"]

# === Dev === #

# === Test === #

[tasks.test]
description = "Test Every Layer"
usage = 'flag "--profile <profile>" default="dev"'

depends = ["test:rust --profile {{usage.profile}}"]

[tasks."test:rust"]
description = "Test Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = [
  "test:rust:unit --profile {{usage.profile}}",
  "test:rust:integration --profile {{usage.profile}}",
  "test:rust:acceptance --profile {{usage.profile}}",
  "test:rust:system --profile {{usage.profile}}",
]

[tasks."test:rust:extended"]
description = "Build And Test Optional Local Feature And Target Configurations"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "build --profile {{usage.profile}}" },
  { task = "build:rust:compatibility --profile {{usage.profile}}" },
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.rust.tests --extended --profile {{usage.profile}}",
  { task = "prepare:tests:fixtures --profile {{usage.profile}}" },
  { task = "test --profile {{usage.profile}}" },
]

[tasks."test:rust:unit"]
description = "Test Unit Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category unit --language rust --profile {{usage.profile}}",
]

[tasks."test:rust:integration"]
description = "Test Integration Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --category integration --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category integration --language rust --profile {{usage.profile}}",
]

[tasks."test:rust:acceptance"]
description = "Test Acceptance Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --category acceptance --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category acceptance --language rust --profile {{usage.profile}} -- -E \"!test(/^authoring::/)\"",
]

[tasks."test:rust:coverage"]
description = "Measure Coverage Over Instrumented Lanes"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run coverage --language rust --profile {{usage.profile}}"

[tasks."test:rust:starter"]
description = "Prove Standalone Starter Compiler Contracts In Nightly Validation"
usage = 'flag "--profile <profile>" default="release"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --category acceptance --starter --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category acceptance --language rust --profile {{usage.profile}} -- -E \"test(/^authoring::/)\"",
]

[tasks."test:rust:system"]
description = "Test System Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --category system --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category system --language rust --profile {{usage.profile}} -- --test-threads 1",
]

# === Bench === #

[tasks.bench]
description = "Bench Every Layer"
usage = '''
flag "--refresh-baseline"
flag "--extended"
'''
depends = [
  "bench:rust:unit{% if usage.extended %} --extended{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}",
  "bench:rust:integration{% if usage.extended %} --extended{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}",
  "bench:rust:system{% if usage.extended %} --extended{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}",
]

[tasks."bench:rust:extended"]
description = "Build And Run Optional Local Feature Benchmarks"
usage = 'flag "--refresh-baseline"'
run = [{ task = "build:rust:bench --extended" }, { task = "bench --extended{% if usage.refresh_baseline %} --refresh-baseline{% endif %}" }]

[tasks."bench:rust:unit"]
description = "Bench Unit Rust"
usage = '''
flag "--refresh-baseline"
flag "--extended"
'''
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category unit --language rust --archive-argument=--features --archive-argument=harmos-runtime/plugin-sidecar,harmos-runtime/plugin-guest,harmos-runtime/grpc{% if usage.extended %} --archive-argument=--all-features{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

[tasks."bench:rust:integration"]
description = "Bench Integration Rust"
usage = '''
flag "--refresh-baseline"
flag "--extended"
'''
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category integration --language rust --archive-argument=--features --archive-argument=harmos-runtime/plugin-sidecar,harmos-runtime/plugin-guest,harmos-runtime/grpc{% if usage.extended %} --archive-argument=--all-features{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

[tasks."bench:rust:system"]
description = "Bench System Rust"
usage = '''
flag "--refresh-baseline"
flag "--extended"
'''
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category system --language rust --archive-argument=--features --archive-argument=harmos-runtime/plugin-sidecar,harmos-runtime/plugin-guest,harmos-runtime/grpc{% if usage.extended %} --archive-argument=--all-features{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

# === Docs === #

# === Package === #

[tasks.package]
description = "Package Rust Artifacts"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["package:rust --profile {{usage.profile}}"]

[tasks."package:rust"]
description = "Package Rust"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:tools"]
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.package.rust --profile {{usage.profile}}"

# === CI === #

[tasks."ci:simulate"]
description = "Simulate The Declared CI Graph Locally"
usage = '''
flag "--pipeline <kind>" default=pr
flag "--platform <platform>"
flag "--executor <executor>"
'''
run = "uv run --locked --project tools/python python -m harmos_tools.ci.simulate {% if usage.pipeline %}--pipeline {{usage.pipeline}}{% endif %} {% if usage.platform %}--platform {{usage.platform}}{% endif %} {% if usage.executor %}--executor {{usage.executor}}{% endif %}"

# === Release === #

[tasks."release:prepare"]
description = "Prepare The Release Branch"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run prepare"

[tasks."release:publish"]
description = "Publish A Tagged Release"
run = [{ task = "release:publish:assets" }, { task = "release:publish:finalize" }]

[tasks."release:publish:assets"]
description = "Draft The Release With Its Signed Assets"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run publish"

[tasks."release:publish:dry"]
description = "Dry-Run Every Publication"
run = [
  "uv run --locked --project tools/python python -m harmos_tools.release.version check",
  "uv run --locked --project tools/python python -m harmos_tools.release.run dry",
  "uv run --locked --project tools/python python -m harmos_tools.release.run crates-dry",
]

[tasks."release:publish:finalize"]
description = "Publish The Drafted Release"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run finalize"

[tasks."release:publish:rust"]
description = "Publish Rust Crates"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run crates"

[tasks."release:rehearse"]
description = "Rehearse The Publication Chain On A Disposable Draft"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run rehearse"

[tasks."release:tag"]
description = "Tag A Merged Release Review And Fast-Forward Main"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run tag"

[tasks."release:verify"]
description = "Verify Published Release Assets And Opted-In Installers"
run = "uv run --locked --project tools/python python -m harmos_tools.release.run verify"

# === Clean === #

# === Housekeeping === #

[tasks.housekeeping]
description = "Inspect Repository Housekeeping"
run = "uv run --locked --project tools/python python -m harmos_tools.stkr project housekeeping preview"

[tasks."housekeeping:stats"]
description = "Report Project Statistics"
run = "scc --include-ext rs,py --avg-wage 100000 --cocomo-project-type semi-detached"
