# === Settings === #

[settings]
lockfile = true

# === Tools === #

[tools]
# Languages and Runtimes
cmake = "4.1.2"
dotnet = "10.0.403"
go = "1.27.3"
node = "26.12.1"
python = "3.15.2"
rust = { version = "1.99.1", profile = "minimal" }

# Package Managers
uv = "0.13.6"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.150"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
sccache = "0.19.0"

# Formatting and Linting
"aqua:koalaman/shellcheck" = "0.11.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "v1.7.13-0.20260417151945-fd33e9f582a0"
taplo = "0.10.0"

# Release and Signing
git-cliff = "2.14.2"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]
RUSTC_WRAPPER = "{{ get_env(name='RUSTC_WRAPPER', default='') if get_env(name='CI', default='') else get_env(name='RUSTC_WRAPPER', default='sccache') }}"
SCCACHE_DIR = "{{ get_env(name='SCCACHE_DIR', default='') if get_env(name='CI', default='') else (get_env(name='LOCALAPPDATA', default=env.HOME ~ '/AppData/Local') if os() == 'windows' else get_env(name='XDG_CACHE_HOME', default=env.HOME ~ '/.cache')) ~ '/sccache' }}"
SCCACHE_CACHE_SIZE = "{{ get_env(name='SCCACHE_CACHE_SIZE', default='') if get_env(name='CI', default='') else '20G' }}"

# === Variables === #

[vars]

# === Entry Points === #

[tasks."prepare"]
description = "Prepare Locked Tools"
run = "uv run --locked --all-groups --project tools/python python -m harmos_tools.ci.tasks prepare"

[tasks."generate"]
description = "Generate Python Clients or SDK Protocol Bindings"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks generate"

[tasks."format"]
description = "Format Selected Languages"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks format"

[tasks."lint"]
description = "Lint Selected Languages"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks lint"

[tasks."check"]
description = "Check Formatting, Lint and Repository Contracts"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks check"

[tasks."build"]
description = "Build Products, Tests, Benchmarks or Fixtures"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks build"

[tasks."test"]
description = "Test Selected Languages and Layers"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks test"

[tasks."bench"]
description = "Benchmark Selected Layers"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks bench"

[tasks."package"]
description = "Package Selected Languages"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks package"

[tasks."release:prepare"]
description = "Prepare the Release Branch"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks release:prepare"

[tasks."release:tag"]
description = "Tag the Merged Release Review"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks release:tag"

[tasks."release:rehearse"]
description = "Rehearse Existing Release Packages"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks release:rehearse"

[tasks."release:publish"]
description = "Publish a Tagged Release"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks release:publish"

[tasks."release:verify"]
description = "Verify Published Release Assets"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks release:verify"

# === Internal Steps === #

[tasks."ci:pack"]
hide = true
description = "CI / Pack"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:pack"

[tasks."ci:extract"]
hide = true
description = "CI / Extract"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:extract"

[tasks."ci:summary"]
hide = true
description = "CI / Summary"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:summary"

[tasks."ci:nightly-gate"]
hide = true
description = "CI / Nightly Gate"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:nightly-gate"

[tasks."ci:nightly-report"]
hide = true
description = "CI / Nightly Report"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:nightly-report"

[tasks."ci:mirror"]
hide = true
description = "CI / Mirror"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:mirror"

[tasks."ci:runners"]
hide = true
description = "CI / Runners"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:runners"

[tasks."ci:release-mode"]
hide = true
description = "CI / Release Mode"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:release-mode"

[tasks."ci:review"]
hide = true
description = "CI / Review"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:review"

[tasks."ci:release-checks"]
hide = true
description = "CI / Release Checks"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:release-checks"

[tasks."ci:required"]
hide = true
description = "CI / Required"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks ci:required"

[tasks."prepare:tests:fixtures"]
hide = true
description = "Join Independently Built Product and Test Fixtures"
usage = '''
flag "--profile <profile>" default="dev"
flag "--focused-messages <path>"
flag "--libraries <names>"
flag "--inspection-messages <paths>"
flag "--inspections <names>"
'''
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.prepare.tests.fixtures --profile {{usage.profile}}{% if usage.focused_messages %} --focused-messages {{usage.focused_messages}} --libraries {{usage.libraries}}{% endif %}{% if usage.inspection_messages %} --inspection-messages {{usage.inspection_messages}} --inspections {{usage.inspections}}{% endif %}"

[tasks."format:python"]
hide = true
description = "Format Python"
usage = 'flag "--check"'
run = "uv run --locked --no-sync --project tools/python ruff format tools/python crates/harmos-packaging sdk/python{% if usage.check %} --check{% endif %}"

[tasks."format:rust"]
hide = true
description = "Format Rust"
usage = 'flag "--check"'
run = [
  "cargo fmt --all{% if usage.check %} --check{% endif %}",
  "cargo fmt --manifest-path examples/schematic/Cargo.toml --all{% if usage.check %} --check{% endif %}",
  "cargo fmt --manifest-path crates/harmos-guest/tests/fixtures/sandbox/Cargo.toml{% if usage.check %} --check{% endif %}",
]

[tasks."format:toml"]
hide = true
description = "Format TOML"
usage = 'flag "--check"'
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.format.toml{% if usage.check %} --check{% endif %}"

[tasks."lint:python"]
hide = true
description = "Lint Python"
run = [
  "uv run --locked --no-sync --project tools/python ruff check tools/python crates/harmos-packaging sdk/python",
  "uv run --locked --no-sync --project tools/python ty check --project tools/python tools/python",
  "uv run --locked --no-sync --project tools/python ty check --project sdk/python sdk/python",
]

[tasks."lint:rust"]
hide = true
description = "Lint Rust over Every Product and Tests Selection"
usage = 'flag "--extended"'
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --workspace --lib --bins --tests --profile test",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile dev --manifest-path examples/schematic/Cargo.toml -p schematic-cli -p schematic-sidecar",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile dev --manifest-path examples/schematic/Cargo.toml -p schematic-guest --target wasm32-unknown-unknown",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --manifest-path crates/harmos-guest/tests/fixtures/sandbox/Cargo.toml -p harmos-sandbox-guest --target wasm32-unknown-unknown",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --workspace --bins --benches --profile bench --features harmos-runtime/plugin-sidecar,harmos-runtime/plugin-guest,harmos-runtime/grpc{% if usage.extended %} --all-features{% endif %}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile bench --manifest-path examples/schematic/Cargo.toml -p schematic-sidecar",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile bench --manifest-path examples/schematic/Cargo.toml -p schematic-guest --features benchmark --target wasm32-unknown-unknown",
  "{% if usage.extended %}uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test -p harmos-domain --target wasm32-unknown-unknown{% endif %}",
  "{% if usage.extended %}uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test -p harmos-domain --target wasm32-wasip2{% endif %}",
  "{% if usage.extended %}uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --manifest-path examples/schematic/Cargo.toml -p schematic-domain --target wasm32-unknown-unknown{% endif %}",
  "{% if usage.extended %}uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --workspace --all-targets --no-default-features{% endif %}",
  "{% if usage.extended %}uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --workspace --examples --benches --all-features{% endif %}",
  "{% if usage.extended %}uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo -- --locked --profile test --manifest-path examples/schematic/Cargo.toml --workspace --all-targets{% endif %}",
]

[tasks."check:python:generated"]
hide = true
description = "Check Generated Python"
run = [
  "uv run --locked --no-sync --project tools/python ty check target/generated/python/src",
  "uv run --locked --no-sync --project tools/python ruff check --config tools/python/ruff.toml --extend-exclude=_wire target/generated/python/src",
  "uv run --locked --no-sync --project tools/python python -c \"import sys, pkgutil, importlib; sys.path.insert(0, 'target/generated/python/src'); [importlib.import_module(m.name) for m in pkgutil.walk_packages(['target/generated/python/src'])]\"",
]

[tasks."check:repository"]
hide = true
description = "Check Repository Configuration and Conventions"
run = [
  { task = "format:toml --check" },
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.mise",
  "shellcheck --version",
  "actionlint",
]

[tasks."check:rust"]
hide = true
description = "Check Rust"
run = ["cargo-machete --skip-target-dir"]

[tasks."build:rust:bench"]
hide = true
description = "Build Benchmark Executables"
usage = 'flag "--extended"'
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.benchmark_fixtures{% if usage.extended %} -- --all-features{% endif %}"

[tasks."build:rust:compatibility"]
hide = true
description = "Check Optional Local Compatibility Configurations"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo focused check --locked --profile test -p harmos-domain --target wasm32-unknown-unknown",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo focused check --locked --profile test -p harmos-domain --target wasm32-wasip2",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo focused check --locked --profile test --manifest-path examples/schematic/Cargo.toml -p schematic-domain --target wasm32-unknown-unknown",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo focused check --locked --profile test --workspace --all-targets --no-default-features",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo focused check --locked --profile test --workspace --examples --benches --all-features",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.cargo focused check --locked --profile test --manifest-path examples/schematic/Cargo.toml --workspace --all-targets",
]

[tasks."build:rust:tests"]
hide = true
description = "Build the Shared Test Archive and Fixtures"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.rust.tests --profile {{usage.profile}} --features harmos-runtime/plugin-sidecar",
]

[tasks."test:python:integration"]
hide = true
description = "Test Repository Tooling and Python SDK"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "uv run --locked --no-sync --project tools/python python -m unittest discover -s tools/python/tests/integration -v",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.ci.tasks test --language python --package harmos-plugin --target integration --profile {{usage.profile}}",
]

[tasks."check:python:sdk"]
hide = true
description = "Check Python SDK and Protocol Drift"
run = [
  "uv run --locked --no-sync --project tools/python ruff format sdk/python tools/python/src/harmos_tools/build/python_protocol.py tools/python/src/harmos_tools/ci/tasks.py --check",
  "uv run --locked --no-sync --project tools/python ruff check sdk/python tools/python/src/harmos_tools/build/python_protocol.py tools/python/src/harmos_tools/ci/tasks.py",
  "uv run --locked --no-sync --project tools/python ty check --project sdk/python sdk/python",
  "uv run --locked --no-sync --project tools/python ty check --project tools/python tools/python/src/harmos_tools/build/python_protocol.py tools/python/src/harmos_tools/ci/tasks.py",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.build.python_protocol --check",
]

[tasks."test:rust:unit"]
hide = true
description = "Test Unit Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category unit --language rust --profile {{usage.profile}}",
]

[tasks."test:rust:integration"]
hide = true
description = "Test Integration Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--filter <filter>"
flag "--stress-count <count>"
'''
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --category integration --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category integration --language rust --profile {{usage.profile}}{% if usage.filter or usage.stress_count %} --{% endif %}{% if usage.filter %} -E \"{{usage.filter}}\"{% endif %}{% if usage.stress_count %} --stress-count {{usage.stress_count}}{% endif %}",
]

[tasks."test:rust:acceptance"]
hide = true
description = "Test Acceptance Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --category acceptance --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category acceptance --language rust --profile {{usage.profile}}",
]

[tasks."test:rust:system"]
hide = true
description = "Test System Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.preflight --category system --profile {{usage.profile}}",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run test --category system --language rust --profile {{usage.profile}} -- --test-threads 1",
]

[tasks."bench:rust:unit"]
hide = true
description = "Bench Unit Rust"
usage = '''
flag "--refresh-baseline"
flag "--extended"
'''
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category unit --language rust --archive-argument=--features --archive-argument=harmos-runtime/plugin-sidecar,harmos-runtime/plugin-guest,harmos-runtime/grpc{% if usage.extended %} --archive-argument=--all-features{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

[tasks."bench:rust:integration"]
hide = true
description = "Bench Integration Rust"
usage = '''
flag "--refresh-baseline"
flag "--extended"
'''
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category integration --language rust --archive-argument=--features --archive-argument=harmos-runtime/plugin-sidecar,harmos-runtime/plugin-guest,harmos-runtime/grpc{% if usage.extended %} --archive-argument=--all-features{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

[tasks."bench:rust:system"]
hide = true
description = "Bench System Rust"
usage = '''
flag "--refresh-baseline"
flag "--extended"
'''
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.test.run bench --category system --language rust --archive-argument=--features --archive-argument=harmos-runtime/plugin-sidecar,harmos-runtime/plugin-guest,harmos-runtime/grpc{% if usage.extended %} --archive-argument=--all-features{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}"

[tasks."package:rust"]
hide = true
description = "Package Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.package.rust --profile {{usage.profile}}"

[tasks."release:publish:assets"]
hide = true
description = "Draft the Release with Its Signed Assets"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.release.run publish"

[tasks."release:publish:dry"]
hide = true
description = "Dry-Run Every Publication"
run = [
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.release.version check",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.release.run dry",
  "uv run --locked --no-sync --project tools/python python -m harmos_tools.release.run crates-dry",
]

[tasks."release:publish:finalize"]
hide = true
description = "Publish the Drafted Release"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.release.run finalize"

[tasks."release:publish:rust"]
hide = true
description = "Publish Rust Crates"
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.release.run crates"

[tasks."build:product"]
hide = true
description = "Build Packageable Products"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --no-sync --project tools/python python -m harmos_tools.build --profile {{usage.profile}}"
