# === Mise Tools === #

[tools]
taplo = "0.10.0"
python = "3.15.0"
uv = "0.13.0"
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt,llvm-tools,rust-analyzer", targets = [
  "wasm32-unknown-unknown",
  "wasm32-wasip2",
] }

"cargo:cargo-nextest" = "0.9.148"
"cargo:cargo-llvm-cov" = "0.9.1"

# Build Tools
sccache = "0.18.0"

# Versioning Tools
git-cliff = "2.14.2"

# === Mise Settings === #

[settings]
lockfile = true
github_attestations = false

# === Environment Variables === #

[env]
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
RUSTC_WRAPPER = "{% if os() == 'windows' %}{% else %}sccache{% endif %}"
CARGO_INCREMENTAL = "0"
TMPDIR = "/var/tmp"

# === Tasks | Setup === #

[vars]
cargo_guard = "{% if env.CI | default(value='false') == 'true' %}{% else %}stkr project housekeeping cargo-run -- {% endif %}"

[tasks."sync:tools"]
description = "Install Locked Repository Tooling Dependencies"
run = "uv sync --locked --project tools/python"

# === Tasks | Linting === #

[tasks."lint:rust"]
description = "Lint / Rust"
run = "{{vars.cargo_guard}}cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks."lint:rust:fix"]
description = "Lint / Rust / Fix"
run = [
  "{{vars.cargo_guard}}cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged",
]


# === Tasks | Formatting === #

[tasks."format:rust"]
description = "Format / Rust"
run = "{{vars.cargo_guard}}cargo fmt --all"

[tasks."format:rust:check"]
description = "Format / Rust / Check"
run = "{{vars.cargo_guard}}cargo fmt --all --check"


# === Tasks | Versioning === #

[tasks."changelog:preview"]
description = "Preview The Unreleased Conventional Commit Changelog."
run = "git-cliff --unreleased --strip all"

# === Tasks | Development === #

[tasks."check:wasm"]
description = "Check / Wasm"
# Portable Contracts And Guest SDKs Must Build Without The Host Runtime.
run = [
  "{{vars.cargo_guard}}cargo check --locked -p harmos-domain --target wasm32-unknown-unknown",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-domain --target wasm32-wasip2",
  "{{vars.cargo_guard}}cargo check --locked --manifest-path examples/schematic/Cargo.toml -p schematic-domain --target wasm32-unknown-unknown",
  "{{vars.cargo_guard}}cargo check --locked --manifest-path examples/schematic/Cargo.toml -p schematic-guest --target wasm32-unknown-unknown",
]

[tasks."check:sidecar:bench"]
description = "Check / Sidecar / Bench"
run = "{{vars.cargo_guard}}cargo clippy --locked -p harmos-sidecar --features kit --bench transport --test transport --bin harmos-sidecar-throughput-fixture -- -D warnings"

# === Tasks | Build === #

[tasks."build:workspace:release"]
env.STKR_TEST_PROFILE = "release"
description = "Build / Release"
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages build"

# === Tasks | Docs === #

# === Tasks | Tests === #

# === Tasks | Stats === #

[tasks.stats]
description = "Project Statistics"
tools."aqua:boyter/scc" = "4.1.0"
run = "scc --include-ext rs --avg-wage 100000 --cocomo-project-type semi-detached"

[tasks."check:authoring"]
description = "Check / Authoring"
run = "{{vars.cargo_guard}}cargo check --locked --workspace --all-targets --all-features"

[tasks."check:plugin"]
description = "Check / Plugin"
run = [
  "{{vars.cargo_guard}}cargo check --locked -p harmos --features plugin --lib",
  "{{vars.cargo_guard}}cargo clippy --locked -p harmos --features plugin-sidecar,plugin-guest --all-targets -- -D warnings",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-domain --features derive --target wasm32-unknown-unknown",
]

[tasks."lint:authoring"]
description = "Lint / Authoring"
run = "{{vars.cargo_guard}}cargo clippy --locked -p harmos-macros --all-targets -- -D warnings"

[tasks."format:python"]
run = "uv run --locked --project tools/python ruff format --config tools/python/pyproject.toml tools/python crates/harmos-domain/src/bindings/python crates/harmos-domain/tests/grpc/python.py"

[tasks."format:python:check"]
run = "uv run --locked --project tools/python ruff format --check --config tools/python/pyproject.toml tools/python crates/harmos-domain/src/bindings/python crates/harmos-domain/tests/grpc/python.py"

[tasks."lint:python"]
run = "uv run --locked --project tools/python ruff check --config tools/python/pyproject.toml tools/python crates/harmos-domain/src/bindings/python crates/harmos-domain/tests/grpc/python.py"

[tasks."build:workspace:dev"]
run = "{{vars.cargo_guard}}cargo build --locked --workspace --timings"

[tasks."check:types:python"]
run = "uv run --locked --project tools/python --group test ty check --project tools/python --extra-search-path crates/harmos-domain/src/bindings tools/python crates/harmos-domain/src/bindings/python"

# === Tasks | Continuous Integration === #

[tasks."sync:rust"]
description = "Fetch The Complete Locked Native Dependency Graph"
run = "{{vars.cargo_guard}}cargo fetch --locked"

[tasks."sync"]
description = "Prepare Locked Repository Tools And Dependencies"
run = [{ task = "sync:tools" }, { task = "sync:rust" }]


[tasks."lint"]
description = "Lint"
run = [{ task = "lint:rust" }, { task = "lint:python" }]


[tasks."lint:fix"]
description = "Lint / Fix"
run = [
  { task = "lint:rust:fix" },
  "uv run --locked --project tools/python ruff check --fix tools/python",
]

[tasks."format:toml"]
description = "Format Maintained TOML"
run = "taplo fmt"

[tasks."format:toml:check"]
description = "Check Maintained TOML Formatting"
run = "taplo fmt --check"

[tasks."format"]
description = "Format"
run = [{ task = "format:toml" }, { task = "format:rust" }, { task = "format:python" }]


[tasks."format:check"]
description = "Format / Check"
run = [
  { task = "format:toml:check" },
  { task = "format:rust:check" },
  { task = "format:python:check" },
]

[tasks."check:features"]
description = "Check / Every Facility Feature On Its Own"
# Resolve Every Optional Host Facility Independently.
run = [
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features plugin",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features plugin-sidecar",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features plugin-guest",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features grpc",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features reflection",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features signal",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features signal-fft",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features simulation",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features packaging",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features packaging-sidecar",
  "{{vars.cargo_guard}}cargo check --locked -p harmos --no-default-features --features packaging-guest",
  "{{vars.cargo_guard}}cargo check --locked -p cargo-harmos --no-default-features",
  "{{vars.cargo_guard}}cargo check --locked -p cargo-harmos --no-default-features --features sidecar",
  "{{vars.cargo_guard}}cargo check --locked -p cargo-harmos --no-default-features --features guest",
  "{{vars.cargo_guard}}cargo check --locked -p cargo-harmos --no-default-features --features sidecar,guest",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-bundle",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-domain --no-default-features",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-guest --no-default-features --features kit,derive,streaming",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-guest --no-default-features --features componentize",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-sidecar --no-default-features",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-sidecar --no-default-features --features transport --all-targets",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-sidecar --no-default-features --features kit --lib",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-signal --no-default-features --all-targets",
  "{{vars.cargo_guard}}cargo check --locked -p harmos-signal --no-default-features --features fft --all-targets",
]


[tasks."check:fast"]
description = "Check Source Without Compiling Product Targets"
# Source Jobs Install No Compiler Cache.
env = { RUSTC_WRAPPER = "" }
depends = ["sync:tools"]
run = [
  { task = "format:check" },
  { task = "lint:python" },
  { task = "check:types" },
]

[tasks."check:compiled"]
description = "Check Native And Portable Compilation Contracts"
depends = ["sync:rust"]
run = [
  { task = "lint:rust" },
  # lint:rust already compiles these targets; keep distinct feature/target checks.
  { task = "check:features" },
  { task = "check:wasm" },
  { task = "check:plugin" },
]

[tasks."check"]
description = "Check"
run = [{ task = "check:fast" }, { task = "check:compiled" }]

[tasks."build:ci"]
description = "Check Compiled Targets And Build Development Assets"
run = [
  { task = "check:compiled" },
  { task = "build:dev" },
  { task = "build:acceptance:dev" },
]

[tasks."ci:feature"]
description = "Check Feature Branch Source Without Compiling Product Targets"
run = [{ task = "check:fast" }]


[tasks.build]
description = "Build The Workspace And The Schematic Fixture Once And Stamp Them"
run = "uv run --locked --project tools/python python -m harmos_tools.build.fixtures"

[tasks."test:integration:rust"]
# Bound Concurrent Guest Compilers To Avoid Oversubscribing The Host.
env = { NEXTEST_TEST_THREADS = "4" }
run = [
  "uv run --locked --project tools/python python -m harmos_tools.test.preflight",
  "{{vars.cargo_guard}}uv run --locked --project tools/python --group test python -m harmos_tools.evidence run integration rust --all-features",
]


[tasks."test:acceptance:python"]
wait_for = ["test:integration"]
depends = [
  "{% if env.CI | default(value='false') == 'true' %}packages:verify{% else %}build:acceptance:dev{% endif %}",
]
run = [
  "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.evidence run acceptance python",
]


[tasks."bench:python"]
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.evidence bench python"


[tasks."bench:rust"]
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.evidence bench rust"

[tasks."check:types"]
run = [{ task = "check:types:python" }]


[tasks."build:acceptance:dev"]
run = [
  "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages build",
  "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages stage",
]

[tasks."build:dev"]
run = [{ task = "build:workspace:dev" }]


[tasks."build:release"]
env.STKR_TEST_PROFILE = "release"
depends = ["sync", "ci:bootstrap"]
run = [
  { task = "build:workspace:release" },
  "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages stage",
]


[tasks."ci:bootstrap"]
description = "Verify Platform Prerequisites"
run = "python tools/python/src/harmos_tools/pipelines/bootstrap.py"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/bootstrap.ps1"

[tasks."packages:verify"]
depends = ["sync"]
description = "Verify Exact Release Package Inputs And Assets"
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages verify"

[tasks."packages:restore"]
depends = ["sync"]
description = "Verify Transferred Packages And Restore Native Executable Permissions"
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages restore"

[tasks."packages:validate"]
description = "Associate Complete Native Test Evidence With Release Assets"
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages validate"

[tasks."packages:reuse"]
depends = ["sync"]
description = "Reuse Exact Validated Assets From One Native Validation Run"
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages reuse"

[tasks."packages:development"]
depends = ["sync"]
description = "Verify Linux Development Proof Without Release Promotion"
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages development"

[tasks."packages:export"]
description = "Export Platform Assets And Retained Diagnostics"
run = "{{vars.cargo_guard}}uv run --locked --project tools/python python -m harmos_tools.packages export"

[tasks.bench]
description = "Bench"

[[tasks.bench.run]]
task = "bench:rust"

[[tasks.bench.run]]
task = "bench:python"

[tasks.test]
description = "Test"
depends = ["test:integration", "test:acceptance"]

[tasks."test:acceptance"]
description = "Test Acceptance"
depends = ["test:acceptance:python"]

[tasks."test:integration"]
description = "Test Integration"
depends = ["test:integration:rust", "test:integration:python"]

[tasks."test:integration:python"]
description = "Test Integration Python"
wait_for = ["test:integration:rust"]
run = "uv run --locked --project tools/python python -m harmos_tools.evidence run integration python"


[tasks."ci:mirror"]
description = "Mirror Published GitHub Branch To GitLab"
run = """
set -eu
case "${GITHUB_REF_NAME:?}" in dev|main) ;; *) exit 1 ;; esac
test "${GITHUB_REPOSITORY:?}" = "stokker-technologies/harmos"
test "$(git rev-parse HEAD)" = "${GITHUB_SHA:?}"
git push --no-force --no-follow-tags git@gitlab.com:stokker-technologies/open-source/harmos.git "HEAD:refs/heads/${GITHUB_REF_NAME}"
"""
