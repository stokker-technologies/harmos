# Raw CLI Products And Explicit ZIP Bundles Are Optional Authored Package Policy.
# [[package.executables]]
# package = "cargo-example"
# command = "cargo-example"
# name = "cargo-example"
# targets = { linux-x86_64 = "x86_64-unknown-linux-gnu" }
# release = true
# verify = ["--version"]
# installers = []

# [[package.bundles]]
# language = "rust"
# name = "plugins-{version}-{target}.zip"
# profiles = ["dev", "release"]
# targets = ["linux-x86_64"]
# release = true
# inputs = [{ path = "target/build/{profile}/{target}/plugins/example.bin", destination = "plugins/example.bin" }]

