# Project Policy Owned By The Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === === Project === === #

[project]
name = "Harmos"
visibility = "public"
platforms = ["linux", "windows"]

# === === Languages === === #

[languages.rust]
roots = ["crates", "examples"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip2"]
exclude = ["crates/cargo-harmos/templates"]

[languages.python]
roots = ["tools/python"]
generated = ["target/generated/python/src"]
exclude = [".venv", "tools/python/.ruff_cache"]

# === === Repository === === #

[housekeeping.branches]
exclude = ["main", "master", "dev", "develop", "release/**"]

# === === CI === === #

[ci.runners]
linux = "ubuntu-24.04"
windows = "windows-2022"

# --- Impact --- #

[ci.impact]
default = "full"

[[ci.impact.rules]]
name = "guidance"
include = [
  "**/skills/**",
  "**/.agents/**",
  "**/.codex/**",
  "**/.claude/**",
  "**/AGENTS.md",
  "**/CLAUDE.md",
  "**/.github/copilot-instructions.md",
  "**/README.md",
  "**/readme.md",
  "**/CONTRIBUTING.md",
  "**/contributing.md",
]
jobs = []

[[ci.impact.rules]]
name = "prose"
include = ["LICENSE", "LICENSE.*", "docs/**/*.md"]
exclude = [
  "docs/examples/**",
  "docs/tutorials/**",
  "docs/src/**",
  "**/skills/**",
  "**/.agents/**",
  "**/.codex/**",
  "**/.claude/**",
  "**/AGENTS.md",
  "**/CLAUDE.md",
  "**/.github/copilot-instructions.md",
  "**/README.md",
  "**/readme.md",
  "**/CONTRIBUTING.md",
  "**/contributing.md",
]
jobs = ["check:repository"]

# --- Stage / Check --- #

[[ci.jobs]]
id = "check:python:generated"
inputs = ["build#product"]

# --- Stage / Build --- #

[[ci.jobs]]
id = "build"
outputs.product = [
  "target/build/{profile}/{target}/bin",
  "target/build/{profile}/{target}/lib",
  "target/build/{profile}/{target}/product",
  "target/generated/python/pyproject.toml",
  "target/generated/python/src",
]

[[ci.jobs]]
id = "build:rust:tests"
outputs.tests = ["target/build/{profile}/{target}/tests/archive.tar.zst", "target/build/{profile}/{target}/tests/compiler.json"]
outputs.fixtures = ["target/build/{profile}/{target}/fixtures"]

[[ci.jobs]]
id = "build:rust:bench"
outputs.bench = ["target/build/bench/{target}/bench", "target/build/bench/{target}/bin", "target/build/bench/{target}/fixtures"]

# --- Stage / Prepare --- #

[[ci.jobs]]
id = "prepare:tests:fixtures"
inputs = ["build#product", "build:rust:tests#fixtures"]
outputs.fixtures = ["target/build/{profile}/{target}/fixtures"]

# --- Stage / Test --- #

[[ci.jobs]]
id = "test:rust:unit"
inputs = ["build:rust:tests#tests"]

[[ci.jobs]]
id = "test:rust:integration"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures"]

[[ci.jobs]]
id = "test:rust:acceptance"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures", "build#product"]

[[ci.jobs]]
id = "test:rust:system"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures", "build#product"]

[[ci.jobs]]
id = "test:rust:starter"
pipelines = ["nightly"]
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures", "build#product"]

[[ci.jobs]]
id = "test:rust:coverage"
inputs = ["build:rust:tests#tests", "prepare:tests:fixtures#fixtures", "build#product"]

# --- Stage / Bench --- #

[[ci.jobs]]
id = "bench:rust:unit"
inputs = ["build:rust:bench#bench"]

[[ci.jobs]]
id = "bench:rust:integration"
inputs = ["build:rust:bench#bench"]

[[ci.jobs]]
id = "bench:rust:system"
inputs = ["build:rust:bench#bench"]

# --- Stage / Package --- #

[[ci.jobs]]
id = "package:rust"
inputs = ["build#product"]
outputs.package = ["target/package/{profile}/{target}"]

# --- Stage / Release --- #

[[ci.jobs]]
id = "release:publish:dry"
inputs = ["package:rust#package"]

[[ci.jobs]]
id = "release:rehearse"
inputs = ["package:rust#package"]

[[ci.jobs]]
id = "release:publish"
inputs = ["package:rust#package"]

[[ci.jobs]]
id = "release:verify"
inputs = ["package:rust#package"]

# === === Hooks === === #

[hooks]
step_timeout_seconds = 600

# === === Conventions === === #

# Declaration-Only Contracts Have No Runtime Work To Trace.
[conventions.rust]
exclude = ["schematic-domain"]

[conventions.testing.limits]
unit = 512
# The Runtime Crate Alone Owns About 660 Curated Stories.
integration = 1024
acceptance = 128
system = 64

[conventions.testing.deadlines]
unit = 120
integration = 120
acceptance = 900
system = 900

[[conventions.testing.overrides]]
