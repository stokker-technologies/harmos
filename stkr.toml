# Project Policy Owned By The Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === Project === #

[project]
name = "Harmos"
visibility = "public"
platforms = ["linux", "windows"]

# === Languages === #

[languages.rust]
roots = ["crates", "examples"]
exclude = ["crates/cargo-harmos/templates"]

[languages.python]
roots = ["tools/python"]
generated = ["target/fixtures/generated/python/src"]
exclude = ["tools/python/.venv", "tools/python/.ruff_cache"]


# === Repository === #

[housekeeping.branches]
exclude = ["main", "master", "dev", "develop", "release/**"]


# === CI === #

[ci.runners]
linux = ["ubuntu-24.04"]
windows = ["windows-2022"]
nightly = ["stokker-local-linux-x64"]

[ci.setup]
linux = ["command -v cc", "command -v pkg-config"]
windows = [
  '''
$before = @{}
Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
. ./tools/ci/bootstrap.ps1
Get-ChildItem Env: | Where-Object { $_.Name -notmatch '^(GITHUB_|RUNNER_|PATH$)' -and $before[$_.Name] -ne $_.Value } | ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
$env:PATH.Substring(0, $env:PATH.Length - $before['PATH'].Length).TrimEnd(';') -split ';' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
''',
]


# === Agents === #


# === Hooks === #

[hooks]
step_timeout_seconds = 600


# === Conventions === #

# Declaration-Only Contracts Have No Runtime Work To Trace.
[conventions.rust]
exclude = ["schematic-domain"]

[conventions.testing.limits]
unit = 512
integration = 256
acceptance = 128
system = 64


[barrels]
exclude = ["crates/harmos-runtime/src/prelude.rs"]

# === Templates === #


# === Release === #


# === Documentation === #


# === Screenshots === #


# === Catalogs === #


# === PyO3 === #

[[templates.scaffolds]]
path = "crates/cargo-harmos/templates/sidecar"
profile = "sidecar"
suffix = ""
tasks = "crates/cargo-harmos/scaffold-sidecar.tasks.toml"

[templates.scaffolds.placeholders]
package = "__PACKAGE_NAME__"
module = "__RUST_MODULE__"
product = "__PRODUCT_NAME__"

[[templates.scaffolds]]
path = "crates/cargo-harmos/templates/guest"
profile = "guest"
suffix = ""
tasks = "crates/cargo-harmos/scaffold-guest.tasks.toml"

[templates.scaffolds.placeholders]
package = "__PACKAGE_NAME__"
module = "__RUST_MODULE__"
product = "__PRODUCT_NAME__"
