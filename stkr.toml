# Project Policy Owned By The Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === Project === #

[project]
name = "Harmos"
visibility = "public"


# === Repository === #

[housekeeping.branches]
exclude = ["main", "master", "dev", "develop", "release/**"]


# === CI === #


# === Agents === #


# === Hooks === #

[hooks]
step_timeout_seconds = 600


# === Conventions === #

# Declaration-Only Contracts Have No Runtime Work To Trace.
[conventions.rust]
exclude = ["schematic-domain"]

[conventions.testing.limits]
unit = 512
integration = 256
acceptance = 128
system = 64

[conventions.ci.multitask]
"test_linux" = ["packages:restore", "test", "packages:validate", "packages:export"]
"test_windows" = ["packages:restore", "test", "packages:validate", "packages:export"]


[barrels]
exclude = ["crates/harmos-runtime/src/prelude.rs"]

# === Templates === #


# === Release === #


# === Documentation === #


# === Screenshots === #


# === Catalogs === #


# === PyO3 === #

[[templates.scaffolds]]
path = "crates/cargo-harmos/templates/sidecar"
profile = "sidecar"
suffix = ""
tasks = "crates/cargo-harmos/scaffold-sidecar.tasks.toml"

[templates.scaffolds.placeholders]
package = "__PACKAGE_NAME__"
module = "__RUST_MODULE__"
product = "__PRODUCT_NAME__"

[[templates.scaffolds]]
path = "crates/cargo-harmos/templates/guest"
profile = "guest"
suffix = ""
tasks = "crates/cargo-harmos/scaffold-guest.tasks.toml"

[templates.scaffolds.placeholders]
package = "__PACKAGE_NAME__"
module = "__RUST_MODULE__"
product = "__PRODUCT_NAME__"
