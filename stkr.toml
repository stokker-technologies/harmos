# Project Policy Owned By The Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === === Project === === #

[project]
name = "Harmos"
visibility = "public"
platforms = ["linux", "windows"]

# === === Languages === === #

[languages.rust]
roots = ["crates", "examples"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip2"]
exclude = ["crates/cargo-harmos/templates"]

[languages.python]
roots = ["tools/python"]
generated = ["target/generated/python/src"]
exclude = [".venv", "tools/python/.ruff_cache"]

# === === Repository === === #

[housekeeping.branches]
exclude = ["main", "master", "dev", "develop", "release/**"]

# === === CI === === #

[ci.runners]
linux = "ubuntu-24.04"
windows = "windows-2022"

# --- Impact --- #

[ci.impact]
default = "full"

# --- Stage / Check --- #

[[ci.jobs]]
id = "check:rust"
platform = "linux"
runner = "stokker-local-linux-x64"

[[ci.jobs]]
id = "check:rust"
platform = "windows"
runner = "stokker-local-windows-x64"

# --- Stage / Build --- #

[[ci.jobs]]
id = "build"
platform = "linux"
runner = "stokker-local-linux-x64"

[[ci.jobs]]
id = "build"
platform = "windows"
runner = "stokker-local-windows-x64"

[[ci.jobs]]
id = "build:rust:tests"
platform = "linux"
runner = "stokker-local-linux-x64"

[[ci.jobs]]
id = "build:rust:tests"
platform = "windows"
runner = "stokker-local-windows-x64"

[[ci.jobs]]
id = "build:rust:bench"
platform = "linux"
runner = "stokker-local-linux-x64"

# --- Stage / Test --- #

[[ci.jobs]]
id = "test:rust:acceptance"
platform = "linux"
runner = "stokker-local-linux-x64"

[[ci.jobs]]
id = "test:rust:acceptance"
platform = "windows"
runner = "stokker-local-windows-x64"

[[ci.jobs]]
id = "test:rust:coverage"
platform = "linux"
runner = "stokker-local-linux-x64"

# --- Stage / Release --- #

[[ci.jobs]]
id = "release:publish:dry"
platform = "linux"
runner = "stokker-local-linux-x64"

[[ci.jobs]]
id = "release:rehearse"
platform = "linux"
runner = "stokker-local-linux-x64"

[[ci.jobs]]
id = "release:tag"
platform = "linux"
runner = "stokker-local-linux-x64"

# === === Hooks === === #

[hooks]
step_timeout_seconds = 600

# === === Conventions === === #

# Declaration-Only Contracts Have No Runtime Work To Trace.
[conventions.rust]
exclude = ["schematic-domain"]

[conventions.testing.limits]
unit = 512
# The Runtime Crate Alone Owns About 660 Curated Stories.
integration = 1024
acceptance = 128
system = 64

[[conventions.testing.overrides]]
category = "system"
language = "rust"
select = "binary_id(=harmos-guest::system) & test(=publication_crosses_row)"
timeout_seconds = 10
reason = "Three times the prior native story measurement of 1.495s with the 10s floor"

